<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3B3ED8">
<title>MoviApp</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --blue:#3B3ED8;--blue-dark:#2B2D8C;--blue-light:#5558E8;--blue-faint:#EEEEFF;
  --yellow:#FFD600;--yellow-dark:#E8C200;--yellow-faint:#FFFBDA;
  --pink:#E83A8C;--pink-faint:#FDE8F3;
  --surface:#fff;--bg:#F5F5FF;--border:#E0E0F8;
  --text:#1A1A3E;--text2:#5A5A8A;--text3:#9898BC;
  --green:#22C47A;--danger:#E83A3A;
  --radius:16px;--radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--blue)}
body{font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}

/* ── App container ── */
#app{
  width:100%;max-width:480px;min-height:100vh;min-height:100dvh;
  background:var(--bg);display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}

/* ── Toast ── */
#toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);
  background:#1A1A3E;color:#fff;padding:10px 20px;border-radius:30px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:.2s;white-space:nowrap;z-index:9999;max-width:90vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Login ── */
.login-wrap{
  min-height:100vh;min-height:100dvh;background:var(--blue);
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse 120% 60% at 50% -10%,#4547E8 0%,#1E1FA8 55%,#10115C 100%)}
.login-rings{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);pointer-events:none}
.ring{position:absolute;border-radius:50%;border:1.5px solid rgba(255,214,0,.2);left:0;top:0;transform:translate(-50%,-50%);animation:ringOut 3.2s ease-out infinite}
@keyframes ringOut{0%{opacity:.7;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.login-hero{position:absolute;top:0;left:0;right:0;bottom:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.login-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:64px;color:#FFD600;letter-spacing:-2px;line-height:1;text-shadow:0 0 50px rgba(255,214,0,.4);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.login-sub{font-size:14px;color:rgba(255,255,255,.55);margin-top:12px;letter-spacing:2px;text-transform:uppercase}
.sig-bars{display:flex;align-items:flex-end;gap:4px;margin-top:24px}
.sig-bar{width:5px;border-radius:3px;background:#FFD600;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
.login-card{background:#fff;border-radius:28px 28px 0 0;padding:30px 24px 36px;position:relative;z-index:2;margin-top:auto}
.login-card h2{font-family:'Nunito',sans-serif;font-weight:800;font-size:20px;color:var(--text);margin-bottom:4px}
.login-card p{font-size:13px;color:var(--text2);margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:15px;background:var(--bg);color:var(--text)}
.field input:focus{outline:none;border-color:var(--blue)}
.btn-yellow{width:100%;padding:15px;border:none;border-radius:var(--radius-sm);background:var(--yellow);color:var(--blue-dark);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:.12s}
.btn-yellow:active{background:var(--yellow-dark)}
.login-hint{text-align:center;margin-top:14px;font-size:12.5px;color:var(--text2)}
.login-hint b{color:var(--blue);cursor:pointer;font-weight:700}

/* ── Header ── */
.header{background:var(--blue);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 30px;position:relative;overflow:hidden;flex-shrink:0}
.header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:26px;background:var(--bg);border-radius:22px 22px 0 0}
.header-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start}
.hi-greet{color:rgba(255,255,255,.65);font-size:12.5px;font-weight:500}
.hi-name{color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.2px;margin-top:2px}
.hi-avatar{width:40px;height:40px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--blue-dark);cursor:pointer;flex-shrink:0}
.h-right{display:flex;gap:8px;align-items:center}
.notif-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.notif-btn svg{width:18px;height:18px;color:#fff}
.nb-dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);position:absolute;top:8px;right:8px;border:2px solid var(--blue)}
.page-title{color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:18px}

/* ── Scroll body ── */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px calc(80px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.body::-webkit-scrollbar{display:none}

/* ── Tab bar ── */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:1.5px solid var(--border);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0}
.tab svg{width:22px;height:22px;color:var(--text3);transition:.15s}
.tab span{font-size:10px;font-weight:700;color:var(--text3);transition:.15s}
.tab.active svg{color:var(--blue)}
.tab.active span{color:var(--blue)}

/* ── Cards ── */
.card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--border)}
.card-head{padding:16px 18px 0;display:flex;justify-content:space-between;align-items:center}
.card-title{font-weight:700;font-size:13.5px;color:var(--text)}
.card-link{font-size:12px;font-weight:700;color:var(--blue-light);cursor:pointer}
.card-body{padding:14px 18px 18px}

/* ── Conn card ── */
.conn-card{background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:var(--radius);padding:22px;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 8px 24px rgba(59,62,216,.3)}
.led{width:8px;height:8px;border-radius:50%;display:inline-block}
.led.on{background:#22C47A;box-shadow:0 0 0 3px rgba(34,196,122,.25);animation:pulse 2.5s infinite}
.led.off{background:#ff6b6b}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(34,196,122,.25)}50%{box-shadow:0 0 0 7px rgba(34,196,122,.08)}}
.conn-speed{font-family:'Nunito',sans-serif;font-weight:900;font-size:40px;color:#fff;letter-spacing:-1.5px;line-height:1}
.conn-mbps{font-size:14px;font-weight:600;color:rgba(255,255,255,.6);margin-left:3px}
.conn-plan{font-size:11.5px;color:rgba(255,255,255,.55);margin-top:5px}
.conn-pill{background:rgba(255,214,0,.15);border:1px solid rgba(255,214,0,.3);padding:6px 12px;border-radius:30px;font-size:11px;font-weight:700;color:var(--yellow)}

/* ── Quick actions ── */
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa{background:#fff;border-radius:var(--radius-sm);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border:1.5px solid var(--border);transition:.12s}
.qa:active{border-color:var(--blue);background:var(--blue-faint)}
.qa-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.qa-lbl{font-size:10.5px;font-weight:700;color:var(--text2);text-align:center;line-height:1.3}

/* ── Fatura ── */
.fat-hero{background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:14px;padding:22px;margin-bottom:14px;position:relative;overflow:visible;min-height:130px}
.fat-val{font-family:'DM Mono',monospace;font-size:34px;font-weight:600;color:#fff;line-height:1.1;display:block;margin:8px 0}
.fat-badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:700;margin-top:10px}
.fat-badge.aberta{background:rgba(255,214,0,.2);border:1px solid rgba(255,214,0,.35);color:var(--yellow)}
.fat-badge.paga{background:rgba(34,196,122,.2);border:1px solid rgba(34,196,122,.3);color:#22C47A}
.btn-yellow-full{width:100%;padding:14px;border-radius:var(--radius-sm);border:none;background:var(--yellow);color:var(--blue-dark);font-family:inherit;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.12s;margin-bottom:8px}
.btn-yellow-full:active{background:var(--yellow-dark)}
.btn-outline{width:100%;padding:13px;border-radius:var(--radius-sm);border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-family:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1.5px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.pill.paga{background:#E8FBF2;color:#1A8C52}
.pill.aberta{background:var(--yellow-faint);color:#8A7000}

/* ── OS ── */
.os-item{display:flex;gap:14px;padding-bottom:20px}
.os-item:last-child{padding-bottom:0}
.os-line{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.os-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--border);background:#fff}
.os-dot.andamento{background:var(--blue);border-color:var(--blue)}
.os-dot.concluida{background:var(--green);border-color:var(--green)}
.os-dot svg{width:15px;height:15px;color:#fff}
.os-connector{width:2px;flex:1;background:var(--border);margin:4px 0;min-height:12px}
.os-tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;margin-top:7px}
.os-tag.andamento{background:var(--blue-faint);color:var(--blue)}
.os-tag.concluida{background:#E8FBF2;color:#1A8C52}
.os-tag.agendada{background:#FDF6E3;color:#8A6200}

/* ── Cashback ── */
.cb-hero{background:linear-gradient(135deg,var(--blue-dark) 0%,var(--pink) 100%);border-radius:var(--radius);padding:24px;position:relative;overflow:hidden;margin-bottom:14px}
.cb-hero::after{content:'💸';position:absolute;right:-8px;bottom:-18px;font-size:88px;opacity:.15;line-height:1}
.cb-val{font-family:'DM Mono',monospace;font-size:38px;font-weight:500;color:#fff;line-height:1}
.cb-btn{margin-top:16px;padding:12px 16px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:10px;font-size:13px;font-weight:700;color:#fff;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.link-box{background:#fff;border:1.5px dashed var(--blue);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.link-url{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-copy{padding:8px 14px;background:var(--yellow);color:var(--blue-dark);font-size:12px;font-weight:800;border:none;border-radius:8px;cursor:pointer;flex-shrink:0;font-family:inherit}
.btn-share{width:100%;padding:13px;border-radius:var(--radius-sm);border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-family:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.ind-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1.5px solid var(--border)}
.ind-item:last-child{border-bottom:none}
.ind-ava{width:36px;height:36px;border-radius:50%;background:var(--blue-faint);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.ind-credit{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--green);margin-left:auto}

/* ── Misc ── */
.empty-txt{text-align:center;color:var(--text3);padding:20px;font-size:13px}
.sec-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:12px}
.how-box{background:var(--blue-faint);border-radius:12px;padding:16px}
.how-title{font-weight:800;font-size:13px;color:var(--blue);margin-bottom:6px}
.how-txt{font-size:12.5px;color:var(--blue-dark);line-height:1.6;opacity:.85}
.mono{font-family:'DM Mono',monospace}
.cb-teaser{background:linear-gradient(135deg,var(--blue-dark),var(--pink));border-radius:var(--radius);padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer}
.btn-pix{width:100%;padding:15px;border-radius:var(--radius-sm);border:none;background:linear-gradient(135deg,#00B89F,#00A896);color:#fff;font-family:inherit;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;margin-bottom:8px;box-shadow:0 6px 18px rgba(0,168,150,.3);transition:.12s}
.btn-pix:active{transform:scale(.99)}
.pix-overlay{position:fixed;inset:0;background:rgba(15,15,50,.6);z-index:9998;display:none;align-items:flex-end;justify-content:center}
.pix-overlay.show{display:flex}
.pix-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));animation:sheetUp .25s ease}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.pix-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.pix-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:18px;text-align:center;color:var(--text)}
.pix-val{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;text-align:center;color:var(--blue);margin:6px 0 18px}
.pix-qr{width:200px;height:200px;margin:0 auto 18px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center}
.pix-qr canvas,.pix-qr img{width:100%!important;height:100%!important}
.pix-loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0;color:var(--text2)}
.pix-spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pix-copy-box{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);word-break:break-all;margin-bottom:14px;max-height:70px;overflow-y:auto}
.pix-instr{font-size:12px;color:var(--text2);text-align:center;margin-bottom:18px;line-height:1.5}
.btn-pix-copy{width:100%;padding:14px;border-radius:var(--radius-sm);border:none;background:var(--blue);color:#fff;font-family:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn-pix-close{width:100%;padding:13px;margin-top:8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:transparent;color:var(--text2);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}

.chamado-overlay{position:fixed;inset:0;background:rgba(15,15,50,.6);z-index:9998;display:none;align-items:flex-end;justify-content:center}
.chamado-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));animation:sheetUp .25s ease}
.chamado-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.chamado-textarea{width:100%;min-height:120px;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-family:inherit;font-size:14px;resize:none;line-height:1.5;color:var(--text)}
.chamado-textarea:focus{outline:none;border-color:var(--blue)}
.chamado-erro{display:none;background:#FBF0EE;border:1px solid #f0c8c2;border-radius:8px;padding:10px 14px;font-size:12.5px;color:#c23b2a;margin:10px 0}

.status-timeline{display:flex;align-items:center;gap:0;margin-top:12px;padding:12px 0 4px}
.st-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.st-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;z-index:1;flex-shrink:0}
.st-dot.ativo{background:var(--blue);border-color:var(--blue)}
.st-dot.concluido{background:var(--green);border-color:var(--green)}
.st-dot svg{width:11px;height:11px;color:#fff}
.st-label{font-size:9.5px;font-weight:600;color:var(--text3);margin-top:5px;text-align:center;line-height:1.2}
.st-label.ativo{color:var(--blue)}
.st-label.concluido{color:var(--green)}
.st-line{flex:1;height:2px;background:var(--border);margin:0 -2px;margin-bottom:16px}
.st-line.ativo{background:var(--blue)}
.st-line.concluido{background:var(--green)}

/* ── Assistente IA ─────────────────────────────── */
.ia-fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px) + 16px);right:18px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#8B5CF6);box-shadow:0 4px 20px rgba(99,102,241,.5);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:900;transition:.2s}
.ia-fab:active{transform:scale(.93)}
.ia-fab svg{width:24px;height:24px;color:#fff}
.ia-overlay{position:fixed;inset:0;background:rgba(10,10,30,.6);z-index:9998;display:none;align-items:flex-end;justify-content:center}
.ia-overlay.show{display:flex}
.ia-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;height:80vh;display:flex;flex-direction:column;animation:sheetUp .25s ease}
.ia-head{padding:18px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.ia-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ia-head-info{flex:1}
.ia-head-title{font-weight:800;font-size:15px;color:var(--text)}
.ia-head-sub{font-size:11px;color:var(--text2)}
.ia-close{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px}
.ia-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.ia-msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.5}
.ia-msg.bot{background:var(--blue-faint);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.ia-msg.user{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ia-msg.typing{display:flex;align-items:center;gap:4px;padding:14px}
.ia-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:iaDot 1.2s infinite}
.ia-dot:nth-child(2){animation-delay:.2s}
.ia-dot:nth-child(3){animation-delay:.4s}
@keyframes iaDot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.ia-input-row{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.ia-input{flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:22px;font-family:inherit;font-size:14px;outline:none;background:#f8fafc}
.ia-input:focus{border-color:var(--blue)}
.ia-send{width:42px;height:42px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ia-send:disabled{opacity:.5}
.ia-send svg{color:#fff;width:18px;height:18px}
.ia-sugestoes{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.ia-sug{background:var(--blue-faint);border:1.5px solid rgba(59,62,216,.15);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;white-space:nowrap}
.ia-sug:active{background:rgba(59,62,216,.15)}
/* ── Cards home ────────────────────────────────── */
.home-hero{background:linear-gradient(135deg,#1a1a6e,var(--blue));border-radius:20px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.home-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05)}
.home-hero::after{content:'';position:absolute;bottom:-20px;left:40%;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.04)}
.home-speed{font-family:'DM Mono',monospace;font-size:42px;font-weight:500;color:#fff;line-height:1;margin:8px 0 4px}
.home-mbps{font-size:14px;color:rgba(255,255,255,.6);font-weight:600}
.home-status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700}
.home-status-pill.on{background:rgba(94,224,160,.15);color:#5EE0A0;border:1px solid rgba(94,224,160,.3)}
.home-status-pill.off{background:rgba(232,58,58,.15);color:#ff6b6b;border:1px solid rgba(232,58,58,.3)}
.home-pill-dot{width:6px;height:6px;border-radius:50%;animation:pulse 2s infinite}
.home-pill-dot.on{background:#5EE0A0}
.home-pill-dot.off{background:#ff6b6b;animation:none}
.mini-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--border);cursor:pointer;transition:.12s}
.mini-card:active{transform:scale(.98)}
.mini-card-icon{font-size:22px;margin-bottom:6px}
.mini-card-label{font-size:10.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.mini-card-val{font-size:16px;font-weight:800;color:var(--text)}
.mini-card-sub{font-size:11px;color:var(--text2);margin-top:2px}
.mini-card-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;margin-top:4px}
.chamado-home-card{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid rgba(99,102,241,.2);background:rgba(99,102,241,.04);margin-bottom:14px;cursor:pointer;display:flex;align-items:center;gap:12px}
.chamado-home-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Velocidade ao vivo ────────────────────────── */
.speed-card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.speed-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.speed-title{font-size:13px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:6px}
.speed-btn{background:var(--blue);color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px}
.speed-btn:disabled{opacity:.6}
.speed-gauges{display:flex;gap:12px}
.speed-gauge{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:14px 8px}
.speed-gauge-val{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;line-height:1}
.speed-gauge-unit{font-size:11px;color:var(--text2);margin-top:2px}
.speed-gauge-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:3px}
.speed-down{color:#22C47A}
.speed-up{color:#3B3ED8}
.speed-ping{color:#F59E0B}
.speed-testing{animation:pulse 1.2s infinite}
/* ── Wi-Fi card ─────────────────────────────────── */
.wifi-card{background:linear-gradient(135deg,#0F4C81,#1565C0);border-radius:16px;padding:18px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
.wifi-card::after{content:'📶';position:absolute;top:14px;right:16px;font-size:26px;opacity:.25}
.wifi-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.05em}
.wifi-ssid{font-size:18px;font-weight:800;margin:4px 0 12px}
.wifi-senha-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.wifi-senha-txt{flex:1;font-family:'DM Mono',monospace;font-size:15px;letter-spacing:1px}
.wifi-eye{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);padding:2px}
.wifi-actions{display:flex;gap:8px}
.wifi-action{flex:1;background:rgba(255,255,255,.15);border:none;border-radius:10px;padding:11px;color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.wifi-action:active{background:rgba(255,255,255,.25)}
/* QR overlay */
.qr-overlay{position:fixed;inset:0;background:rgba(10,10,30,.7);z-index:9998;display:none;align-items:center;justify-content:center;padding:24px}
.qr-overlay.show{display:flex}
.qr-modal{background:#fff;border-radius:24px;padding:28px 24px;max-width:340px;width:100%;text-align:center;animation:sheetUp .25s ease}
.qr-modal-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:18px;color:var(--text)}
.qr-modal-sub{font-size:12.5px;color:var(--text2);margin:4px 0 18px}
.qr-canvas-box{background:#fff;border:2px solid var(--border);border-radius:16px;padding:16px;display:inline-block;margin-bottom:16px}
.qr-canvas-box canvas,.qr-canvas-box img{display:block}
.qr-info{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:16px;text-align:left}
.qr-info-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.qr-info-label{color:var(--text2)}
.qr-info-val{font-weight:700;font-family:'DM Mono',monospace;color:var(--text)}
.qr-close-btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<!-- Modal QR Code Wi-Fi -->
<div class="qr-overlay" id="qr-overlay" onclick="if(event.target===this)fecharQRWifi()">
  <div class="qr-modal">
    <div class="qr-modal-title">📶 Conectar ao Wi-Fi</div>
    <div class="qr-modal-sub">Aponte a câmera do celular para conectar</div>
    <div class="qr-canvas-box" id="qr-canvas-box"></div>
    <div class="qr-info">
      <div class="qr-info-row"><span class="qr-info-label">Rede</span><span class="qr-info-val" id="qr-ssid">--</span></div>
      <div class="qr-info-row"><span class="qr-info-label">Senha</span><span class="qr-info-val" id="qr-senha">--</span></div>
    </div>
    <button class="qr-close-btn" onclick="fecharQRWifi()">Fechar</button>
  </div>
</div>


<!-- Assistente IA -->
<button class="ia-fab" onclick="abrirIA()" id="ia-fab" style="display:none">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>

<div class="ia-overlay" id="ia-overlay" onclick="if(event.target===this)fecharIA()">
  <div class="ia-sheet">
    <div class="ia-head">
      <div class="ia-avatar">🤖</div>
      <div class="ia-head-info">
        <div class="ia-head-title">MoviON IA</div>
        <div class="ia-head-sub" id="ia-status">Pronto para ajudar</div>
      </div>
      <button class="ia-close" onclick="fecharIA()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="ia-msgs" id="ia-msgs"></div>
    <div class="ia-sugestoes" id="ia-sugestoes">
      <span class="ia-sug" onclick="enviarSugestao(this)">Minha internet está lenta 🐌</span>
      <span class="ia-sug" onclick="enviarSugestao(this)">Meu boleto venceu 💳</span>
      <span class="ia-sug" onclick="enviarSugestao(this)">Quero aumentar meu plano 🚀</span>
      <span class="ia-sug" onclick="enviarSugestao(this)">Wi-Fi não chega no quarto 📶</span>
    </div>
    <div class="ia-input-row">
      <input class="ia-input" id="ia-input" placeholder="Pergunte qualquer coisa..." onkeydown="if(event.key==='Enter')enviarIA()">
      <button class="ia-send" id="ia-send-btn" onclick="enviarIA()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>
</div>


<div class="chamado-overlay" id="chamado-overlay" onclick="if(event.target===this)fecharModalChamado()">
  <div class="chamado-sheet">
    <div class="chamado-handle"></div>
    <div style="font-family:'Nunito',sans-serif;font-weight:800;font-size:18px;margin-bottom:6px">Abrir chamado</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">Descreva o problema que está enfrentando com sua conexão.</div>
    <textarea id="chamado-txt" class="chamado-textarea" placeholder="Ex: Minha internet está sem conexão desde ontem às 20h. Já reiniciei o roteador mas não voltou..."></textarea>
    <div id="chamado-contador" style="font-size:11px;color:var(--text3);text-align:right;margin-top:4px">0/500</div>
    <div id="chamado-erro" class="chamado-erro"></div>
    <button id="chamado-btn" class="btn-yellow-full" onclick="confirmarChamado()" style="margin-top:12px;margin-bottom:8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      Enviar chamado
    </button>
    <button onclick="fecharModalChamado()" style="width:100%;padding:13px;border:1.5px solid var(--border);border-radius:12px;background:transparent;font-family:inherit;font-size:14px;color:var(--text2);cursor:pointer">Cancelar</button>
  </div>
</div>


<div class="pix-overlay" id="pix-overlay">
  <div class="pix-sheet">
    <div class="pix-handle"></div>
    <div id="pix-content"></div>
  </div>
</div>


<script>
// ── Config ────────────────────────────────────
const SUPA_URL  = 'https://mgtetsmcswdtvsgewcen.supabase.co';
const SUPA_ANON = 'sb_publishable_sJbQFk74Yhxw9Mnt6r3Piw_ahaydtFQ';
const PROXY_URL = 'https://movicontrol.vercel.app/api/moviapp';
const PUSH_URL  = 'https://movicontrol.vercel.app/api/push';
// Storage isolado: o MoviApp usa uma chave própria para NÃO compartilhar
// sessão com o MoviControl (que roda no mesmo domínio/navegador).
// Sem isso, logar no app como cliente derrubava a sessão do admin.
const sb = window.supabase.createClient(SUPA_URL, SUPA_ANON, {
  auth: {
    storageKey: 'moviapp-cliente-auth',
    storage: window.localStorage,
    autoRefreshToken: true,
    persistSession: true,
    detectSessionInUrl: false
  }
});

// ── Estado global ─────────────────────────────
let route    = 'login';
let perfil   = null;
let faturas  = [];
let ordens   = [];
let cbSaldo  = 0;
let cbLista  = [];

// ── Helpers ───────────────────────────────────
const fmtNome = n => n ? n.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : '';
const iniciais = n => (n||'').split(' ').filter(Boolean).map(p=>p[0]).slice(0,2).join('').toUpperCase();
const fmtReal  = v => 'R$ '+Number(v||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmtData  = d => { if(!d) return '—'; try{ return new Date(d+'T12:00:00').toLocaleDateString('pt-BR'); }catch{return d;} };

// ── Toast ─────────────────────────────────────
let _tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),2500);
}

// ── Render engine ─────────────────────────────
const TABS = [
  {id:'home',  lbl:'Início',   ico:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>`},
  {id:'fatura',lbl:'Fatura',   ico:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>`},
  {id:'os',    lbl:'Chamados', ico:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>`},
  {id:'ind',   lbl:'Indicação',ico:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`},
];

function tabBar(active){
  return `<div class="tabbar">${TABS.map(t=>`
    <div class="tab ${t.id===active?'active':''}" onclick="navTo('${t.id}')">
      ${t.ico}<span>${t.lbl}</span>
    </div>`).join('')}</div>`;
}

function render(html){ document.getElementById('app').innerHTML = html; }

function navTo(r){
  route = r;
  if(r==='home')    renderHome();
  else if(r==='fatura') renderFaturaScreen();
  else if(r==='os') renderOSScreen();
  else if(r==='ind') renderIndScreen();
}

// ── Tela de Login ─────────────────────────────
function renderLogin(){
  render(`
  <div class="login-wrap">
    <div class="login-bg"></div>
    <div class="login-rings">
      ${[180,280,380,480].map((d,i)=>`<div class="ring" style="width:${d}px;height:${d}px;animation-delay:${i*.8}s"></div>`).join('')}
    </div>
    <div class="login-hero">
      <div class="login-title">MoviApp</div>
      <div class="login-sub">Você em movimento</div>
      <div class="sig-bars">
        ${[8,14,20,26,32].map((h,i)=>`<div class="sig-bar" style="height:${h}px;animation-delay:${i*.1}s"></div>`).join('')}
      </div>
    </div>
    <div class="login-card">
      <h2>Bem-vindo de volta</h2>
      <p>Acesse sua conta para ver faturas, conexão e muito mais.</p>
      <div class="field">
        <label>CPF ou CNPJ</label>
        <input id="inp-cpf" type="text" placeholder="000.000.000-00" inputmode="numeric">
      </div>
      <div class="field">
        <label>Senha</label>
        <input id="inp-senha" type="password" placeholder="••••••••">
      </div>
      <button class="btn-yellow" id="btn-login" onclick="doLogin()">Entrar</button>
      <div class="login-hint">Esqueceu a senha? <b onclick="toast('Link enviado pelo WhatsApp!')">Recuperar pelo WhatsApp</b></div>
    </div>
  </div>`);
}

// ── Home ──────────────────────────────────────
function saudacao(){
  const h = new Date().getHours();
  if(h < 12) return 'Bom dia';
  if(h < 18) return 'Boa tarde';
  return 'Boa noite';
}

function renderHome(){
  const nome     = fmtNome(perfil?.nome || '');
  const primeiro = nome.split(' ')[0] || '';
  const online   = perfil?.online;
  const vel      = perfil?.velocidade_mbps || 0;
  const plano    = perfil?.plano || '';

  // Fatura em aberto
  const fatAberta = faturas.find(f => f.status === 'aberto');
  const fatVal    = fatAberta ? fmtReal(fatAberta.valor) : null;
  const diasVenc  = fatAberta ? Math.ceil((new Date(fatAberta.data_vencimento) - new Date()) / 86400000) : null;
  const vencLabel = diasVenc !== null
    ? (diasVenc < 0 ? `Venceu há ${Math.abs(diasVenc)}d` : diasVenc === 0 ? 'Vence hoje!' : `Vence em ${diasVenc}d`)
    : null;

  // Chamado ativo
  const chamadoAtivo = chamados.find(c => !['concluido','cancelada','cancelado'].includes(c.status));

  render(`
  <div class="header">
    <div class="header-inner">
      <div>
        <div class="hi-greet">${saudacao()},</div>
        <div class="hi-name">${primeiro || 'Carregando...'} 👋</div>
      </div>
      <div class="h-right">
        <div class="notif-btn" onclick="abrirIA()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="hi-avatar" onclick="doLogout()" title="Sair">${iniciais(nome)||'?'}</div>
      </div>
    </div>
  </div>
  <div class="body">

    <!-- Hero de conexão -->
    <div class="home-hero" onclick="atualizarConexao()">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <span class="home-status-pill ${online?'on':'off'}">
            <span class="home-pill-dot ${online?'on':'off'}"></span>
            ${online ? 'Internet ativa' : 'Sem conexão'}
          </span>
          <div class="home-speed">${vel}<span class="home-mbps"> Mbps</span></div>
          <div style="font-size:12px;color:rgba(255,255,255,.55);">${plano}</div>
        </div>
        <div style="text-align:right">
          ${online ? `<div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:4px">Estabilidade</div>
          <div style="font-size:22px;font-weight:800;color:#5EE0A0">100%</div>` :
          `<div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:4px">Status</div>
          <div style="font-size:13px;font-weight:700;color:#ff6b6b">Verificar</div>`}
        </div>
      </div>
      ${!online ? `<div style="margin-top:14px;padding:10px 14px;background:rgba(255,107,107,.12);border-radius:10px;border:1px solid rgba(255,107,107,.25)">
        <div style="font-size:12px;color:#ff9999;font-weight:600">🔴 Sua conexão parece estar offline</div>
        <div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:3px">Tente reiniciar seu roteador e aguarde 30 segundos</div>
      </div>` : ''}
    </div>

    <!-- Mini cards: Fatura + Plano -->
    <div class="mini-cards">
      <div class="mini-card" onclick="navTo('fatura')">
        <div class="mini-card-icon">💳</div>
        <div class="mini-card-label">Próxima fatura</div>
        ${fatAberta
          ? `<div class="mini-card-val">${fatVal}</div>
             <div class="mini-card-sub">${vencLabel}</div>
             <span class="mini-card-badge" style="background:${diasVenc!==null&&diasVenc<3?'#FEE2E2':'#FEF3C7'};color:${diasVenc!==null&&diasVenc<3?'#991B1B':'#92400E'}">${diasVenc!==null&&diasVenc<0?'Vencida':diasVenc===0?'Hoje!':'Em aberto'}</span>`
          : `<div class="mini-card-val" style="color:var(--green)">Em dia ✓</div>
             <div class="mini-card-sub">Sem faturas abertas</div>`}
      </div>
      <div class="mini-card" onclick="navTo('fatura')">
        <div class="mini-card-icon">📶</div>
        <div class="mini-card-label">Seu plano</div>
        <div class="mini-card-val">${vel}Mbps</div>
        <div class="mini-card-sub">${plano || 'Fibra óptica'}</div>
        <span class="mini-card-badge" style="background:#D1FAE5;color:#065F46">Ativo</span>
      </div>
    </div>

    <!-- Chamado ativo (se houver) -->
    ${chamadoAtivo ? `<div class="chamado-home-card" onclick="navTo('os')">
      <div class="chamado-home-dot" style="background:${
        chamadoAtivo.status==='aberto'?'#6366F1':
        chamadoAtivo.status==='assumido'?'#F59E0B':
        chamadoAtivo.status==='analisando'?'#8B5CF6':
        chamadoAtivo.status==='transferido'?'#10B981':'#6B7280'
      }"></div>
      <div style="flex:1">
        <div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em">Chamado ativo</div>
        <div style="font-size:13px;font-weight:600;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px">${fmtNome(chamadoAtivo.descricao)}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:11px;color:var(--text2)">${chamadoLabel(chamadoAtivo.status)}</div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>

async function doLogin(){
  const cpf   = (document.getElementById('inp-cpf')?.value||'').replace(/\D/g,'');
  const senha = (document.getElementById('inp-senha')?.value||'').trim();
  const btn   = document.getElementById('btn-login');
  if(!cpf||!senha){ toast('Preencha CPF e senha'); return; }
  if(btn){ btn.textContent='Entrando...'; btn.disabled=true; }
  const email = `${cpf}@moviapp.local`;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){
    if(btn){ btn.textContent='Entrar'; btn.disabled=false; }
    toast('CPF ou senha incorretos');
    return;
  }
  await carregarDados();
  renderHome();
}

async function doLogout(){
  esconderFAB();
  await sb.auth.signOut();
  perfil=null; faturas=[]; ordens=[]; cbSaldo=0; cbLista=[]; chamados=[];
  if(_realtimeChamados){ sb.removeChannel(_realtimeChamados); _realtimeChamados=null; }
  renderLogin();
}

async function carregarDados(){
  // 1) Perfil do cliente
  try {
    const { data } = await sb.from('v_cliente_app').select('*').single();
    if(data) perfil = data;
  } catch(e){}
  if(!perfil) return;

  // 2) Carregar tudo em paralelo
  await Promise.all([carregarFaturas(), carregarOS(), carregarCashback(), carregarChamados()]);
  assinarRealtimeChamados();
  mostrarFAB();
}

function chamadoTag(s){

  if(s==='analisando') return 'andamento';
  if(s==='transferido') return 'andamento';

  if(s==='executando') return 'andamento';
  if(s==='reagendada') return 'agendada';

}

function chamadoLabel(s){
  return {
    aberto:      '🔵 Aguardando atendimento',
    assumido:    '👤 Técnico assumiu',
    analisando:  '🔍 Em análise',
    transferido: '🔀 Encaminhado para visita',
    concluido:   '✅ Resolvido remotamente',
    assumida:    '👨‍🔧 Técnico designado',
    executando:  '🔧 Técnico no local',
    finalizada:  '✅ Visita concluída',
    reagendada:  '📅 Visita reagendada',
    cancelada:   '❌ Cancelado',
  }[s] || s;
}

function statusTimeline(status, tipo){
  let etapas, ordem;
  if(tipo === 'campo'){
    etapas = [{k:'pendente',label:'Agendado'},{k:'assumida',label:'Designado'},{k:'executando',label:'No local'},{k:'finalizada',label:'Concluído'}];
    ordem  = {pendente:0,assumida:1,executando:2,finalizada:3,reagendada:1};
  } else {
    etapas = [{k:'aberto',label:'Aberto'},{k:'assumido',label:'Assumido'},{k:'analisando',label:'Analisando'},{k:'concluido',label:'Concluído'}];
    ordem  = {aberto:0,assumido:1,analisando:2,concluido:3,transferido:3};
  }
  const atual = ordem[status] ?? 0;
  let html = '<div class="status-timeline">';
  etapas.forEach((e,i)=>{
    const passado = i < atual, ativo = i === atual;
    const clsDot   = passado ? 'concluido' : (ativo ? 'ativo' : '');
    const clsLabel = passado ? 'concluido' : (ativo ? 'ativo' : '');
    const icoCheck = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>`;
    const icoDot   = `<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3" fill="currentColor"/></svg>`;
    html += `<div class="st-step"><div class="st-dot ${clsDot}">${passado?icoCheck:(ativo?icoDot:'')}</div><div class="st-label ${clsLabel}">${e.label}</div></div>`;
    if(i < etapas.length-1){
      const clsLine = i < atual ? 'concluido' : (i===atual-1?'ativo':'');
      html += `<div class="st-line ${clsLine}"></div>`;
    }
  });
  return html + '</div>';
}

// ── SLA ────────────────────────────────────────
const SLA_INTERNO_H = 4;
const SLA_CAMPO_H   = 48;

function horasUteis(inicio, fim) {
  let h = 0, cur = new Date(inicio);
  const end = new Date(fim);
  while (cur < end) {
    const dow = cur.getDay();
    if (dow !== 0 && dow !== 6) {
      const hIni = Math.max(cur.getHours() + cur.getMinutes()/60, 8);
      const hFim = Math.min(
        cur.getDate()===end.getDate()&&cur.getMonth()===end.getMonth()
          ? end.getHours()+end.getMinutes()/60 : 18, 18);
      if (hFim > hIni) h += hFim - hIni;
    }
    const prox = new Date(cur);
    prox.setDate(prox.getDate()+1); prox.setHours(8,0,0,0);
    cur = prox;
  }
  return h;
}

function calcSLA(chamado) {
  const isCampo = chamado.tipo === 'campo' || chamado.os_id;
  const limiteH = isCampo ? SLA_CAMPO_H : SLA_INTERNO_H;
  const inicio  = new Date(chamado.created_at);
  const agora   = chamado.concluido_em ? new Date(chamado.concluido_em) : new Date();
  const decorrido = isCampo ? horasUteis(inicio, agora) : (agora-inicio)/3600000;
  const percentual = Math.min((decorrido/limiteH)*100, 100);
  const restanteH  = Math.max(limiteH-decorrido, 0);
  const vencido    = decorrido >= limiteH;
  let semaforo, textoRestante;
  if(vencido)        { semaforo='vermelho'; textoRestante=`Vencido há ${fmtDuracao(decorrido-limiteH)}`; }
  else if(percentual>=75){ semaforo='amarelo'; textoRestante=`Vence em ${fmtDuracao(restanteH)}`; }
  else               { semaforo='verde';    textoRestante=`Vence em ${fmtDuracao(restanteH)}`; }
  return {tipo:isCampo?'campo':'interno', limiteH, decorrido, percentual, semaforo, textoRestante, textoDecorrido:fmtDuracao(decorrido)};
}

function fmtDuracao(h) {
  if(h<1) return `${Math.round(h*60)}min`;
  if(h<24){ const hh=Math.floor(h),mm=Math.round((h-hh)*60); return mm>0?`${hh}h${mm}min`:`${hh}h`; }
  const dias=Math.floor(h/24),hh=Math.round(h%24);
  return hh>0?`${dias}d ${hh}h`:`${dias}d`;
}

function slaHtml(chamado) {
  const isConcluido = ['finalizada','concluido','resolvido','cancelada'].includes(chamado.status);
  const sla = calcSLA(chamado);
  const cores = {verde:{bg:'#E8FBF2',txt:'#1A8C52',dot:'#22C47A'},amarelo:{bg:'#FDF6E3',txt:'#8A6200',dot:'#FFB800'},vermelho:{bg:'#FBF0EE',txt:'#C23B2A',dot:'#E83A3A'}};
  const c = cores[sla.semaforo];
  const tipoLabel = sla.tipo==='campo'?'🔧 Visita técnica':'💬 Suporte remoto';
  const slaLabel  = sla.tipo==='campo'?'48h úteis':'4h';
  return `<div style="background:${c.bg};border-radius:10px;padding:10px 12px;margin-top:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div style="font-size:11px;font-weight:700;color:${c.txt}"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.dot};margin-right:5px;vertical-align:middle"></span>${tipoLabel} · SLA ${slaLabel}</div>
      <div style="font-size:11px;font-weight:700;color:${c.txt}">${isConcluido?'✓ Concluído':sla.textoRestante}</div>
    </div>
    <div style="background:rgba(0,0,0,.08);border-radius:4px;height:5px;overflow:hidden"><div style="height:100%;width:${sla.percentual}%;background:${c.dot};border-radius:4px"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:5px">
      <div style="font-size:10px;color:${c.txt};opacity:.8">Decorrido: ${sla.textoDecorrido}</div>
      <div style="font-size:10px;color:${c.txt};opacity:.8">${Math.round(sla.percentual)}%</div>
    </div>
  </div>`;
}

function fmtDatetime(d){
  if(!d) return '—';
  try{ const dt=new Date(d); return dt.toLocaleDateString('pt-BR')+' às '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }catch{return d;}
}

  if(!perfil?.ixc_id) return;
  _realtimeChamados = sb.channel('meus-chamados')
    .on('postgres_changes',{event:'*',schema:'public',table:'campo_chamados',filter:`cliente_id=eq.${perfil.ixc_id}`},async(payload)=>{
      const novo=payload.new, evento=payload.eventType;
      if(evento==='INSERT') chamados.unshift(novo);
      else if(evento==='UPDATE'){
        const idx=chamados.findIndex(c=>String(c.id)===String(novo.id));
        if(idx!==-1){ const ant=chamados[idx].status; chamados[idx]={...chamados[idx],...novo}; if(ant!==novo.status) mostrarNotificacaoStatus(ant,novo.status,novo); }
        else chamados.unshift(novo);
      } else if(evento==='DELETE') chamados=chamados.filter(c=>String(c.id)!==String(payload.old?.id));
      if(route==='os') renderOSScreen();
    }).subscribe();
}

let _pixCache = {};

async function abrirPix(idAreceber, valor){
  const overlay = document.getElementById('pix-overlay');
  const content = document.getElementById('pix-content');
  overlay.classList.add('show');

  // Estado de loading
  content.innerHTML = `
    <div class="pix-title">Pagamento via PIX</div>
    <div class="pix-val">${fmtReal(valor)}</div>
    <div class="pix-loading">
      <div class="pix-spinner"></div>
      <div style="font-size:13px">Gerando código PIX...</div>
    </div>`;

  // Cache: se já gerou esse PIX, reusa
  if(_pixCache[idAreceber]){
    renderPix(_pixCache[idAreceber].codigo, valor, _pixCache[idAreceber].imagem);
    return;
  }

  try {
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) throw new Error('Sessão expirada');

    const r = await fetch(PROXY_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-target':'cliente','Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({action:'get_pix', id_areceber:String(idAreceber)})
    });
    const d = await r.json();

    if(d.ok && d.pix_copia_cola){
      _pixCache[idAreceber] = { codigo: d.pix_copia_cola, imagem: d.imagem_base64 };
      renderPix(d.pix_copia_cola, valor, d.imagem_base64);
    } else {
      content.innerHTML = `
        <div class="pix-title">PIX indisponível</div>
        <div class="pix-instr" style="margin-top:14px">Não foi possível gerar o código PIX no momento. Você pode pagar pelo código de barras do boleto.</div>
        <button class="btn-pix-close" onclick="fecharPix()">Fechar</button>`;
    }
  } catch(e){
    content.innerHTML = `
      <div class="pix-title">Erro</div>
      <div class="pix-instr" style="margin-top:14px">Não foi possível conectar. Tente novamente.</div>
      <button class="btn-pix-close" onclick="fecharPix()">Fechar</button>`;
  }
}

function renderPix(codigo, valor, imagemBase64){
  const content = document.getElementById('pix-content');
  content.innerHTML = `
    <div class="pix-title">Pague com PIX</div>
    <div class="pix-val">${fmtReal(valor)}</div>
    <div class="pix-qr" id="pix-qr-canvas"></div>
    <div class="pix-instr">Abra o app do seu banco, escolha pagar com PIX<br>e escaneie o QR Code ou copie o código abaixo</div>
    <div class="pix-copy-box" id="pix-code-text">${codigo}</div>
    <button class="btn-pix-copy" onclick="copiarPix(document.getElementById('pix-code-text').textContent)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copiar código PIX
    </button>
    <button class="btn-pix-close" onclick="fecharPix()">Fechar</button>`;

  const el = document.getElementById('pix-qr-canvas');
  // Preferir imagem do IXC (já vem pronta); senão gerar localmente
  if(imagemBase64){
    const src = imagemBase64.startsWith('data:') ? imagemBase64 : `data:image/png;base64,${imagemBase64}`;
    el.innerHTML = `<img src="${src}" alt="QR Code PIX">`;
  } else {
    setTimeout(()=>{
      if(el && window.QRCode){
        QRCode.toCanvas(codigo, {width:180, margin:1}, (err, canvas)=>{
          if(!err && canvas){ el.innerHTML=''; el.appendChild(canvas); }
        });
      }
    }, 50);
  }
}

function copiarPix(codigo){
  navigator.clipboard?.writeText(codigo).then(()=>{
    toast('Código PIX copiado! ✓');
  }).catch(()=>{
    // Fallback
    const el = document.getElementById('pix-code-text');
    if(el){ const r=document.createRange(); r.selectNode(el); window.getSelection().removeAllRanges(); window.getSelection().addRange(r); document.execCommand('copy'); }
    toast('Código PIX copiado!');
  });
}

async function enviarIA(){
  if(_iaTyping) return;
  const input = document.getElementById('ia-input');
  const mensagem = (input?.value || '').trim();
  if(!mensagem) return;

  input.value = '';
  adicionarMsgIA('user', mensagem);
  _iaHistorico.push({ role:'user', content: mensagem });

  _iaTyping = true;
  document.getElementById('ia-send-btn').disabled = true;
  document.getElementById('ia-status').textContent = 'Digitando...';
  const typing = mostrarTyping();

  // Montar contexto do cliente
  const fatAberta = faturas.find(f=>f.status==='aberto');
  const chamadoAt = chamados.find(c=>!['concluido','cancelada','cancelado'].includes(c.status));
  const contexto  = {
    nome:          perfil?.nome || '',
    plano:         perfil?.plano || '',
    velocidade_mbps: perfil?.velocidade_mbps || 0,
    online:        perfil?.online ?? true,
    pago_ate:      perfil?.pago_ate || '',
    fatura:        fatAberta ? { valor: fatAberta.valor, data_vencimento: fatAberta.data_vencimento } : null,
    chamado:       chamadoAt ? { id: chamadoAt.id, status: chamadoAt.status, descricao: chamadoAt.descricao } : null,
  };

  try {
    const { data:{ session } } = await sb.auth.getSession();
    const r = await fetch(PROXY_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-target':'cliente','Authorization':`Bearer ${session.access_token}`},
      body: JSON.stringify({ action:'chat_ia', mensagem, historico: _iaHistorico.slice(-8), contexto })
    });
    const d = await r.json();
    typing?.remove();

    if(d.ok && d.resposta){
      adicionarMsgIA('bot', d.resposta);
      _iaHistorico.push({ role:'assistant', content: d.resposta });
    } else {
      adicionarMsgIA('bot', 'Ops, tive um probleminha aqui. Pode tentar de novo? 😅');
    }
  } catch(e){
    typing?.remove();
    adicionarMsgIA('bot', 'Não consegui conectar agora. Tenta de novo em instantes! 🙏');
  } finally {
    _iaTyping = false;
    document.getElementById('ia-send-btn').disabled = false;
    document.getElementById('ia-status').textContent = 'Pronto para ajudar';
  }
}

// ── Velocidade ao vivo ────────────────────────────────────────
let _testando = false;

async function testarVelocidade(){
  if(_testando) return;
  _testando = true;
  const btn = document.getElementById('speed-test-btn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Testando'; }

  const down = document.getElementById('sp-down');
  const up   = document.getElementById('sp-up');
  const ping = document.getElementById('sp-ping');
  [down,up,ping].forEach(el=>{ if(el){ el.textContent='...'; el.classList.add('speed-testing'); } });

  try {
    // 1) Ping — mede latência até o Cloudflare
    const t0 = performance.now();
    await fetch('https://speed.cloudflare.com/__down?bytes=1000', {cache:'no-store'});
    const pingMs = Math.round(performance.now() - t0);
    if(ping){ ping.textContent = pingMs; ping.classList.remove('speed-testing'); }

    // 2) Download — baixa ~10MB e mede velocidade
    const downBytes = 10000000;
    const td0 = performance.now();
    const resp = await fetch(`https://speed.cloudflare.com/__down?bytes=${downBytes}`, {cache:'no-store'});
    await resp.arrayBuffer();
    const downSec = (performance.now() - td0) / 1000;
    const downMbps = Math.round((downBytes * 8) / downSec / 1000000);
    if(down){ down.textContent = downMbps; down.classList.remove('speed-testing'); }

    // 3) Upload — envia ~5MB
    const upBytes = 5000000;
    const payload = new Uint8Array(upBytes);
    const tu0 = performance.now();
    await fetch('https://speed.cloudflare.com/__up', {method:'POST', body:payload, cache:'no-store'});
    const upSec = (performance.now() - tu0) / 1000;
    const upMbps = Math.round((upBytes * 8) / upSec / 1000000);
    if(up){ up.textContent = upMbps; up.classList.remove('speed-testing'); }

  } catch(e){
    toast('Não foi possível testar agora');
    [down,up,ping].forEach(el=>{ if(el){ el.textContent='--'; el.classList.remove('speed-testing'); } });
  } finally {
    _testando = false;
    if(btn){ btn.disabled=false; btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> Testar'; }
  }
}

      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function copiarSenhaWifi(){
  const senha = perfil?.wifi_senha || '';
  if(!senha){ toast('Senha não disponível'); return; }
  navigator.clipboard?.writeText(senha).then(()=>toast('Senha copiada! ✓')).catch(()=>toast('Senha: '+senha));
}

function abrirQRWifi(){
  const ssid  = perfil?.wifi_ssid || '';
  const senha = perfil?.wifi_senha || '';
  if(!ssid){ toast('Wi-Fi não configurado'); return; }

  document.getElementById('qr-ssid').textContent = ssid;
  document.getElementById('qr-senha').textContent = senha || '(sem senha)';
  document.getElementById('qr-overlay').classList.add('show');

  // Formato padrão de QR Wi-Fi: WIFI:T:WPA;S:<ssid>;P:<senha>;;
  const wifiString = `WIFI:T:WPA;S:${ssid};P:${senha};;`;
  const box = document.getElementById('qr-canvas-box');
  box.innerHTML = '';
  if(window.QRCode){
    QRCode.toCanvas(wifiString, {width:200, margin:1}, (err, canvas)=>{
      if(!err && canvas){ box.appendChild(canvas); }
      else { box.innerHTML = '<div style="padding:40px;color:#999">Erro ao gerar QR</div>'; }
    });
  }
}

function fecharQRWifi(){
  document.getElementById('qr-overlay')?.classList.remove('show');
}

// ── Push Notifications ────────────────────────────────────────
let _swRegistration = null;

async function iniciarPushNotifications(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    // Registrar Service Worker
    _swRegistration = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;

    // Escutar mensagens do SW (navegação por aba)
    navigator.serviceWorker.addEventListener('message', e => {
      if(e.data?.type === 'navigate' && e.data.tab) navTo(e.data.tab);
    });

    // Verificar permissão atual
    if(Notification.permission === 'granted'){
      await ativarPush();
    }
  } catch(e) {
    console.warn('SW erro:', e);
  }
}

async function pedirPermissaoPush(){
  if(!('Notification' in window)) return false;
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied') {
    toast('Ative as notificações nas configurações do navegador');
    return false;
  }
  const permission = await Notification.requestPermission();
  if(permission === 'granted'){
    await ativarPush();
    return true;
  }
  return false;
}

async function ativarPush(){
  if(!_swRegistration) return;
  try {
    // Buscar VAPID public key
    const r = await fetch(PUSH_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'vapid_public_key'})
    });
    const d = await r.json();
    if(!d.key) return;

    // Converter VAPID key para Uint8Array
    const vapidKey = urlBase64ToUint8Array(d.key);

    // Criar/obter subscription
    let sub = await _swRegistration.pushManager.getSubscription();
    if(!sub){
      sub = await _swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: vapidKey
      });
    }

    // Salvar no servidor
    const subJson = sub.toJSON();
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) return;

    await fetch(PUSH_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({
        action:      'subscribe',
        endpoint:    subJson.endpoint,
        p256dh:      subJson.keys.p256dh,
        auth:        subJson.keys.auth,
        user_agent:  navigator.userAgent.slice(0,200)
      })
    });
  } catch(e) {
    console.warn('Push subscribe erro:', e);
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64  = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw     = atob(base64);
  return new Uint8Array([...raw].map(c => c.charCodeAt(0)));
}

// Botão de ativar notificações na home (à prova de erros)
function renderBotaoPush(){
  try {
    if(typeof Notification === 'undefined') return '';
    if(Notification.permission === 'granted') return '';
    if(Notification.permission === 'denied') return '';
    return `<div style="background:linear-gradient(135deg,#6366F1,#8B5CF6);border-radius:14px;padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;cursor:pointer" onclick="pedirPermissaoPush()">
      <div style="font-size:26px">🔔</div>
      <div style="flex:1">
        <div style="font-weight:800;font-size:14px;color:#fff">Ativar notificações</div>
        <div style="font-size:12px;color:rgba(255,255,255,.75);margin-top:2px">Receba alertas de fatura, chamados e conexão</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </div>`;
  } catch(e){ return ''; }
}
