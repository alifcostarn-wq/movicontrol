<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3B3ED8">
<title>MoviApp</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --blue:#3B3ED8;--blue-dark:#2B2D8C;--blue-light:#5558E8;--blue-faint:#EEEEFF;
  --yellow:#FFD600;--yellow-dark:#E8C200;--yellow-faint:#FFFBDA;
  --pink:#E83A8C;--pink-faint:#FDE8F3;
  --surface:#fff;--bg:#F5F5FF;--border:#E0E0F8;
  --text:#1A1A3E;--text2:#5A5A8A;--text3:#9898BC;
  --green:#22C47A;--danger:#E83A3A;
  --radius:16px;--radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--blue)}
body{font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}

/* ── App container ── */
#app{
  width:100%;max-width:480px;min-height:100vh;min-height:100dvh;
  background:var(--bg);display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}

/* ── Toast ── */
#toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);
  background:#1A1A3E;color:#fff;padding:10px 20px;border-radius:30px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:.2s;white-space:nowrap;z-index:9999;max-width:90vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Login ── */
.login-wrap{
  min-height:100vh;min-height:100dvh;background:var(--blue);
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse 120% 60% at 50% -10%,#4547E8 0%,#1E1FA8 55%,#10115C 100%)}
.login-rings{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);pointer-events:none}
.ring{position:absolute;border-radius:50%;border:1.5px solid rgba(255,214,0,.2);left:0;top:0;transform:translate(-50%,-50%);animation:ringOut 3.2s ease-out infinite}
@keyframes ringOut{0%{opacity:.7;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.login-hero{position:absolute;top:0;left:0;right:0;bottom:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.login-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:64px;color:#FFD600;letter-spacing:-2px;line-height:1;text-shadow:0 0 50px rgba(255,214,0,.4);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.login-sub{font-size:14px;color:rgba(255,255,255,.55);margin-top:12px;letter-spacing:2px;text-transform:uppercase}
.sig-bars{display:flex;align-items:flex-end;gap:4px;margin-top:24px}
.sig-bar{width:5px;border-radius:3px;background:#FFD600;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
.login-card{background:#fff;border-radius:28px 28px 0 0;padding:30px 24px 36px;position:relative;z-index:2;margin-top:auto}
.login-card h2{font-family:'Nunito',sans-serif;font-weight:800;font-size:20px;color:var(--text);margin-bottom:4px}
.login-card p{font-size:13px;color:var(--text2);margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:15px;background:var(--bg);color:var(--text)}
.field input:focus{outline:none;border-color:var(--blue)}
.btn-yellow{width:100%;padding:15px;border:none;border-radius:var(--radius-sm);background:var(--yellow);color:var(--blue-dark);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:.12s}
.btn-yellow:active{background:var(--yellow-dark)}
.login-hint{text-align:center;margin-top:14px;font-size:12.5px;color:var(--text2)}
.login-hint b{color:var(--blue);cursor:pointer;font-weight:700}

/* ── Header ── */
.header{background:var(--blue);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 30px;position:relative;overflow:hidden;flex-shrink:0}
.header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:26px;background:var(--bg);border-radius:22px 22px 0 0}
.header-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start}
.hi-greet{color:rgba(255,255,255,.65);font-size:12.5px;font-weight:500}
.hi-name{color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.2px;margin-top:2px}
.hi-avatar{width:40px;height:40px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--blue-dark);cursor:pointer;flex-shrink:0}
.h-right{display:flex;gap:8px;align-items:center}
.notif-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.notif-btn svg{width:18px;height:18px;color:#fff}
.nb-dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);position:absolute;top:8px;right:8px;border:2px solid var(--blue)}
.page-title{color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:18px}

/* ── Scroll body ── */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px calc(80px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.body::-webkit-scrollbar{display:none}

/* ── Tab bar ── */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:1.5px solid var(--border);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0}
.tab svg{width:22px;height:22px;color:var(--text3);transition:.15s}
.tab span{font-size:10px;font-weight:700;color:var(--text3);transition:.15s}
.tab.active svg{color:var(--blue)}
.tab.active span{color:var(--blue)}

/* ── Cards ── */
.card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--border)}
.card-head{padding:16px 18px 0;display:flex;justify-content:space-between;align-items:center}
.card-title{font-weight:700;font-size:13.5px;color:var(--text)}
.card-link{font-size:12px;font-weight:700;color:var(--blue-light);cursor:pointer}
.card-body{padding:14px 18px 18px}

/* ── Conn card ── */
.conn-card{background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:var(--radius);padding:22px;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 8px 24px rgba(59,62,216,.3)}
.led{width:8px;height:8px;border-radius:50%;display:inline-block}
.led.on{background:#22C47A;box-shadow:0 0 0 3px rgba(34,196,122,.25);animation:pulse 2.5s infinite}
.led.off{background:#ff6b6b}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(34,196,122,.25)}50%{box-shadow:0 0 0 7px rgba(34,196,122,.08)}}
.conn-speed{font-family:'Nunito',sans-serif;font-weight:900;font-size:40px;color:#fff;letter-spacing:-1.5px;line-height:1}
.conn-mbps{font-size:14px;font-weight:600;color:rgba(255,255,255,.6);margin-left:3px}
.conn-plan{font-size:11.5px;color:rgba(255,255,255,.55);margin-top:5px}
.conn-pill{background:rgba(255,214,0,.15);border:1px solid rgba(255,214,0,.3);padding:6px 12px;border-radius:30px;font-size:11px;font-weight:700;color:var(--yellow)}

/* ── Quick actions ── */
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa{background:#fff;border-radius:var(--radius-sm);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border:1.5px solid var(--border);transition:.12s}
.qa:active{border-color:var(--blue);background:var(--blue-faint)}
.qa-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.qa-lbl{font-size:10.5px;font-weight:700;color:var(--text2);text-align:center;line-height:1.3}

/* ── Fatura ── */
.fat-hero{background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:14px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.fat-val{font-family:'DM Mono',monospace;font-size:34px;font-weight:500;color:#fff;line-height:1}
.fat-badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:700;margin-top:10px}
.fat-badge.aberta{background:rgba(255,214,0,.2);border:1px solid rgba(255,214,0,.35);color:var(--yellow)}
.fat-badge.paga{background:rgba(34,196,122,.2);border:1px solid rgba(34,196,122,.3);color:#22C47A}
.btn-yellow-full{width:100%;padding:14px;border-radius:var(--radius-sm);border:none;background:var(--yellow);color:var(--blue-dark);font-family:inherit;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.12s;margin-bottom:8px}
.btn-yellow-full:active{background:var(--yellow-dark)}
.btn-outline{width:100%;padding:13px;border-radius:var(--radius-sm);border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-family:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1.5px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.pill.paga{background:#E8FBF2;color:#1A8C52}
.pill.aberta{background:var(--yellow-faint);color:#8A7000}

/* ── OS ── */
.os-item{display:flex;gap:14px;padding-bottom:20px}
.os-item:last-child{padding-bottom:0}
.os-line{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.os-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--border);background:#fff}
.os-dot.andamento{background:var(--blue);border-color:var(--blue)}
.os-dot.concluida{background:var(--green);border-color:var(--green)}
.os-dot svg{width:15px;height:15px;color:#fff}
.os-connector{width:2px;flex:1;background:var(--border);margin:4px 0;min-height:12px}
.os-tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;margin-top:7px}
.os-tag.andamento{background:var(--blue-faint);color:var(--blue)}
.os-tag.concluida{background:#E8FBF2;color:#1A8C52}
.os-tag.agendada{background:#FDF6E3;color:#8A6200}

/* ── Cashback ── */
.cb-hero{background:linear-gradient(135deg,var(--blue-dark) 0%,var(--pink) 100%);border-radius:var(--radius);padding:24px;position:relative;overflow:hidden;margin-bottom:14px}
.cb-hero::after{content:'💸';position:absolute;right:-8px;bottom:-18px;font-size:88px;opacity:.15;line-height:1}
.cb-val{font-family:'DM Mono',monospace;font-size:38px;font-weight:500;color:#fff;line-height:1}
.cb-btn{margin-top:16px;padding:12px 16px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:10px;font-size:13px;font-weight:700;color:#fff;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.link-box{background:#fff;border:1.5px dashed var(--blue);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.link-url{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-copy{padding:8px 14px;background:var(--yellow);color:var(--blue-dark);font-size:12px;font-weight:800;border:none;border-radius:8px;cursor:pointer;flex-shrink:0;font-family:inherit}
.btn-share{width:100%;padding:13px;border-radius:var(--radius-sm);border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-family:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.ind-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1.5px solid var(--border)}
.ind-item:last-child{border-bottom:none}
.ind-ava{width:36px;height:36px;border-radius:50%;background:var(--blue-faint);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.ind-credit{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--green);margin-left:auto}

/* ── Misc ── */
.empty-txt{text-align:center;color:var(--text3);padding:20px;font-size:13px}
.sec-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:12px}
.how-box{background:var(--blue-faint);border-radius:12px;padding:16px}
.how-title{font-weight:800;font-size:13px;color:var(--blue);margin-bottom:6px}
.how-txt{font-size:12.5px;color:var(--blue-dark);line-height:1.6;opacity:.85}
.mono{font-family:'DM Mono',monospace}
.cb-teaser{background:linear-gradient(135deg,var(--blue-dark),var(--pink));border-radius:var(--radius);padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer}
.btn-pix{width:100%;padding:15px;border-radius:var(--radius-sm);border:none;background:linear-gradient(135deg,#00B89F,#00A896);color:#fff;font-family:inherit;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;margin-bottom:8px;box-shadow:0 6px 18px rgba(0,168,150,.3);transition:.12s}
.btn-pix:active{transform:scale(.99)}
.pix-overlay{position:fixed;inset:0;background:rgba(15,15,50,.6);z-index:9998;display:none;align-items:flex-end;justify-content:center}
.pix-overlay.show{display:flex}
.pix-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));animation:sheetUp .25s ease}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.pix-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.pix-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:18px;text-align:center;color:var(--text)}
.pix-val{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;text-align:center;color:var(--blue);margin:6px 0 18px}
.pix-qr{width:200px;height:200px;margin:0 auto 18px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center}
.pix-qr canvas,.pix-qr img{width:100%!important;height:100%!important}
.pix-loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0;color:var(--text2)}
.pix-spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pix-copy-box{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);word-break:break-all;margin-bottom:14px;max-height:70px;overflow-y:auto}
.pix-instr{font-size:12px;color:var(--text2);text-align:center;margin-bottom:18px;line-height:1.5}
.btn-pix-copy{width:100%;padding:14px;border-radius:var(--radius-sm);border:none;background:var(--blue);color:#fff;font-family:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn-pix-close{width:100%;padding:13px;margin-top:8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:transparent;color:var(--text2);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<div class="pix-overlay" id="pix-overlay">
  <div class="pix-sheet">
    <div class="pix-handle"></div>
    <div id="pix-content"></div>
  </div>
</div>


<script>
// ── Config ────────────────────────────────────
const SUPA_URL  = 'https://mgtetsmcswdtvsgewcen.supabase.co';
const SUPA_ANON = 'sb_publishable_sJbQFk74Yhxw9Mnt6r3Piw_ahaydtFQ';
const PROXY_URL = 'https://movicontrol.vercel.app/api/ixc-proxy';
const sb = window.supabase.createClient(SUPA_URL, SUPA_ANON);

// ── Estado global ─────────────────────────────
let route    = 'login';
let perfil   = null;
let faturas  = [];
let ordens   = [];
let cbSaldo  = 0;
let cbLista  = [];

// ── Helpers ───────────────────────────────────
const fmtNome = n => n ? n.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : '';
const iniciais = n => (n||'').split(' ').filter(Boolean).map(p=>p[0]).slice(0,2).join('').toUpperCase();
const fmtReal  = v => 'R$ '+Number(v||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmtData  = d => { if(!d) return '—'; try{ return new Date(d+'T12:00:00').toLocaleDateString('pt-BR'); }catch{return d;} };

// ── Toast ─────────────────────────────────────
let _tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),2500);
}

// ── Render engine ─────────────────────────────
const TABS = [
  {id:'home',  lbl:'Início',   ico:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>`},
  {id:'fatura',lbl:'Fatura',   ico:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>`},
  {id:'os',    lbl:'Chamados', ico:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>`},
  {id:'ind',   lbl:'Indicação',ico:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`},
];

function tabBar(active){
  return `<div class="tabbar">${TABS.map(t=>`
    <div class="tab ${t.id===active?'active':''}" onclick="navTo('${t.id}')">
      ${t.ico}<span>${t.lbl}</span>
    </div>`).join('')}</div>`;
}

function render(html){ document.getElementById('app').innerHTML = html; }

function navTo(r){
  route = r;
  if(r==='home')    renderHome();
  else if(r==='fatura') renderFaturaScreen();
  else if(r==='os') renderOSScreen();
  else if(r==='ind') renderIndScreen();
}

// ── Tela de Login ─────────────────────────────
function renderLogin(){
  render(`
  <div class="login-wrap">
    <div class="login-bg"></div>
    <div class="login-rings">
      ${[180,280,380,480].map((d,i)=>`<div class="ring" style="width:${d}px;height:${d}px;animation-delay:${i*.8}s"></div>`).join('')}
    </div>
    <div class="login-hero">
      <div class="login-title">MoviApp</div>
      <div class="login-sub">Você em movimento</div>
      <div class="sig-bars">
        ${[8,14,20,26,32].map((h,i)=>`<div class="sig-bar" style="height:${h}px;animation-delay:${i*.1}s"></div>`).join('')}
      </div>
    </div>
    <div class="login-card">
      <h2>Bem-vindo de volta</h2>
      <p>Acesse sua conta para ver faturas, conexão e muito mais.</p>
      <div class="field">
        <label>CPF ou CNPJ</label>
        <input id="inp-cpf" type="text" placeholder="000.000.000-00" inputmode="numeric">
      </div>
      <div class="field">
        <label>Senha</label>
        <input id="inp-senha" type="password" placeholder="••••••••">
      </div>
      <button class="btn-yellow" id="btn-login" onclick="doLogin()">Entrar</button>
      <div class="login-hint">Esqueceu a senha? <b onclick="toast('Link enviado pelo WhatsApp!')">Recuperar pelo WhatsApp</b></div>
    </div>
  </div>`);
}

// ── Home ──────────────────────────────────────
function renderHome(){

// ── OS screen ─────────────────────────────────
function osTag(s){ return s==='finalizada'?'concluida':['assumida','executando','pendente'].includes(s)?'andamento':'agendada'; }
function osLabel(s){ return {pendente:'Pendente',assumida:'Em andamento',executando:'Em andamento',finalizada:'Concluída',reagendado:'Reagendada',cancelada:'Cancelada'}[s]||s; }
function osItemHTML(o, connector){
  const cls = osTag(o.status);
  const ico = cls==='concluida'
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>`;
  return `<div class="os-item">
    <div class="os-line">
      <div class="os-dot ${cls}">${ico}</div>
      ${connector?'<div class="os-connector"></div>':''}
    </div>
    <div style="flex:1;padding-top:5px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:3px">OS #${o.numero||o.id}</div>
      <div style="font-weight:700;font-size:13.5px;color:var(--text)">${fmtNome(o.descricao)}</div>
      ${o.tecnico_nome?`<div style="font-size:12px;color:var(--text2);margin-top:2px">Técnico: ${fmtNome(o.tecnico_nome)}</div>`:''}
      <div style="font-size:11px;color:var(--text3);margin-top:4px;font-family:'DM Mono',monospace">${fmtData(o.data)}</div>
      <span class="os-tag ${cls}">${osLabel(o.status)}</span>
    </div>
  </div>`;
}

// ── Login ─────────────────────────────────────
async function doLogin(){
  const cpf   = (document.getElementById('inp-cpf')?.value||'').replace(/\D/g,'');
  const senha = document.getElementById('inp-senha')?.value||'';
  if(!cpf||!senha){ toast('Preencha CPF e senha'); return; }
  const btn = document.getElementById('btn-login');
  if(btn){ btn.textContent='Entrando...'; btn.disabled=true; }
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email:`${cpf}@moviapp.local`, password:senha });
    if(error) throw error;
    await carregarDados();
    renderHome();
  } catch(e){
    toast('CPF ou senha incorretos');
    if(btn){ btn.textContent='Entrar'; btn.disabled=false; }
  }
}

async function doLogout(){
  await sb.auth.signOut();
  perfil=null; faturas=[]; ordens=[]; cbSaldo=0; cbLista=[];
  renderLogin();
}

// ── Dados ─────────────────────────────────────
async function carregarDados(){
  try {
    const { data } = await sb.from('v_cliente_app').select('*').maybeSingle();
    perfil = data;
  } catch(e){ perfil = null; }

  await Promise.all([carregarFaturas(), carregarOS(), carregarCashback()]);
}

async function carregarFaturas(){
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) return;
    const r = await fetch(PROXY_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-target':'cliente-dados','Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({action:'get_faturas'})
    });
    const d = await r.json();
    faturas = d.registros||[];
  } catch(e){ faturas=[]; }
}

async function carregarOS(){
  if(!perfil?.ixc_id) return;
  try {
    const { data } = await sb.from('campo_os')
      .select('id,numero,descricao,status,data,finalizado_em,tecnico_nome')
      .eq('cliente_id', String(perfil.ixc_id))
      .order('created_at',{ascending:false}).limit(20);
    ordens = data||[];
  } catch(e){ ordens=[]; }
}

async function carregarCashback(){
  try {
    const [{ data:cb },{ data:lista }] = await Promise.all([
      sb.from('v_cashback').select('*').maybeSingle(),
      sb.from('indicacoes').select('*').order('created_at',{ascending:false})
    ]);
    cbSaldo = cb?.saldo||0;
    cbLista = lista||[];
  } catch(e){ cbSaldo=0; cbLista=[]; }
}

async function atualizarConexao(){
  toast('Atualizando...');
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) return;
    const r = await fetch(PROXY_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','x-target':'cliente-dados','Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({action:'get_status'})
    });
    const d = await r.json();
    if(d.ok && perfil){ perfil.online=d.online; renderHome(); }
    toast(d.online?'Conexão online ✓':'Conexão offline');
  } catch(e){ toast('Erro ao atualizar'); }
}

function copiarCodigo(cod){
  if(!cod){ toast('Código não disponível'); return; }
  navigator.clipboard?.writeText(cod).catch(()=>{});
  toast('Código copiado!');
}

function compartilharLink(link){
  const url = 'https://'+link;
  if(navigator.share){ navigator.share({title:'MoviApp',text:'Conheça a MoviOn!',url}); }
  else { navigator.clipboard?.writeText(url).catch(()=>{}); toast('Link copiado!'); }
}

// ── PIX ───────────────────────────────────────
let _pixCache = {};

async function abrirPix(idAreceber, valor){
  const overlay = document.getElementById('pix-overlay');
  const content = document.getElementById('pix-content');
  overlay.classList.add('show');

  // Estado de loading
  content.innerHTML = `
    <div class="pix-title">Pagamento via PIX</div>
    <div class="pix-val">${fmtReal(valor)}</div>
    <div class="pix-loading">
      <div class="pix-spinner"></div>
      <div style="font-size:13px">Gerando código PIX...</div>
    </div>`;

  // Cache: se já gerou esse PIX, reusa
  if(_pixCache[idAreceber]){
    renderPix(_pixCache[idAreceber], valor);
    return;
  }

  try {
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) throw new Error('Sessão expirada');

    const r = await fetch(PROXY_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-target':'cliente-dados','Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({action:'get_pix', id_areceber:String(idAreceber)})
    });
    const d = await r.json();

    if(d.ok && d.pix_copia_cola){
      _pixCache[idAreceber] = d.pix_copia_cola;
      renderPix(d.pix_copia_cola, valor);
    } else {
      content.innerHTML = `
        <div class="pix-title">PIX indisponível</div>
        <div class="pix-instr" style="margin-top:14px">Não foi possível gerar o código PIX no momento. Você pode pagar pelo código de barras do boleto.</div>
        <button class="btn-pix-close" onclick="fecharPix()">Fechar</button>`;
    }
  } catch(e){
    content.innerHTML = `
      <div class="pix-title">Erro</div>
      <div class="pix-instr" style="margin-top:14px">Não foi possível conectar. Tente novamente.</div>
      <button class="btn-pix-close" onclick="fecharPix()">Fechar</button>`;
  }
}

function renderPix(codigo, valor){
  const content = document.getElementById('pix-content');
  content.innerHTML = `
    <div class="pix-title">Pague com PIX</div>
    <div class="pix-val">${fmtReal(valor)}</div>
    <div class="pix-qr" id="pix-qr-canvas"></div>
    <div class="pix-instr">Abra o app do seu banco, escolha pagar com PIX<br>e escaneie o QR Code ou copie o código abaixo</div>
    <div class="pix-copy-box" id="pix-code-text">${codigo}</div>
    <button class="btn-pix-copy" onclick="copiarPix('${codigo.replace(/'/g,"\\'")}')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copiar código PIX
    </button>
    <button class="btn-pix-close" onclick="fecharPix()">Fechar</button>`;

  // Gerar QR Code
  setTimeout(()=>{
    const el = document.getElementById('pix-qr-canvas');
    if(el && window.QRCode){
      QRCode.toCanvas(codigo, {width:180, margin:1}, (err, canvas)=>{
        if(!err && canvas){ el.innerHTML=''; el.appendChild(canvas); }
      });
    }
  }, 50);
}

function copiarPix(codigo){
  navigator.clipboard?.writeText(codigo).then(()=>{
    toast('Código PIX copiado! ✓');
  }).catch(()=>{
    // Fallback
    const el = document.getElementById('pix-code-text');
    if(el){ const r=document.createRange(); r.selectNode(el); window.getSelection().removeAllRanges(); window.getSelection().addRange(r); document.execCommand('copy'); }
    toast('Código PIX copiado!');
  });
}

function fecharPix(){
  document.getElementById('pix-overlay').classList.remove('show');
}

// Fechar ao clicar no fundo
document.getElementById('pix-overlay')?.addEventListener('click', function(e){
  if(e.target === this) fecharPix();
});

// ── Init ──────────────────────────────────────
(async()=>{
  renderLogin();
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ await carregarDados(); renderHome(); }
  } catch(e){}
})();
</script>
