<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>moviTec</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F4F3EF;--sf:#FFF;--sf2:#F9F8F6;--bd:#E4E2DC;
  --tx:#1A1916;--tx2:#6B6861;--tx3:#A8A59E;
  --ac:#1A5C3A;--ac2:#E8F2ED;
  --red:#C23B2A;--red-bg:#FBF0EE;
  --amb:#8A6200;--amb-bg:#FDF6E3;
  --blu:#1A5CA0;--blu-bg:#EDF3FB;
  --pur:#6B2FBB;--pur-bg:rgba(107,47,187,.1);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
body.dk{
  --bg:#0E1117;--sf:#181C27;--sf2:#1E2333;--bd:#262D40;
  --tx:#E2E0DB;--tx2:#8A8799;--tx3:#4E4C58;
  --ac:#3CB371;--ac2:#142A1C;
  --red:#E05445;--red-bg:#28160F;
  --amb:#D4A027;--amb-bg:#271E0A;
  --blu:#4A8FD9;--blu-bg:#0D1825;
  --pur:#9B5FEB;--pur-bg:rgba(155,95,235,.15);
}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}

/* ---- TOPBAR ---- */
.topbar{
  background:var(--sf);border-bottom:1px solid var(--bd);
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;position:sticky;top:0;z-index:20;
}
.topbar-brand{font-family:'Nunito',sans-serif;font-weight:900;font-size:18px;color:var(--ac)}
.topbar-right{display:flex;align-items:center;gap:6px}
.topbar-user{font-size:11px;color:var(--tx2);font-weight:500;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}

/* ---- SCROLL CONTAINER ---- */
#main-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bot) + 80px)}

/* ---- CONTENT ---- */
.content{padding:14px 14px 0;max-width:680px;margin:0 auto}

/* ---- KPIs ---- */
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 8px;text-align:center}
.kpi-n{font-size:24px;font-weight:700;line-height:1}
.kpi-l{font-size:10px;color:var(--tx3);margin-top:3px;line-height:1.3}

/* ---- FILTROS ---- */
.filtros{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scroll-snap-type:x mandatory}
.filtros::-webkit-scrollbar{display:none}
.fil{flex-shrink:0;scroll-snap-align:start;padding:7px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.fil.on{background:var(--ac);color:#fff;border-color:var(--ac)}

/* ---- CARDS OS ---- */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.card-body{padding:14px 14px 10px;cursor:pointer}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px}
.card-num{font-weight:700;font-size:13px;color:var(--ac)}
.card-title{font-weight:600;font-size:15px;line-height:1.3;flex:1}
.card-sub{font-size:12px;color:var(--tx2);margin-top:2px;display:flex;align-items:center;gap:6px}
.card-desc{font-size:12.5px;color:var(--tx2);margin:7px 0 6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card-login{font-family:monospace;font-size:11px;background:rgba(26,92,58,.1);color:var(--ac);padding:2px 7px;border-radius:5px;font-weight:600}
.card-actions{display:grid;gap:0;border-top:1px solid var(--bd)}
.card-actions.two{grid-template-columns:1fr 1fr}
.card-actions.one{grid-template-columns:1fr}
.cta{padding:13px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;font-family:inherit;color:var(--tx2)}
.cta:active{opacity:.7}
.cta.assumir{color:var(--blu);background:var(--blu-bg)}
.cta.executando{color:var(--amb);background:var(--amb-bg)}
.cta.finalizar{color:var(--ac);background:var(--ac2);font-size:14px}
.cta.detalhe{border-left:1px solid var(--bd)}

/* ---- STATUS PILLS ---- */
.st{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.st-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.s-aberta{background:var(--blu-bg);color:var(--blu)}
.s-assumida{background:var(--amb-bg);color:var(--amb)}
.s-executando{background:var(--pur-bg);color:var(--pur)}
.s-finalizada{background:var(--ac2);color:var(--ac)}
.s-cancelada{background:var(--red-bg);color:var(--red)}
.s-andamento{background:var(--pur-bg);color:var(--pur)}
.s-concluida{background:var(--ac2);color:var(--ac)}
.s-novo{background:var(--blu-bg);color:var(--blu)}
.s-atribuido{background:var(--amb-bg);color:var(--amb)}
.prio{display:inline-flex;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px}
.p-alta{background:var(--red-bg);color:var(--red)}
.p-media{background:var(--amb-bg);color:var(--amb)}
.p-baixa{background:var(--ac2);color:var(--ac)}

/* ---- EMPTY ---- */
.empty{text-align:center;padding:60px 20px;color:var(--tx3);font-size:14px}
.empty-ico{font-size:40px;margin-bottom:10px}

/* ---- PULL TO REFRESH ---- */
.ptr{text-align:center;padding:0;height:0;overflow:hidden;font-size:12px;color:var(--tx3);transition:height .2s,padding .2s}
.ptr.show{height:40px;padding:12px 0}

/* ---- MODAIS ---- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--sf);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0;animation:up .25s ease;position:relative}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--bd);margin:12px auto 4px}
.sheet-head{padding:12px 18px 14px;border-bottom:1px solid var(--bd)}
.sheet-title{font-size:16px;font-weight:700}
.sheet-sub{font-size:12px;color:var(--tx3);margin-top:2px}
.sheet-body{padding:16px 18px}
.sheet-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}

/* ---- ROWS NO MODAL ---- */
.row-sec{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;margin-bottom:12px;overflow:hidden}
.row-sec-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--tx3);padding:9px 12px 0}
.drow{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--bd);font-size:13px;gap:10px}
.drow:last-child{border-bottom:none}
.dlab{color:var(--tx3);flex-shrink:0}
.dval{font-weight:500;text-align:right;word-break:break-all}
.dval.mono{font-family:monospace;font-weight:700;color:var(--ac);font-size:14px}

/* ---- FORM ---- */
.flabel{font-size:11.5px;font-weight:600;color:var(--tx2);display:block;margin:14px 0 5px}
.flabel:first-child{margin-top:0}
.finput{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font-size:14px;font-family:inherit;-webkit-appearance:none}
.finput:focus{outline:none;border-color:var(--ac)}
textarea.finput{resize:vertical;min-height:90px;line-height:1.5}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---- BTNS ---- */
.btn-full{width:100%;padding:14px;border-radius:12px;border:none;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;margin-top:10px}
.btn-full:active{opacity:.8}
.btn-full:disabled{opacity:.5;cursor:not-allowed}
.btn-green{background:var(--ac);color:#fff}
.btn-ghost{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)}
.btn-blu{background:var(--blu);color:#fff}
.btn-amb{background:var(--amb);color:#fff}

/* ---- ALERTA ---- */
.alert{border-left:3px solid var(--ac);background:var(--ac2);border-radius:0 9px 9px 0;padding:10px 12px;font-size:12.5px;color:var(--ac);margin-bottom:14px;line-height:1.5}
.alert.warn{border-color:var(--amb);background:var(--amb-bg);color:var(--amb)}
.alert.red{border-color:var(--red);background:var(--red-bg);color:var(--red)}

/* ---- DIAGNÓSTICO ---- */
.diag-stat{display:flex;align-items:center;gap:10px;padding:12px;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
.dg-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dg-dot.on{background:#3CB371;box-shadow:0 0 0 4px rgba(60,179,113,.2)}
.dg-dot.off{background:var(--red)}
.diag-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.diag-cell{background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:9px 11px}
.diag-cell-l{font-size:10px;color:var(--tx3);margin-bottom:2px}
.diag-cell-v{font-family:monospace;font-size:13px;font-weight:700}
.ping-out{font-family:monospace;font-size:11.5px;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:10px;max-height:140px;overflow-y:auto;white-space:pre-wrap;line-height:1.6;margin-top:8px}
.p-ok{color:var(--ac)}.p-err{color:var(--red)}.p-hdr{color:var(--blu)}

/* ---- LOGIN SCREEN ---- */
#ls{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:200;padding:20px}
#ls.hide{display:none}
.lbox{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.llogo{font-family:'Nunito',sans-serif;font-weight:900;font-size:28px;color:var(--ac);text-align:center;margin-bottom:4px}
.lsub{text-align:center;font-size:13px;color:var(--tx3);margin-bottom:24px}
.lfield{margin-bottom:14px}
.llabel{font-size:11.5px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px}
.linput{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font-size:15px;font-family:inherit;-webkit-appearance:none}
.linput:focus{outline:none;border-color:var(--ac)}
.lerr{background:var(--red-bg);color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:9px;margin-top:10px;display:none}
.lerr.show{display:block}

/* ---- TOAST ---- */
.toast{position:fixed;bottom:calc(var(--safe-bot) + 20px);left:50%;transform:translateX(-50%) translateY(60px);background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:400;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- LOADING ---- */
#ld{display:none;position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:500;align-items:center;justify-content:center}
#ld.show{display:flex}
.spin{width:40px;height:40px;border:3px solid var(--ac2);border-top-color:var(--ac);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.spin-sm{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px;margin-right:6px}

/* ---- REFRESH BTN ---- */
.refresh-fab{position:fixed;bottom:calc(var(--safe-bot) + 16px);right:16px;width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:30}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="ls">
  <div class="lbox">
    <div class="llogo">moviTec</div>
    <div class="lsub">Área do Técnico</div>
    <div class="lfield">
      <label class="llabel">E-mail</label>
      <input class="linput" type="email" id="l-email" placeholder="tecnico@email.com" autocomplete="username">
    </div>
    <div class="lfield">
      <label class="llabel">Senha</label>
      <input class="linput" type="password" id="l-senha" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-full btn-green" onclick="login()">Entrar</button>
    <div class="lerr" id="l-err"></div>
  </div>
</div>

<!-- APP -->
<div class="topbar">
  <div class="topbar-brand">moviTec</div>
  <div class="topbar-right">
    <div class="topbar-user" id="tb-nome">—</div>
    <button class="ico-btn" onclick="toggleTema()" title="Tema">☀️</button>
    <button class="ico-btn" onclick="logout()" title="Sair">↩</button>
  </div>
</div>

<div id="main-scroll">
  <div class="content">
    <div class="ptr" id="ptr">↻ Atualizando...</div>

    <!-- KPIs -->
    <div class="kpis">
      <div class="kpi">
        <div class="kpi-n" id="k-pend" style="color:var(--blu)">—</div>
        <div class="kpi-l">Pendentes</div>
      </div>
      <div class="kpi">
        <div class="kpi-n" id="k-exec" style="color:var(--pur)">—</div>
        <div class="kpi-l">Assumidas / Executando</div>
      </div>
      <div class="kpi">
        <div class="kpi-n" id="k-fin" style="color:var(--ac)">—</div>
        <div class="kpi-l">Finalizadas Hoje</div>
      </div>
    </div>

    <!-- FILTROS -->
    <div class="filtros">
      <button class="fil on" data-f="" onclick="filtrar(this,'')">Todas</button>
      <button class="fil" data-f="aberta" onclick="filtrar(this,'aberta')">📋 Abertas</button>
      <button class="fil" data-f="assumida" onclick="filtrar(this,'assumida')">✋ Assumidas</button>
      <button class="fil" data-f="executando" onclick="filtrar(this,'executando')">🔧 Executando</button>
      <button class="fil" data-f="finalizada" onclick="filtrar(this,'finalizada')">✅ Finalizadas</button>
    </div>

    <!-- LISTA -->
    <div class="list" id="lista"></div>
  </div>
</div>

<!-- FAB REFRESH -->
<button class="refresh-fab" onclick="atualizar(true)">↻</button>

<!-- MODAL: DETALHE -->
<div class="ov" id="ov-det" onclick="if(event.target===this)fecharDet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <button class="sheet-close" onclick="fecharDet()">✕</button>
    <div class="sheet-head">
      <div class="sheet-title" id="det-title">—</div>
      <div id="det-badge"></div>
    </div>
    <div class="sheet-body" id="det-body"></div>
  </div>
</div>

<!-- MODAL: FINALIZAR OS -->
<div class="ov" id="ov-fin" onclick="if(event.target===this)fecharFin()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <button class="sheet-close" onclick="fecharFin()">✕</button>
    <div class="sheet-head">
      <div class="sheet-title">✅ Finalizar OS</div>
      <div class="sheet-sub" id="fin-sub">—</div>
    </div>
    <div class="sheet-body">
      <div class="alert">Preencha o relatório antes de finalizar. Ficará registrado no sistema.</div>

      <label class="flabel">✏️ O que foi feito? <span style="color:var(--red)">*</span></label>
      <textarea class="finput" id="fin-sol" placeholder="Ex: Substituída ONU. Sinal normalizado após troca do conector..."></textarea>

      <label class="flabel">📶 Sinal Fibra / Rádio</label>
      <select class="finput" id="fin-sinal">
        <option value="">— Selecione —</option>
        <option>✅ Sinal óptico normal (dentro do padrão)</option>
        <option>⚠️ Sinal óptico baixo (atenuação alta)</option>
        <option>❌ Sinal óptico crítico (sem sinal)</option>
        <option>✅ Sinal de rádio bom</option>
        <option>⚠️ Sinal de rádio fraco</option>
        <option>⚠️ Sinal de rádio instável</option>
        <option>— Não se aplica</option>
      </select>

      <label class="flabel">📡 Speedtest (Mbps)</label>
      <div class="frow2">
        <div>
          <input class="finput" type="number" id="fin-down" placeholder="Download" min="0" inputmode="decimal">
          <div style="font-size:10px;color:var(--tx3);margin-top:3px;text-align:center">Download</div>
        </div>
        <div>
          <input class="finput" type="number" id="fin-up" placeholder="Upload" min="0" inputmode="decimal">
          <div style="font-size:10px;color:var(--tx3);margin-top:3px;text-align:center">Upload</div>
        </div>
      </div>

      <label class="flabel">📝 Observações (opcional)</label>
      <textarea class="finput" id="fin-obs" placeholder="Orientações ao cliente, pendências..."></textarea>

      <button class="btn-full btn-green" id="btn-fin" onclick="confirmarFin()">✅ Confirmar Finalização</button>
      <button class="btn-full btn-ghost" onclick="fecharFin()" style="margin-top:6px">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="ld"><div class="spin"></div></div>

<script>
const SB_URL = 'https://mgtetsmcswdtvsgewcen.supabase.co';
const SB_KEY = 'sb_publishable_sJbQFk74Yhxw9Mnt6r3Piw_ahaydtFQ';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

let _tec = null, _os = [], _fil = '', _aberta = null, _proxyUrl = '';

/* ---- UTILS ---- */
const $  = id => document.getElementById(id);
const ld = v  => $('ld').classList.toggle('show', v);
function hoje(){ return new Date().toISOString().slice(0,10); }
function fmtD(d){ if(!d) return '—'; const [y,m,dia]=d.slice(0,10).split('-'); return `${dia}/${m}/${y}`; }
function toast(msg, dur=2500){
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), dur);
}
function toggleTema(){
  document.body.classList.toggle('dk');
  localStorage.setItem('mtema', document.body.classList.contains('dk')? 'dk':'');
}

/* ---- LABELS E CLASSES ---- */
const ST_LB = {
  aberta:'📋 Aberta', assumida:'✋ Assumida', executando:'🔧 Executando',
  finalizada:'✅ Finalizada', cancelada:'❌ Cancelada',
  andamento:'🔧 Em andamento', concluida:'✅ Concluída',
  novo:'Novo', atribuido:'Atribuído',
};
const ST_CL = {
  aberta:'s-aberta', assumida:'s-assumida', executando:'s-executando',
  finalizada:'s-finalizada', cancelada:'s-cancelada',
  andamento:'s-andamento', concluida:'s-concluida',
  novo:'s-novo', atribuido:'s-atribuido',
};
const PR_LB = { alta:'🔴 Alta', media:'🟡 Média', baixa:'🟢 Baixa' };
const PR_CL = { alta:'p-alta', media:'p-media', baixa:'p-baixa' };

/* ---- AUTH ---- */
async function login(){
  const email=$('l-email').value.trim(), senha=$('l-senha').value;
  const err=$('l-err'); err.classList.remove('show');
  ld(true);
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){ ld(false); err.textContent=error.message; err.classList.add('show'); return; }
  const { data: tec } = await sb.from('campo_tecnicos').select('*').eq('user_id', data.user.id).maybeSingle();
  ld(false);
  if(!tec){ err.textContent='Técnico não cadastrado. Fale com o administrador.'; err.classList.add('show'); await sb.auth.signOut(); return; }
  _tec = tec;
  entrar();
}

async function logout(){
  await sb.auth.signOut(); _tec=null; _os=[];
  $('ls').classList.remove('hide');
}

async function entrar(){
  $('ls').classList.add('hide');
  $('tb-nome').textContent = _tec.nome||'Técnico';
  if(localStorage.getItem('mtema')==='dk') document.body.classList.add('dk');
  // Busca config IXC do banco
  const { data: cfg } = await sb.from('app_config').select('valor').eq('chave','ixc_proxy_url').maybeSingle();
  _proxyUrl = cfg?.valor || '';
  await atualizar();
}

// Verifica sessão ao carregar
(async ()=>{
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    const { data: tec } = await sb.from('campo_tecnicos').select('*').eq('user_id', session.user.id).maybeSingle();
    if(tec){ _tec=tec; await entrar(); return; }
  }
})();

/* ---- DADOS ---- */
async function atualizar(manual=false){
  if(!_tec) return;
  if(manual){ $('ptr').classList.add('show'); }
  const { data } = await sb.from('campo_os').select('*').eq('tecnico_id', _tec.id).order('id',{ascending:false});
  _os = data||[];
  if(manual){ setTimeout(()=>$('ptr').classList.remove('show'), 500); }
  kpis(); render();
}

function kpis(){
  const h = hoje();
  const ativas = ['aberta','assumida','executando','andamento'];
  $('k-pend').textContent = _os.filter(o=>ativas.includes(o.status)).length;
  $('k-exec').textContent = _os.filter(o=>['assumida','executando','andamento'].includes(o.status)).length;
  $('k-fin').textContent  = _os.filter(o=>['finalizada','concluida'].includes(o.status) && o.data===h).length;
}

/* ---- FILTRO ---- */
function filtrar(btn, f){
  _fil = f;
  document.querySelectorAll('.fil').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

/* ---- RENDER ---- */
function render(){
  const el = $('lista');
  const lista = _fil ? _os.filter(o=>o.status===_fil) : _os;
  if(!lista.length){
    el.innerHTML=`<div class="empty"><div class="empty-ico">📋</div>Nenhuma OS${_fil?' nesse status':' atribuída'}.</div>`;
    return;
  }

  el.innerHTML = lista.map(os=>{
    const stCl = ST_CL[os.status]||'s-aberta';
    const stLb = ST_LB[os.status]||os.status;
    const prCl = PR_CL[os.prioridade]||'p-media';
    const prLb = PR_LB[os.prioridade]||'Média';
    const num  = `#${String(os.numero||0).padStart(4,'0')}`;

    // Botão de ação principal
    let acao='';
    if(os.status==='aberta')
      acao=`<button class="cta assumir" onclick="rapido(event,${os.id},'assumida')">✋ Assumir OS</button>`;
    else if(os.status==='assumida')
      acao=`<button class="cta executando" onclick="rapido(event,${os.id},'executando')">🔧 Iniciar execução</button>`;
    else if(['executando','andamento'].includes(os.status))
      acao=`<button class="cta finalizar" onclick="abrirFin(event,${os.id})">✅ Finalizar OS</button>`;

    return `<div class="card">
      <div class="card-body" onclick="abrirDet(${os.id})">
        <div class="card-top">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
              <span class="card-num">${num}</span>
              <span class="st ${stCl}"><span class="st-dot"></span>${stLb}</span>
            </div>
            <div class="card-title">${os.cliente||'—'}</div>
            <div class="card-sub">
              ${os.telefone?`📞 ${os.telefone}`:''}
              ${os.login_cliente?`<span class="card-login">${os.login_cliente}</span>`:''}
            </div>
          </div>
        </div>
        <div class="card-desc">${os.descricao||'—'}</div>
        <div class="card-meta">
          <span class="prio ${prCl}">${prLb}</span>
          <span style="font-size:11px;color:var(--tx3)">📅 ${fmtD(os.data)}</span>
          ${os.endereco?`<span style="font-size:11px;color:var(--tx3)">📍 ${os.endereco.slice(0,35)}${os.endereco.length>35?'…':''}</span>`:''}
        </div>
      </div>
      ${acao?`<div class="card-actions one">${acao}</div>`:''}
    </div>`;
  }).join('');
}

/* ---- AÇÃO RÁPIDA ---- */
async function rapido(evt, id, status){
  evt.stopPropagation();
  const campos = status==='assumida'   ? {status,assumido_em:new Date().toISOString()} :
                 status==='executando'  ? {status,executando_em:new Date().toISOString()} :
                 {status};
  ld(true);
  const {error} = await sb.from('campo_os').update(campos).eq('id',id);
  ld(false);
  if(error){ toast('Erro: '+error.message); return; }
  await atualizar();
  toast({assumida:'✋ OS assumida!',executando:'🔧 Executando!'}[status]||'Atualizado!');
}

/* ---- DETALHE DA OS ---- */
function abrirDet(id){
  const os = _os.find(x=>x.id==id);
  if(!os) return;
  _aberta = os;

  const stCl = ST_CL[os.status]||'s-aberta';
  const stLb = ST_LB[os.status]||os.status;
  $('det-title').textContent = `OS #${String(os.numero||0).padStart(4,'0')} — ${os.cliente||'—'}`;
  $('det-badge').innerHTML   = `<span class="st ${stCl}" style="margin-top:4px;display:inline-flex"><span class="st-dot"></span>${stLb}</span>`;

  // Construir corpo
  let html = '';

  // Dados do cliente
  html += `<div class="row-sec">
    <div class="row-sec-title">👤 Cliente</div>
    <div class="drow"><span class="dlab">Nome</span><span class="dval">${os.cliente||'—'}</span></div>
    <div class="drow"><span class="dlab">Telefone</span><span class="dval">${os.telefone||'—'}</span></div>
    <div class="drow"><span class="dlab">Endereço</span><span class="dval">${os.endereco||'—'}</span></div>
  </div>`;

  // Acesso PPPoE
  if(os.login_cliente){
    html += `<div class="row-sec">
      <div class="row-sec-title">🌐 Acesso PPPoE</div>
      <div class="drow"><span class="dlab">Login</span><span class="dval mono">${os.login_cliente}</span></div>
    </div>`;
  }

  // Serviço
  html += `<div class="row-sec">
    <div class="row-sec-title">🔧 Serviço</div>
    <div class="drow"><span class="dlab">Descrição</span><span class="dval">${os.descricao||'—'}</span></div>
    <div class="drow"><span class="dlab">Prioridade</span><span class="dval">${PR_LB[os.prioridade]||'—'}</span></div>
    <div class="drow"><span class="dlab">Data</span><span class="dval">${fmtD(os.data)}</span></div>
    ${os.pecas?`<div class="drow"><span class="dlab">Peças</span><span class="dval">${os.pecas}</span></div>`:''}
    ${os.obs?`<div class="drow"><span class="dlab">Obs.</span><span class="dval">${os.obs}</span></div>`:''}
  </div>`;

  // Diagnóstico IXC (se tiver login e proxy)
  if(os.login_cliente && _proxyUrl){
    html += `<div class="row-sec">
      <div class="row-sec-title">📊 Diagnóstico de Conexão</div>
      <div style="padding:10px 12px" id="diag-wrap">
        <button onclick="carregarDiag()" class="btn-full btn-ghost" style="margin-top:0;font-size:13px;padding:11px">📡 Carregar diagnóstico</button>
      </div>
    </div>`;
  }

  // Ações de status
  const fim = ['finalizada','concluida','cancelada'];
  if(!fim.includes(os.status)){
    let btns = '';
    if(os.status==='aberta')      btns=`<button class="btn-full btn-blu" onclick="rapidoDet('assumida')">✋ Assumir esta OS</button>`;
    else if(os.status==='assumida') btns=`<button class="btn-full btn-amb" style="background:var(--amb)" onclick="rapidoDet('executando')">🔧 Iniciar execução</button>`;
    else if(['executando','andamento'].includes(os.status)) btns=`<button class="btn-full btn-green" onclick="abrirFinDet()">✅ Finalizar OS</button>`;
    html += btns;
  }

  // Se já finalizada: mostra resumo
  if(['finalizada','concluida'].includes(os.status) && os.solucao){
    html += `<div class="alert" style="margin-top:12px">
      <strong>✅ Relatório de finalização</strong><br>
      <b>Solução:</b> ${os.solucao}<br>
      ${os.sinal_fibra?`<b>Sinal:</b> ${os.sinal_fibra}<br>`:''}
      ${os.speedtest_down?`<b>Speedtest:</b> ↓${os.speedtest_down} / ↑${os.speedtest_up||'—'} Mbps`:''}
    </div>`;
  }

  $('det-body').innerHTML = html;
  $('ov-det').classList.add('open');
}

function fecharDet(){ $('ov-det').classList.remove('open'); _aberta=null; }

async function rapidoDet(status){
  if(!_aberta) return;
  fecharDet();
  const fakeEvt = {stopPropagation:()=>{}};
  await rapido(fakeEvt, _aberta.id, status);
}

/* ---- DIAGNÓSTICO IXC ---- */
async function carregarDiag(){
  if(!_aberta?.login_cliente || !_proxyUrl) return;
  const wrap = $('diag-wrap');
  wrap.innerHTML='<div style="text-align:center;padding:14px;color:var(--tx3)"><span class="spin-sm"></span> Buscando dados...</div>';

  try {
    const r1 = await fetch(_proxyUrl,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({endpoint:'radusuarios',params:{qtype:'radusuarios.login',query:_aberta.login_cliente,oper:'=',rp:'1'}})});
    const d1 = await r1.json();
    const r  = (d1.registros||[])[0];

    if(!r){ wrap.innerHTML='<div style="padding:10px 12px;color:var(--tx3);font-size:13px">Login não encontrado no IXC.</div>'; return; }

    const on = r.online==='S'||r.online===true;
    const q  = parseInt(r.quantidade_desconexao_hoje||0);
    const qcor = q>=3?'var(--red)':q>=1?'var(--amb)':'var(--ac)';

    wrap.innerHTML=`
      <div class="diag-stat">
        <span class="dg-dot ${on?'on':'off'}"></span>
        <div>
          <div style="font-weight:600;font-size:14px">${on?'🟢 Online':'🔴 Offline'}</div>
          ${r.tempo_conectado?`<div style="font-size:11px;color:var(--tx3)">Há ${r.tempo_conectado.slice(0,8)}</div>`:''}
        </div>
      </div>
      <div class="diag-grid">
        <div class="diag-cell"><div class="diag-cell-l">IP atual</div><div class="diag-cell-v">${r.ip||r.framedipaddress||'—'}</div></div>
        <div class="diag-cell"><div class="diag-cell-l">Quedas hoje</div><div class="diag-cell-v" style="color:${qcor}">${q}</div></div>
        <div class="diag-cell" style="grid-column:span 2"><div class="diag-cell-l">Concentrador / Interface</div><div class="diag-cell-v" style="font-size:11px">${r.ip_concentrador||r.nasipaddress||'—'} · ${r.interface_conexao||r.nas_port_id||'—'}</div></div>
      </div>
      ${q>=2?`<div class="alert warn">⚠️ ${q} quedas hoje — verificar cabo, ONU e potência óptica.</div>`:''}
      ${!on?`<div class="alert red">❌ Cliente offline. Verificar ONU, roteador e cabo.</div>`:''}
      <button onclick="executarPing(${r.id})" class="btn-full btn-ghost" style="font-size:13px;padding:11px;margin-top:0">📡 Executar Ping</button>
      <div id="ping-out"></div>`;
  } catch(e){
    wrap.innerHTML=`<div style="padding:10px 12px;color:var(--red);font-size:13px">Erro: ${e.message}</div>`;
  }
}

async function executarPing(loginId){
  const out=$('ping-out'); if(!out) return;
  out.innerHTML='<div class="ping-out"><span class="spin-sm"></span> Pingando...</div>';
  try {
    const r = await fetch(_proxyUrl,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({endpoint:`radusuarios/${loginId}/ping`,params:{}})});
    const d = await r.json();
    const txt = d.resultado||d.result||d.output||JSON.stringify(d,null,2);
    out.innerHTML='<div class="ping-out">'+String(txt).split('\n').map(l=>{
      if(l.includes('bytes from')||l.includes('time=')) return`<span class="p-ok">${l}</span>`;
      if(l.includes('error')||l.includes('unreachable')) return`<span class="p-err">${l}</span>`;
      if(l.startsWith('PING')||l.includes('statistics')) return`<span class="p-hdr">${l}</span>`;
      return l;
    }).join('\n')+'</div>';
  } catch(e){ out.innerHTML=`<div class="ping-out p-err">Erro: ${e.message}</div>`; }
}

/* ---- FINALIZAÇÃO ---- */
function abrirFin(evt, id){
  evt?.stopPropagation();
  const os = _os.find(x=>x.id==id);
  if(!os) return;
  _aberta = os;
  $('fin-sub').textContent = `OS #${String(os.numero||0).padStart(4,'0')} — ${os.cliente||'—'}`;
  $('fin-sol').value=''; $('fin-sinal').value=''; $('fin-down').value=''; $('fin-up').value=''; $('fin-obs').value='';
  $('ov-fin').classList.add('open');
}

function abrirFinDet(){
  if(!_aberta) return;
  fecharDet();
  abrirFin(null, _aberta.id);
}

function fecharFin(){ $('ov-fin').classList.remove('open'); }

async function confirmarFin(){
  if(!_aberta) return;
  const sol = $('fin-sol').value.trim();
  if(!sol){ toast('⚠️ Descreva o que foi feito.'); return; }

  const btn = $('btn-fin');
  btn.disabled=true; btn.textContent='Finalizando...';

  try {
    const {error} = await sb.from('campo_os').update({
      status: 'finalizada',
      solucao: sol,
      sinal_fibra: $('fin-sinal').value||null,
      speedtest_down: parseFloat($('fin-down').value)||null,
      speedtest_up:   parseFloat($('fin-up').value)||null,
      obs: $('fin-obs').value.trim()||null,
      finalizado_em: new Date().toISOString(),
    }).eq('id',_aberta.id);

    if(error){ toast('Erro: '+error.message); return; }
    fecharFin(); _aberta=null;
    await atualizar();
    toast('✅ OS finalizada!', 3000);
  } catch(e){ toast('Erro: '+e.message); }
  finally { btn.disabled=false; btn.innerHTML='✅ Confirmar Finalização'; }
}

// Pull-to-refresh simples
let _startY=0;
$('main-scroll').addEventListener('touchstart',e=>{ _startY=e.touches[0].clientY; },{passive:true});
$('main-scroll').addEventListener('touchend',e=>{
  if($('main-scroll').scrollTop===0 && e.changedTouches[0].clientY-_startY>60) atualizar(true);
},{passive:true});
</script>
