<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B3ED8">
<meta name="robots" content="noindex,nofollow">
<title>Assinatura eletrônica · MoviOn Internet</title>
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#3B3ED8; --azul-esc:#2B2EA8; --azul-luz:#EEF0FF;
  --tinta:#1A1B2E; --tinta-media:#5B5D77; --tinta-fraca:#9496B0;
  --linha:#E4E5F3; --fundo:#F4F5F9; --papel:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--fundo); color:var(--tinta); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100%;display:flex;flex-direction:column}

/* ---- barra de topo: fica sempre visível, é onde o cliente se localiza ---- */
.topo{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:var(--azul);color:#fff;position:sticky;top:0;z-index:10;
}
.topo .voltar{
  background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:9px;
  padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;flex:none;
}
.topo .titulo{font-size:13.5px;font-weight:800;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topo .passo{font-size:11px;font-weight:700;opacity:.85;flex:none}

/* ---- trilha de progresso ---- */
.trilha{display:flex;gap:4px;padding:0 14px;background:var(--azul)}
.trilha i{flex:1;height:3px;background:rgba(255,255,255,.25);border-radius:2px}
.trilha i.on{background:#fff}

.miolo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rodape{
  padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--linha);background:var(--papel);
  position:sticky;bottom:0;
}
.btn{
  width:100%;background:var(--azul);color:#fff;border:none;border-radius:12px;
  padding:15px;font-weight:800;font-size:14.5px;cursor:pointer;font-family:inherit;
}
.btn:disabled{background:#C9CBE8;cursor:not-allowed}
.btn.fantasma{background:var(--azul-luz);color:var(--azul);border:1.5px solid var(--azul)}

/* ---- folha do documento ---- */
.acalma{
  background:var(--azul-luz);color:var(--azul-esc);font-size:11.5px;line-height:1.5;
  padding:9px 14px;border-bottom:1px solid #DCDEF7;
}
.folha-area{background:#EDEEF3;padding:14px 10px 22px}
.folha{
  max-width:660px;margin:0 auto;background:var(--papel);border-radius:6px;
  box-shadow:0 2px 14px rgba(0,0,0,.10);padding:26px 22px 34px;
}
.folha-topo{display:flex;align-items:center;gap:11px;border-bottom:2px solid var(--azul);padding-bottom:13px;margin-bottom:20px}
.folha-topo img{width:44px;height:44px;border-radius:8px;flex:none}
.folha-marca{font-family:'DM Sans',sans-serif;font-size:16.5px;font-weight:800;color:var(--azul-esc);line-height:1.1}
.folha-cnpj{font-size:9.5px;color:#666;margin-top:3px;line-height:1.35}
.folha-nome{
  text-align:center;font-size:14.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.02em;margin-bottom:20px;font-family:'DM Sans',sans-serif;
}
.corpo{font-size:12.5px;line-height:1.75;color:#23243B;word-wrap:break-word;overflow-wrap:break-word}
.corpo p{margin:0 0 11px}
.corpo table{width:100%;border-collapse:collapse;font-size:11.5px;margin:10px 0;display:block;overflow-x:auto}
.corpo td,.corpo th{border:1px solid var(--linha);padding:6px 8px}
.corpo img{max-width:100%;height:auto}
.corpo h1,.corpo h2,.corpo h3{font-family:'DM Sans',sans-serif;font-size:13.5px;margin:16px 0 8px}

/* ---- formulário ---- */
.pad{padding:20px 18px}
.dica{font-size:12.5px;color:var(--tinta-media);margin-bottom:16px;line-height:1.6}
label.campo{display:block;font-size:11.5px;font-weight:600;color:var(--tinta-media);margin:0 0 5px}
input.campo{
  width:100%;padding:13px 14px;border:1.5px solid var(--linha);border-radius:10px;
  font-size:15px;font-family:inherit;background:var(--papel);color:var(--tinta);margin-bottom:14px;
}
input.campo:focus{outline:none;border-color:var(--azul)}
.nota{font-size:11.5px;color:var(--tinta-fraca);margin:-6px 0 16px;line-height:1.5}

/* ---- selfie ---- */
.selfie-area{padding:24px 20px;text-align:center}
.selfie-emoji{font-size:42px;margin-bottom:8px}
.selfie-t{font-size:15.5px;font-weight:800;margin-bottom:8px;line-height:1.35}
.moldura{border:2px dashed #C9CBE8;border-radius:16px;padding:24px;margin:18px 0;background:var(--papel)}
.moldura img{max-width:100%;border-radius:12px;display:block;margin:0 auto}
.vazio{color:var(--tinta-fraca);font-size:13px}

/* ---- avisos de estado ---- */
.aviso{padding:40px 26px;text-align:center;margin:auto}
.aviso .ico{font-size:52px;margin-bottom:12px}
.aviso h2{font-family:'DM Sans',sans-serif;font-size:19px;margin:0 0 8px}
.aviso p{font-size:13.5px;color:var(--tinta-media);margin:0 0 8px;line-height:1.6}
.codigo{
  display:inline-block;font-size:13px;font-weight:800;color:var(--azul);
  background:var(--azul-luz);border-radius:9px;padding:9px 15px;margin-top:6px;
  letter-spacing:.03em;
}
.giro{
  width:26px;height:26px;border:3px solid var(--linha);border-top-color:var(--azul);
  border-radius:50%;animation:g .8s linear infinite;margin:0 auto 14px;
}
@keyframes g{to{transform:rotate(360deg)}}
.rodape-legal{
  font-size:10.5px;color:var(--tinta-fraca);text-align:center;
  padding:16px 20px 26px;line-height:1.6;
}
</style>
</head>
<body>
<div id="app"><div class="aviso"><div class="giro"></div><p>Abrindo seus documentos…</p></div></div>

   certificado. O que autentica esta tela é o token do endereço — por
   isso ele não aparece em nenhum texto visível nem vai para o título

var TOKEN = (function(){
  try{
    var p = new URLSearchParams(location.search);
    return (p.get('t') || p.get('token') || '').trim();
  }catch(e){ return ''; }
})();

var app = document.getElementById('app');
var S = { docs:[], idx:0, cliente:null, dados:null, selfie:null, enviando:false };

function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function chamar(action, dados){
  var ctrl = new AbortController();
  var t = setTimeout(function(){ ctrl.abort(); }, 90000);
  return fetch(API, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(Object.assign({ action:action, link_token:TOKEN }, dados||{})),
    signal: ctrl.signal
  }).then(function(r){
    clearTimeout(t);
    return r.text().then(function(txt){
      var j;
      try{ j = JSON.parse(txt); }
      catch(e){ throw new Error('O servidor respondeu de um jeito que não entendi (HTTP ' + r.status + ').'); }
      if(!j.ok) { var e2 = new Error(j.error || ('Erro ' + r.status)); e2.expirado = !!j.expirado; throw e2; }
      return j;
    });
  }, function(err){
    clearTimeout(t);
    if(err.name === 'AbortError') throw new Error('A conexão demorou demais. Tente de novo com uma internet melhor.');
    throw new Error('Não consegui falar com o servidor. Confira sua conexão e tente de novo.');
  });
}

/* ---- telas ---- */
function tela(html){ app.innerHTML = html; app.scrollTop = 0; var m = document.querySelector('.miolo'); if(m) m.scrollTop = 0; }

function trilha(passo){
  // 3 marcos: ler, conferir, assinar. Saber quanto falta é o que segura
  // o cliente num contrato longo.
  var t = '';
  for(var i=1;i<=3;i++) t += '<i class="' + (i<=passo?'on':'') + '"></i>';
  return '<div class="trilha">' + t + '</div>';
}

function telaAviso(ico, titulo, corpo, extra){
  tela('<div class="aviso"><div class="ico">' + ico + '</div><h2>' + titulo + '</h2>' +
       '<p>' + corpo + '</p>' + (extra || '') + '</div>');
}

/* Passo 1 — ler o documento */
function verDocumento(){
  var d = S.docs[S.idx];
  var ultimo = S.idx === S.docs.length - 1;
  tela(
    '<div class="topo">' +
      (S.idx > 0 ? '<button class="voltar" id="btVoltar">‹</button>' : '') +
      '<div class="titulo">' + esc(d.documento_nome || 'Documento') + '</div>' +
      (S.docs.length > 1 ? '<div class="passo">' + (S.idx+1) + '/' + S.docs.length + '</div>' : '') +
    '</div>' + trilha(1) +
    '<div class="miolo">' +
      // só no primeiro documento: quem acabou de clicar no WhatsApp precisa
      // saber, antes de rolar o contrato, que não vai ter que instalar nada
      (S.idx === 0 ? '<div class="acalma">✍️ Assine por aqui mesmo — <b>não precisa instalar nada</b>. ' +
        'Leia, confira seus dados e tire uma selfie com o RG ou a CNH.</div>' : '') +
      '<div class="folha-area"><div class="folha">' +
      '<div class="folha-topo"><img src="' + LOGO + '" alt="MoviOn">' +
        '<div><div class="folha-marca">MoviOn Internet</div>' +
        '<div class="folha-cnpj">Allison Costa de Souza - ME · CNPJ 18.757.155/0001-32 · Ato Anatel 7.025</div></div>' +
      '</div>' +
      '<div class="folha-nome">' + esc(d.documento_nome || '') + '</div>' +
      '<div class="corpo">' + (d.conteudo_html_final || '<p>Conteúdo indisponível.</p>') + '</div>' +
    '</div></div></div>' +
    '<div class="rodape"><button class="btn" id="btOk">' +
      (ultimo ? 'Li e concordo — continuar' : 'Li e concordo — próximo') +
    '</button></div>'
  );
  var v = document.getElementById('btVoltar');
  if(v) v.onclick = function(){ S.idx--; verDocumento(); };
  document.getElementById('btOk').onclick = function(){
    if(S.idx < S.docs.length - 1){ S.idx++; verDocumento(); }
    else conferirDados();
  };
}

/* Passo 2 — conferir os dados do cadastro */
function conferirDados(){
  var c = S.dados || S.cliente || {};
  tela(
    '<div class="topo"><button class="voltar" id="btVoltar">‹</button>' +
      '<div class="titulo">Confira seus dados</div></div>' + trilha(2) +
    '<div class="miolo"><div class="pad">' +
      '<div class="dica">Estes são os dados que vão constar na sua assinatura. Corrija o que estiver diferente do seu documento.</div>' +
      '<label class="campo" for="fNome">Nome completo</label>' +
      '<input class="campo" id="fNome" autocomplete="name" value="' + esc(c.nome) + '">' +
      '<label class="campo" for="fCpf">CPF ou CNPJ</label>' +
      '<input class="campo" id="fCpf" inputmode="numeric" autocomplete="off" value="' + esc(c.cpf) + '">' +
      '<label class="campo" for="fEnd">Endereço da instalação</label>' +
      '<input class="campo" id="fEnd" autocomplete="street-address" value="' + esc(c.endereco) + '">' +
      '<div class="nota">Se algum dado estiver muito diferente, fale com o atendimento antes de assinar — corrigir depois exige um novo contrato.</div>' +
    '</div></div>' +
    '<div class="rodape"><button class="btn" id="btOk">Confirmar e continuar</button></div>'
  );
  document.getElementById('btVoltar').onclick = function(){ S.idx = S.docs.length - 1; verDocumento(); };
  document.getElementById('btOk').onclick = function(){
    var nome = (document.getElementById('fNome').value || '').trim();
    var cpf  = (document.getElementById('fCpf').value  || '').trim();
    var end  = (document.getElementById('fEnd').value  || '').trim();
    if(nome.length < 3){ alert('Escreva seu nome completo.'); return; }
    if(cpf.replace(/\D/g,'').length < 11){ alert('Confira o CPF ou CNPJ — faltam dígitos.'); return; }
    S.dados = { nome:nome, cpf:cpf, endereco:end };
    pedirSelfie();
  };
}

/* Passo 3 — selfie com o documento */
function pedirSelfie(){
  tela(
    '<div class="topo"><button class="voltar" id="btVoltar">‹</button>' +
      '<div class="titulo">Selfie com o documento</div></div>' + trilha(3) +
    '<div class="miolo"><div class="selfie-area">' +
      '<div class="selfie-emoji">🤳</div>' +
      '<div class="selfie-t">Tire uma selfie segurando seu RG ou CNH ao lado do rosto</div>' +
      '<div class="dica">É isso que comprova que foi você quem assinou. Deixe o rosto e o documento nítidos e bem iluminados.</div>' +
      '<div class="moldura" id="moldura"><div class="vazio" id="vazio">Nenhuma foto ainda</div>' +
        '<img id="previa" style="display:none" alt="Sua selfie"></div>' +
      '<input type="file" id="arquivo" accept="image/*" capture="user" style="display:none">' +
      '<button class="btn fantasma" id="btFoto">📷 Abrir a câmera</button>' +
    '</div></div>' +
    '<div class="rodape"><button class="btn" id="btOk" disabled>Assinar documentos</button></div>'
  );
  document.getElementById('btVoltar').onclick = conferirDados;
  document.getElementById('btFoto').onclick = function(){ document.getElementById('arquivo').click(); };
  document.getElementById('arquivo').onchange = fotoEscolhida;
  document.getElementById('btOk').onclick = assinar;
  if(S.selfie) mostrarPrevia('data:image/jpeg;base64,' + S.selfie);
}

function mostrarPrevia(dataUrl){
  var img = document.getElementById('previa');
  var vazio = document.getElementById('vazio');
  if(!img) return;
  img.src = dataUrl; img.style.display = 'block';
  if(vazio) vazio.style.display = 'none';
  var b = document.getElementById('btOk');
  if(b) b.disabled = false;
  var bf = document.getElementById('btFoto');
  if(bf) bf.textContent = '🔄 Tirar outra';
}

function fotoEscolhida(ev){
  var file = ev.target.files && ev.target.files[0];
  if(!file) return;
  var leitor = new FileReader();
  leitor.onload = function(e){
    var img = new Image();
    img.onload = function(){
      // 1000px de largura e JPEG 0.82: legível para conferir rosto e
      // documento, e leve o bastante para subir num 4G ruim de sítio
      var cv = document.createElement('canvas');
      var escala = Math.min(1, 1000 / img.width);
      cv.width = Math.round(img.width * escala);
      cv.height = Math.round(img.height * escala);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var dataUrl = cv.toDataURL('image/jpeg', 0.82);
      S.selfie = dataUrl.split(',')[1];
      mostrarPrevia(dataUrl);
    };
    img.onerror = function(){ alert('Não consegui ler essa foto. Tente tirar outra.'); };
    img.src = e.target.result;
  };
  leitor.readAsDataURL(file);
}

/* Localização: pedida com consentimento e NUNCA obrigatória. Se o
   cliente negar ou o GPS demorar, a assinatura segue sem ela — travar
   aqui seria perder o contrato por causa de uma permissão do celular. */
function pegarGeo(){
  return new Promise(function(resolve){
    if(!navigator.geolocation){ resolve(null); return; }
    var pronto = false;
    function fim(v){ if(!pronto){ pronto = true; resolve(v); } }
    var t = setTimeout(function(){ fim(null); }, 8000);
    navigator.geolocation.getCurrentPosition(
      function(pos){ clearTimeout(t); fim({ lat:pos.coords.latitude, lng:pos.coords.longitude, precisao:pos.coords.accuracy }); },
      function(){ clearTimeout(t); fim(null); },
      { enableHighAccuracy:true, timeout:7000, maximumAge:60000 }
    );
  });
}

function assinar(){
  if(S.enviando) return;
  if(!S.selfie){ alert('Tire a selfie antes de assinar.'); return; }
  S.enviando = true;
  var b = document.getElementById('btOk');
  b.disabled = true; b.textContent = 'Localizando…';
  pegarGeo().then(function(geo){
    b.textContent = 'Assinando…';
    return chamar('link_assinar', { dados_confirmados:S.dados, selfie_base64:S.selfie, geo:geo });
  }).then(function(j){
    pronto(j.codigo_verificacao);
  }).catch(function(err){
    S.enviando = false;
    b.disabled = false; b.textContent = 'Assinar documentos';
    alert('Não deu para assinar agora: ' + err.message);
  });
}

function pronto(codigo){
  telaAviso('✅', 'Documentos assinados!',
    'Sua assinatura foi registrada. O contrato assinado fica guardado com a MoviOn e uma cópia pode ser enviada pelo WhatsApp a qualquer momento.',
    (codigo ? '<div class="codigo">Código de verificação: ' + esc(codigo) + '</div>' : '') +
    '<div class="rodape-legal">Assinatura eletrônica registrada por MoviOn Internet · ' +
    'Allison Costa de Souza - ME · CNPJ 18.757.155/0001-32<br>' +
    'Guardamos data, hora, IP, dispositivo e a foto de conferência junto ao documento.</div>'
  );
}

/* ---- entrada ---- */
function comecar(){
  if(!TOKEN){
    telaAviso('🔗', 'Link incompleto',
      'Esse endereço não veio inteiro. Abra o link direto da mensagem do WhatsApp, sem copiar e colar pela metade.');
    return;
  }
  chamar('link_abrir', {}).then(function(j){
    if(j.ja_assinado){
      telaAviso('✅', 'Já está assinado',
        'Estes documentos já foram assinados' + (j.assinado_em ? ' em ' + new Date(j.assinado_em).toLocaleDateString('pt-BR') : '') +
        '. Não precisa fazer nada.',
        j.codigo_verificacao ? '<div class="codigo">Código: ' + esc(j.codigo_verificacao) + '</div>' : '');
      return;
    }
    S.cliente = j.cliente || {};
    S.docs = j.documentos || [];
    if(!S.docs.length){
      telaAviso('📄', 'Nenhum documento aqui',
        'Este link não tem documento para assinar. Fale com o atendimento pelo WhatsApp.');
      return;
    }
    S.idx = 0;
    verDocumento();
  }).catch(function(err){
    if(err.expirado){
      telaAviso('⏳', 'Este link expirou',
        'Por segurança, o link de assinatura tem prazo. Peça um novo pelo WhatsApp do atendimento — leva menos de um minuto.');
      return;
    }
    telaAviso('🔒', 'Link inválido',
      esc(err.message) + '<br><br>Se você recebeu este link há pouco tempo, chame o atendimento pelo WhatsApp.');
  });
}

comecar();

</script>
