<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoviFiber — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080A0E;
  --superficie:#12161F;
  --linha:#232A38;
  --texto:#E7EBF2;
  --texto-fraco:#7E8798;
  --verde:#3CB371;
  --verde-luz:#5FE0A0;
  --erro:#FF6B60;
  /* código de cores ABNT — a sequência real das 12 fibras */
  --f1:#00A651; --f2:#FFD400; --f3:#FFFFFF; --f4:#2E86FF;
  --f5:#FF2D20; --f6:#A855F7; --f7:#8B5A2B; --f8:#FF3DA5;
  --f9:#5A6577; --f10:#8B90A0; --f11:#FF7A00; --f12:#00E5FF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--texto);
  font-family:'Archivo',system-ui,sans-serif;
  display:grid;
  place-items:center;
  padding:24px;
  overflow:hidden;
  position:relative;
}
/* ===================== FIBRAS ===================== */
.tecido{position:fixed;inset:0;z-index:0;pointer-events:none}
.tecido svg{width:100%;height:100%;display:block}
.fibra{fill:none;stroke-width:1.6;opacity:.30}
.fibra-saida{stroke-width:1.2;opacity:.16}
/* o pulso é um traço curto que percorre o caminho da fibra */
.pulso{
  fill:none;stroke-width:2.6;stroke-linecap:round;
  stroke-dasharray:var(--traco) var(--vao);
  stroke-dashoffset:var(--vao);
  filter:drop-shadow(0 0 5px currentColor);
  animation:correr var(--dur) linear infinite var(--atraso);
  opacity:0;
}
@keyframes correr{
  0%{stroke-dashoffset:var(--vao);opacity:0}
  6%{opacity:.95}
  92%{opacity:.95}
  100%{stroke-dashoffset:calc(-1 * var(--comp));opacity:0}
}
/* halo do ponto de emenda, atrás do cartão */
.emenda{
  position:fixed;left:50%;top:50%;width:520px;height:520px;
  transform:translate(-50%,-50%);z-index:0;pointer-events:none;
  background:radial-gradient(circle,rgba(60,179,113,.16) 0%,rgba(60,179,113,.05) 38%,transparent 68%);
  animation:respirar 5.5s ease-in-out infinite;
}
@keyframes respirar{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}}

/* ===================== CARTÃO ===================== */
.cartao{
  position:relative;z-index:2;width:min(420px,100%);
  background:linear-gradient(180deg,rgba(24,29,40,.93),rgba(14,18,26,.96));
  border:1px solid var(--linha);
  border-radius:18px;
  padding:38px 34px 30px;
  backdrop-filter:blur(18px);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.02) inset;
  animation:entrar .8s cubic-bezier(.16,1,.3,1) both;
}
@keyframes entrar{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}

/* faixa de 12 cores no topo — o cabo chegando ao cartão */
.faixa{position:absolute;top:0;left:22px;right:22px;height:2px;display:flex;gap:2px;overflow:hidden;border-radius:2px}
.faixa i{flex:1;background:var(--c);opacity:.5;animation:acender .5s ease both;animation-delay:calc(var(--n) * .045s + .25s)}
@keyframes acender{from{opacity:0;transform:scaleY(0)}to{opacity:.5;transform:none}}

.marca{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
.marca h1{
  font-size:27px;font-weight:700;letter-spacing:-.024em;
  animation:surgir .6s ease .1s both;
}
.marca h1 em{font-style:normal;color:var(--verde)}
.selo{
  font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.14em;
  color:var(--verde-luz);border:1px solid rgba(95,224,160,.32);
  padding:2px 6px;border-radius:4px;text-transform:uppercase;
  animation:surgir .6s ease .2s both;
}
.sub{
  color:var(--texto-fraco);font-size:13px;line-height:1.5;margin-bottom:28px;
  animation:surgir .6s ease .18s both;
}
@keyframes surgir{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ===================== CAMPOS ===================== */
.campo{position:relative;margin-bottom:20px;animation:surgir .6s ease var(--d) both}
.campo label{
  display:block;font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--texto-fraco);
  margin-bottom:7px;transition:color .22s;
}
.campo input{
  width:100%;background:rgba(255,255,255,.028);
  border:1px solid var(--linha);border-radius:10px;
  padding:12px 14px;color:var(--texto);
  font-family:'Archivo',sans-serif;font-size:14.5px;
  transition:border-color .22s,background .22s;
}
.campo input::placeholder{color:#4C5464}
.campo input:focus{outline:none;border-color:rgba(60,179,113,.55);background:rgba(60,179,113,.05)}
.campo:focus-within label{color:var(--verde-luz)}
/* a luz percorrendo a base do campo em foco */
.campo .luz{position:absolute;left:0;right:0;bottom:0;height:1px;overflow:hidden;border-radius:1px}
.campo .luz::after{
  content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,var(--verde-luz),transparent);
  opacity:0;transition:opacity .2s;
}
.campo:focus-within .luz::after{opacity:1;animation:varrer 1.5s linear infinite}
@keyframes varrer{from{left:-40%}to{left:100%}}

/* ===================== BOTÃO ===================== */
.entrar{
  position:relative;width:100%;overflow:hidden;
  background:var(--verde);color:#06130C;
  border:none;border-radius:10px;padding:13px;
  font-family:'Archivo',sans-serif;font-size:14.5px;font-weight:600;
  cursor:pointer;transition:transform .16s,box-shadow .22s,filter .2s;
  animation:surgir .6s ease .34s both;
}
.entrar:hover:not(:disabled){filter:brightness(1.07);box-shadow:0 8px 26px -6px rgba(60,179,113,.5)}
.entrar:active:not(:disabled){transform:translateY(1px)}
.entrar:disabled{opacity:.55;cursor:progress}
.entrar::after{
  content:'';position:absolute;inset:0;left:-100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
}
.entrar:hover:not(:disabled)::after{animation:passar .8s ease}
@keyframes passar{to{left:100%}}

/* ===================== AVISO ===================== */
.aviso{
  display:none;align-items:flex-start;gap:9px;
  background:rgba(255,107,96,.09);border:1px solid rgba(255,107,96,.3);
  color:#FF9A92;border-radius:9px;padding:10px 12px;
  font-size:12.5px;line-height:1.5;margin-bottom:16px;
}
.aviso.ver{display:flex;animation:tremer .42s ease}
.aviso b{color:#FFC4BF;font-weight:600}
@keyframes tremer{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

.rodape{
  margin-top:22px;padding-top:16px;border-top:1px solid var(--linha);
  font-family:'DM Mono',monospace;font-size:10px;line-height:1.85;
  color:#5C6474;letter-spacing:.04em;
  animation:surgir .6s ease .42s both;
}
.rodape span{color:var(--verde)}

/* ===================== SUCESSO ===================== */
.clarao{
  position:fixed;inset:0;z-index:60;background:#EAFFF3;
  opacity:0;pointer-events:none;
}
.clarao.fundir{animation:fundir .85s ease forwards}
@keyframes fundir{0%{opacity:0}22%{opacity:.92}100%{opacity:0}}
body.fundindo .pulso{animation-duration:.32s!important;animation-delay:0s!important}
body.fundindo .cartao{animation:sumir .55s ease forwards}
@keyframes sumir{to{opacity:0;transform:scale(1.05)}}

@media (max-width:520px){
  .cartao{padding:30px 22px 24px}
  .marca h1{font-size:23px}
  .emenda{width:340px;height:340px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .pulso{opacity:.5;stroke-dashoffset:0;stroke-dasharray:none}
  .emenda{opacity:.7}
}
</style>
</head>
<body>

<!-- 12 fibras ABNT convergindo para o ponto de emenda, 3 seguindo adiante -->
<div class="tecido" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <g id="feixe"></g>
  </svg>
</div>
<div class="emenda" aria-hidden="true"></div>
<div class="clarao" id="clarao" aria-hidden="true"></div>

<main class="cartao">
  <div class="faixa" aria-hidden="true" id="faixa"></div>

  <div class="marca">
    <h1>Movi<em>Fiber</em></h1>
    <span class="selo">FTTH</span>
  </div>
  <p class="sub">Planejamento e documentação da rede óptica da MoviOn.</p>

  <div class="aviso" id="aviso" role="alert" aria-live="polite"><span>⚠</span><div id="aviso-txt"></div></div>

  <form id="form" novalidate>
    <div class="campo" style="--d:.24s">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" placeholder="seu.usuario@movion.com.br" required>
      <div class="luz"></div>
    </div>
    <div class="campo" style="--d:.29s">
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••" required>
      <div class="luz"></div>
    </div>
    <button class="entrar" id="btn" type="submit">Entrar</button>
  </form>

  <div class="rodape">
    CABO 12F · PADRÃO ABNT<br>
    ACESSO LIBERADO PELO ADMINISTRADOR NO <span>MOVIONE</span>
  </div>
</main>

<script>
/* ---- monta o feixe de fibras ---- */
const CORES=['--f1','--f2','--f3','--f4','--f5','--f6','--f7','--f8','--f9','--f10','--f11','--f12'];
const feixe=document.getElementById('feixe');
const FOCO={x:720,y:450};
let svg='';

// 12 fibras entrando pela esquerda e convergindo na emenda
CORES.forEach((c,i)=>{
  const y0=60+i*68;                      // origem espalhada na borda esquerda
  const cx1=300+ (i%3)*70;               // curvatura variada para o feixe respirar
  const cy1=y0;
  const cx2=520;
  const cy2=FOCO.y+(y0-FOCO.y)*0.18;
  const d=`M -60 ${y0} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${FOCO.x-30} ${FOCO.y}`;
  const comp=1500+i*40;                  // comprimento aproximado p/ o pulso
  svg+=`<path class="fibra" d="${d}" stroke="var(${c})"/>`;
  svg+=`<path class="pulso" d="${d}" stroke="var(${c})" style="color:var(${c});
        --comp:${comp}px;--traco:${70+i*4}px;--vao:${comp}px;
        --dur:${(4.4+i*0.42).toFixed(2)}s;--atraso:${(i*0.55).toFixed(2)}s"/>`;
});

// 3 fibras saindo da emenda — a distribuição segue adiante
[[-140,'--f1'],[0,'--f4'],[140,'--f12']].forEach((s,i)=>{
  const d=`M ${FOCO.x+30} ${FOCO.y} C 900 ${FOCO.y}, 1150 ${FOCO.y+s[0]}, 1500 ${FOCO.y+s[0]*1.5}`;
  svg+=`<path class="fibra fibra-saida" d="${d}" stroke="var(${s[1]})"/>`;
  svg+=`<path class="pulso" d="${d}" stroke="var(${s[1]})" style="color:var(${s[1]});opacity:.6;
        --comp:900px;--traco:60px;--vao:900px;--dur:${(3.2+i*0.5).toFixed(2)}s;--atraso:${(1.2+i*0.7).toFixed(2)}s"/>`;
});
feixe.innerHTML=svg;

/* ---- faixa de 12 cores no topo do cartão ---- */
document.getElementById('faixa').innerHTML=
  CORES.map((c,i)=>`<i style="--c:var(${c});--n:${i}"></i>`).join('');

/* ---- interação ---- */
const form=document.getElementById('form');
const btn=document.getElementById('btn');
const aviso=document.getElementById('aviso');
const avisoTxt=document.getElementById('aviso-txt');

function mostrarAviso(html){
  avisoTxt.innerHTML=html;
  aviso.classList.remove('ver');
  void aviso.offsetWidth;          // reinicia a animação
  aviso.classList.add('ver');
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim().toLowerCase();
  const senha=document.getElementById('senha').value;

  if(!email||!senha){ mostrarAviso('Informe e-mail e senha para continuar.'); return }

  aviso.classList.remove('ver');
  btn.disabled=true; btn.textContent='Verificando acesso…';

  // Demonstração. Na integração, aqui entra a autenticação do MoviOne.
  await new Promise(r=>setTimeout(r,900));

  if(senha.length<6){
    btn.disabled=false; btn.textContent='Entrar';
    mostrarAviso('E-mail ou senha incorretos. Verifique e tente novamente.');
    return;
  }
  if(email.includes('bloqueado')){
    btn.disabled=false; btn.textContent='Entrar';
    mostrarAviso('Este usuário <b>não tem acesso liberado</b> ao MoviFiber. Peça a um administrador para liberar no cadastro de usuários do MoviOne.');
    return;
  }

  // sucesso: os pulsos aceleram e a emenda "funde"
  btn.textContent='Conectado';
  document.body.classList.add('fundindo');
  document.getElementById('clarao').classList.add('fundir');
  setTimeout(()=>{
    document.body.classList.remove('fundindo');
    document.getElementById('clarao').classList.remove('fundir');
    btn.disabled=false; btn.textContent='Entrar';
    form.reset();
  },1400);
});
</script>
</body>
</html>
