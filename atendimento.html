<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00a859">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MoviTalk">
<title>MoviTalk · MoviOn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00a859;
  --green-dark:#008f4c;
  --green-deep:#007a41;
  --green-soft:#e6f7ef;
  --blue:#3b82f6;
  --blue-soft:#e8f1fe;
  --orange:#f59e0b;
  --orange-soft:#fef3e2;
  --purple:#8b5cf6;
  --purple-soft:#f1ebfe;
  --red:#ef4444;
  --red-soft:#feecec;
  --bg:#f2f5f8;
  --card:#ffffff;
  --line:#e6eaef;
  --text:#1e293b;
  --text-mid:#64748b;
  --text-low:#94a3b8;
  --radius:14px;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 12px 32px rgba(16,24,40,.14);
  font-family:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;font-size:14px;}

.app{display:grid;grid-template-columns:196px 1fr;height:100vh;}

/* ============ SIDEBAR ============ */
.sidebar{
  background:linear-gradient(180deg,var(--green) 0%,var(--green-dark) 100%);
  color:#fff;display:flex;flex-direction:column;padding:22px 12px 14px;
}
.logo{padding:0 10px 26px;}
.logo .word{font-size:24px;font-weight:800;letter-spacing:-.5px;}
.logo .word .o-dot{position:relative;}
.logo .word .o-dot::after{
  content:'';position:absolute;top:-1px;right:-2px;width:8px;height:8px;
  background:#ffb020;border-radius:50%;
}
.logo .sub{font-size:9px;font-weight:600;letter-spacing:.14em;opacity:.85;margin-top:3px;}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;
  font-size:13.5px;font-weight:600;color:rgba(255,255,255,.88);cursor:pointer;
  transition:background .15s;
}
.nav-item:hover{background:rgba(255,255,255,.12);}
.nav-item.active{background:rgba(255,255,255,.22);color:#fff;}
.nav-item svg{width:17px;height:17px;flex-shrink:0;}
.user-foot{
  display:flex;align-items:center;gap:10px;padding:12px 10px 4px;
  border-top:1px solid rgba(255,255,255,.18);
}
.user-foot .uav{
  width:34px;height:34px;border-radius:50%;background:#fff;color:var(--green-dark);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;
}
.user-foot .un{font-size:13px;font-weight:700;line-height:1.2;}
.user-foot .ur{font-size:10.5px;opacity:.8;}

/* ============ MAIN ============ */
.main{display:flex;flex-direction:column;overflow:hidden;}

.header{
  background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:16px 26px;flex-shrink:0;
}
.h-title{display:flex;align-items:center;gap:13px;}
.wa-badge{
  width:44px;height:44px;border-radius:13px;background:var(--green);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 4px 10px rgba(0,168,89,.3);
}
.wa-badge svg{width:24px;height:24px;fill:#fff;}
.h-title h1{font-size:20px;font-weight:800;letter-spacing:-.3px;}
.h-title p{font-size:12.5px;color:var(--text-mid);margin-top:1px;}
.h-spacer{flex:1;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:9px 13px;width:230px;
}
.search-box svg{width:15px;height:15px;stroke:var(--text-low);flex-shrink:0;}
.search-box input{border:none;outline:none;font-family:inherit;font-size:13px;width:100%;color:var(--text);background:transparent;}
.btn{
  display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:13.5px;font-weight:700;
  padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.btn:hover{border-color:#cbd5e1;}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 10px rgba(0,168,89,.28);}
.btn.primary:hover{background:var(--green-dark);}
.btn svg{width:15px;height:15px;}
.btn .badge-n{background:var(--green);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 6px;}

.content{flex:1;overflow:auto;padding:20px 26px;}

/* ============ KPIs ============ */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px;}
.kpi{
  display:flex;align-items:center;gap:13px;padding:16px;border-radius:var(--radius);
}
.kpi.g{background:var(--green-soft);}
.kpi.b{background:var(--blue-soft);}
.kpi.o{background:var(--orange-soft);}
.kpi.p{background:var(--purple-soft);}
.kpi-ico{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.kpi.g .kpi-ico{background:var(--green);}
.kpi.b .kpi-ico{background:var(--blue);}
.kpi.o .kpi-ico{background:var(--orange);}
.kpi.p .kpi-ico{background:var(--purple);}
.kpi-ico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;}
.kpi-num{font-size:24px;font-weight:800;line-height:1;}
.kpi-lbl{font-size:12px;color:var(--text-mid);font-weight:600;margin-top:3px;}
.kpi.p .kpi-lbl{color:var(--purple);}

/* ============ FILTER BAR ============ */
.filterbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.fchip{
  font-size:12px;font-weight:600;color:var(--text-mid);background:var(--card);
  border:1px solid var(--line);padding:7px 13px;border-radius:18px;cursor:pointer;transition:all .12s;
}
.fchip:hover{border-color:var(--green);}
.fchip.on{background:var(--green-soft);color:var(--green-deep);border-color:var(--green);}
.fchip.risk.on{background:var(--red-soft);color:var(--red);border-color:var(--red);}
.flabel{font-size:11px;font-weight:700;color:var(--text-low);text-transform:uppercase;letter-spacing:.05em;margin-right:2px;}

/* ============ BOARD ============ */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:16px;align-items:start;}
.column{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  border-top:4px solid transparent;display:flex;flex-direction:column;max-height:calc(100vh - 320px);
}
.column[data-col="novos"]{border-top-color:var(--green);}
.column[data-col="atendimento"]{border-top-color:var(--blue);}
.column[data-col="aguardando"]{border-top-color:var(--orange);}
.column[data-col="resolvidos"]{border-top-color:var(--green);}
.col-head{display:flex;align-items:center;gap:9px;padding:15px 16px 11px;}
.col-head h2{font-size:14.5px;font-weight:800;flex:1;}
.col-count{font-size:11px;font-weight:800;color:#fff;border-radius:10px;padding:2px 8px;}
.column[data-col="novos"] .col-count{background:var(--green);}
.column[data-col="atendimento"] .col-count{background:var(--blue);}
.column[data-col="aguardando"] .col-count{background:var(--orange);}
.column[data-col="resolvidos"] .col-count{background:var(--green);}
.col-menu{color:var(--text-low);cursor:pointer;font-weight:800;letter-spacing:1px;}
.col-body{flex:1;overflow-y:auto;padding:2px 12px 8px;display:flex;flex-direction:column;gap:10px;min-height:60px;}
.col-body.dragover{background:var(--green-soft);border-radius:10px;}
.col-foot{padding:10px;text-align:center;font-size:12.5px;font-weight:700;color:var(--green);cursor:pointer;}

/* ============ CARD ============ */
.card-c{
  background:#fbfcfd;border:1px solid var(--line);border-radius:12px;padding:13px 13px 11px;
  cursor:grab;transition:box-shadow .15s,transform .15s;
}
.card-c:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.card-c.dragging{opacity:.45;}
.cc-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.cc-av{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:12px;flex-shrink:0;
}
.cc-name{font-size:13.5px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cc-time{font-size:11px;color:var(--text-low);font-weight:600;flex-shrink:0;}
.cc-msg{font-size:12.5px;color:var(--text-mid);line-height:1.45;margin-bottom:9px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;}
.cc-tag{font-size:10px;font-weight:700;padding:2.5px 8px;border-radius:6px;background:#eef2f6;color:var(--text-mid);}
.cc-tag.risk{background:var(--red-soft);color:var(--red);}
.cc-tag.warn{background:var(--orange-soft);color:#b45309;}
.cc-foot{display:flex;align-items:center;gap:7px;}
.cc-wa{width:17px;height:17px;fill:var(--green);flex-shrink:0;}
.cc-att{font-size:10.5px;color:var(--text-low);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cc-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:7px;}
.cc-status.novo{background:var(--green-soft);color:var(--green-deep);}
.cc-status.atend{background:var(--blue-soft);color:#1d4ed8;}
.cc-status.aguard{background:var(--orange-soft);color:#b45309;}
.cc-status.resolv{background:var(--green-soft);color:var(--green-deep);}
.cc-check{width:19px;height:19px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cc-check svg{width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none;}
.cc-unread{
  min-width:19px;height:19px;border-radius:10px;background:var(--green);color:#fff;
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0;
}

/* ============ MODAL (conversa + 360) ============ */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;
  align-items:center;justify-content:center;z-index:50;padding:24px;
}
.overlay.open{display:flex;}
.modal{
  background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);
  width:min(1060px,100%);height:min(680px,100%);display:grid;
  grid-template-columns:1fr 330px;overflow:hidden;
}
.m-chat{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0;}
.m-head{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line);}
.m-head .cc-av{width:40px;height:40px;font-size:13px;}
.m-hinfo{flex:1;min-width:0;}
.m-hname{font-size:15px;font-weight:800;}
.m-hsub{font-size:11.5px;color:var(--text-mid);margin-top:1px;}
.m-close{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--text-mid);
}
.m-thread{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px;background:#f7f9fb;}
.mb{max-width:70%;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.5;box-shadow:var(--shadow);}
.mb.in{align-self:flex-start;background:#fff;border-bottom-left-radius:3px;}
.mb.out{align-self:flex-end;background:#d8f6e6;border-bottom-right-radius:3px;}
.mb.bot{align-self:flex-end;background:#fff;border:1.5px dashed var(--green);border-bottom-right-radius:3px;}
.mb .bt{display:block;font-size:9.5px;font-weight:800;color:var(--green-deep);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.mb .tm{display:block;font-size:9.5px;color:var(--text-low);text-align:right;margin-top:4px;}
.m-sys{align-self:center;font-size:10.5px;font-weight:600;color:var(--text-mid);background:#eef2f6;padding:4px 12px;border-radius:12px;}
.m-quick{display:flex;gap:7px;padding:10px 16px 0;flex-wrap:wrap;}
.mq{
  font-size:11px;font-weight:700;color:var(--green-deep);background:var(--green-soft);
  border:1px solid #bfe9d4;padding:5px 11px;border-radius:14px;cursor:pointer;
}
.mq:hover{background:#d3f2e2;}
.m-composer{display:flex;gap:9px;padding:12px 16px 16px;align-items:center;}
.m-composer input{
  flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 14px;
  font-family:inherit;font-size:13px;outline:none;
}
.m-composer input:focus{border-color:var(--green);}
.m-send{
  width:42px;height:42px;border-radius:11px;background:var(--green);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.m-send svg{width:17px;height:17px;fill:#fff;}

.m-side{overflow-y:auto;padding:18px 16px;background:var(--card);}
.ms-sec{margin-bottom:18px;}
.ms-sec h3{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text-low);margin-bottom:9px;}
.pills{display:flex;gap:7px;}
.pill{flex:1;text-align:center;border-radius:10px;padding:8px 4px;}
.pill .pl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.pill .pv{font-size:12.5px;font-weight:800;margin-top:2px;}
.pill.ok{background:var(--green-soft);color:var(--green-deep);}
.pill.warn{background:var(--orange-soft);color:#b45309;}
.pill.bad{background:var(--red-soft);color:var(--red);}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.icell{background:#f7f9fb;border:1px solid var(--line);border-radius:9px;padding:8px 10px;}
.icell .il{font-size:9.5px;font-weight:700;color:var(--text-low);text-transform:uppercase;}
.icell .iv{font-size:12.5px;font-weight:800;margin-top:2px;}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.act{
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;font-weight:700;
  padding:9px 6px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;
  color:var(--text);transition:all .12s;
}
.act:hover{border-color:var(--green);color:var(--green-deep);}
.act.hi{background:var(--green);border-color:var(--green);color:#fff;}
.act.hi:hover{background:var(--green-dark);}
.sup-line{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;}
.sup-line .st{font-size:11.5px;font-weight:600;}
.sup-line .sd{font-size:10px;color:var(--text-low);margin-top:1px;}
.sup-line .ss{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:5px;}
.sup-line .ss.ab{background:var(--orange-soft);color:#b45309;}
.sup-line .ss.rs{background:var(--green-soft);color:var(--green-deep);}
.sup-sum{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
.sup-sum .n{font-size:24px;font-weight:800;color:var(--orange);}
.sup-sum .l{font-size:12px;color:var(--text-mid);font-weight:600;}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;}
.tagrow .cc-tag{cursor:pointer;padding:4px 10px;font-size:10.5px;}
.tagrow .cc-tag.add{border:1.5px dashed #cbd5e1;background:transparent;color:var(--text-low);}
textarea.notas{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  font-family:inherit;font-size:12px;resize:vertical;min-height:64px;outline:none;color:var(--text);
}
textarea.notas:focus{border-color:var(--green);}
select.transf{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  font-family:inherit;font-size:12.5px;font-weight:600;outline:none;background:var(--card);color:var(--text);
}
.ia-note{
  font-size:11px;line-height:1.55;color:var(--text-mid);background:#f7f9fb;
  border:1.5px dashed #cbd5e1;border-radius:9px;padding:9px 11px;
}
.ia-note b{color:var(--green-deep);}

/* ============ AUX VIEWS ============ */
.viewbox{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;max-width:760px;}
.viewbox h2{font-size:17px;font-weight:800;margin-bottom:4px;}
.viewbox .vsub{font-size:12.5px;color:var(--text-mid);margin-bottom:18px;}
.rule-line{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
.rule-kw{font-size:12px;font-weight:800;background:var(--green-soft);color:var(--green-deep);padding:4px 10px;border-radius:7px;}
.rule-arrow{color:var(--text-low);}
.rule-desc{font-size:12.5px;color:var(--text-mid);flex:1;}
.rule-del{color:var(--red);cursor:pointer;font-weight:800;font-size:13px;}
.add-row{display:flex;gap:8px;margin-top:12px;}
.add-row input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:12.5px;outline:none;}
.add-row input:focus{border-color:var(--green);}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1e293b;color:#fff;font-size:13px;font-weight:600;padding:11px 20px;border-radius:11px;
  transition:transform .25s;z-index:99;box-shadow:var(--shadow-lg);
}
.toast.show{transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#d3dae2;border-radius:4px;}

/* ============ SETOR ============ */
.sector-switch{padding:0 10px 14px;}
.sector-lbl{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:6px;padding:0 2px;}
.sector-sel{
  width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:9px;
  color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 9px;outline:none;cursor:pointer;
}
.sector-sel option{color:#1e293b;}
.sec-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;}
.sec-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;padding:2.5px 8px 2.5px 6px;border-radius:6px;}

/* ============ AGENDAMENTO ============ */
.sched-item{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 10px;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;}
.sched-item .sc-txt{font-size:11.5px;color:var(--text);line-height:1.4;}
.sched-item .sc-time{font-size:10px;color:var(--green-deep);font-weight:700;margin-top:3px;}
.sched-item .sc-cancel{color:var(--red);cursor:pointer;font-weight:800;font-size:12px;flex-shrink:0;}
.sched-empty{font-size:11.5px;color:var(--text-low);}
.rename-ico{cursor:pointer;color:var(--text-low);margin-left:6px;font-size:12px;}
.rename-ico:hover{color:var(--green-deep);}

/* ============ TIMELINE ============ */
.tl{display:flex;flex-direction:column;gap:9px;}
.tl-row{display:flex;gap:9px;font-size:11.5px;}
.tl-d{width:6px;height:6px;border-radius:50%;background:var(--text-low);margin-top:5px;flex-shrink:0;}
.tl-row.on .tl-d{background:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
.tl-row .tl-t{color:var(--text-mid);}
.tl-row .tl-h{display:block;font-size:9.5px;color:var(--text-low);font-weight:600;}

/* ============ CHAT INTERNO ============ */
.ci-wrap{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 230px);overflow:hidden;
}
.ci-list{border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px;}
.ci-sec-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-low);padding:8px 8px 6px;}
.ci-item{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:12.5px;font-weight:600;
  color:var(--text-mid);cursor:pointer;
}
.ci-item:hover{background:#f2f5f8;}
.ci-item.on{background:var(--green-soft);color:var(--green-deep);}
.ci-item .ci-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ci-item .ci-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;}
.ci-main{display:flex;flex-direction:column;min-width:0;}
.ci-head{padding:14px 18px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:9px;}
.ci-thread{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#f7f9fb;}
.ci-msg{max-width:62%;}
.ci-msg.me{align-self:flex-end;}
.ci-msg .ci-who{font-size:10px;font-weight:800;color:var(--text-low);margin-bottom:2px;}
.ci-msg.me .ci-who{text-align:right;}
.ci-bubble{padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.5;background:#fff;box-shadow:var(--shadow);border-bottom-left-radius:3px;}
.ci-msg.me .ci-bubble{background:var(--green-soft);color:var(--green-deep);border-bottom-left-radius:12px;border-bottom-right-radius:3px;}
.ci-time{display:block;font-size:9.5px;color:var(--text-low);margin-top:4px;}
.ci-msg.me .ci-time{text-align:right;}
.ci-composer{display:flex;gap:9px;padding:12px 16px 16px;}
.ci-composer input{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-family:inherit;font-size:13px;outline:none;}
.ci-composer input:focus{border-color:var(--green);}

/* ============ FLUXO DO BOT (canvas) ============ */
.flow-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;height:calc(100vh - 200px);overflow:hidden;}
.flow-toolbar{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.flow-toolbar .ftlabel{font-size:11px;font-weight:700;color:var(--text-low);margin-right:2px;}
.fbtn{
  font-family:inherit;font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.fbtn:hover{border-color:var(--green);color:var(--green-deep);}
.fbtn.warn{background:var(--blue-soft);color:#1d4ed8;border-color:#bcd4fb;}
.flow-body{flex:1;display:flex;overflow:hidden;}
.flow-canvas-outer{flex:1;overflow:auto;position:relative;background-color:#f7f9fb;
  background-image:radial-gradient(#dde4ec 1.4px, transparent 1.4px);background-size:22px 22px;}
.flow-canvas{position:relative;width:2520px;height:1560px;}
.flow-canvas svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}
.flow-node{
  position:absolute;width:196px;background:#fff;border:2px solid var(--line);border-radius:12px;
  padding:10px 11px;box-shadow:var(--shadow);cursor:grab;user-select:none;
}
.flow-node:active{cursor:grabbing;}
.flow-node.selected{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
.flow-node.connecting{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
.fn-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.fn-type{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:5px;}
.fn-type.inicio{background:var(--green-soft);color:var(--green-deep);}
.fn-type.menu{background:var(--blue-soft);color:#1d4ed8;}
.fn-type.mensagem{background:#eef2f6;color:var(--text-mid);}
.fn-type.condicao{background:#fef3c7;color:#b45309;}
.fn-type.acao{background:#ccfbf1;color:#0f766e;}
.flow-node.acao-node{border-color:#99f6e4;}
.fn-conn-desc{font-size:9.5px;color:#0f766e;background:#f0fdfa;border-radius:6px;padding:5px 7px;margin-top:6px;line-height:1.4;}
.fzoom{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.fzoom button{border:none;background:var(--card);font-family:inherit;font-size:13px;font-weight:800;width:28px;height:28px;cursor:pointer;color:var(--text-mid);}
.fzoom button:hover{background:#f2f5f8;}
.fzoom .fz-val{font-size:10.5px;font-weight:700;color:var(--text-low);width:40px;text-align:center;}
.conn-pick{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.conn-opt{display:flex;gap:8px;align-items:flex-start;padding:8px 9px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;}
.conn-opt:hover{border-color:#99f6e4;background:#f0fdfa;}
.conn-opt.on{border-color:#14b8a6;background:#f0fdfa;}
.conn-opt .co-ico{font-size:15px;line-height:1;}
.conn-opt .co-lbl{font-size:11.5px;font-weight:700;color:var(--text);}
.conn-opt .co-desc{font-size:9.5px;color:var(--text-low);line-height:1.35;margin-top:2px;}
.fn-type.fim{background:#fee2e2;color:#b91c1c;}
.fn-type.setor{color:#fff;}
.fn-type.ia{background:var(--purple-soft);color:#6d28d9;}
.fn-actions{display:flex;gap:5px;}
.fn-ico{width:19px;height:19px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;color:var(--text-low);}
.fn-ico:hover{background:#eef2f6;color:var(--text);}
.fn-title{font-size:12.5px;font-weight:700;line-height:1.3;}
.fn-text{font-size:10.5px;color:var(--text-mid);margin-top:4px;line-height:1.4;white-space:pre-line;max-height:70px;overflow:hidden;}
.flow-node.ia-node{border-style:dashed;border-color:#c4b5fd;}
.flow-side{width:290px;border-left:1px solid var(--line);padding:16px;overflow-y:auto;flex-shrink:0;}
.flow-side h3{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-low);margin-bottom:9px;}
.flow-empty{font-size:12px;color:var(--text-low);line-height:1.6;}
.flow-field{margin-bottom:12px;}
.flow-field label{display:block;font-size:10.5px;font-weight:700;color:var(--text-mid);margin-bottom:5px;}
.flow-field input,.flow-field select,.flow-field textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font-family:inherit;font-size:12.5px;outline:none;color:var(--text);
}
.flow-field textarea{min-height:80px;resize:vertical;}
.flow-field input:focus,.flow-field select:focus,.flow-field textarea:focus{border-color:var(--green);}
.flow-hint{font-size:10.5px;color:var(--text-low);background:#f7f9fb;border:1px dashed var(--line);border-radius:8px;padding:9px 10px;line-height:1.5;margin-top:14px;}

/* ============ BARRA DE SELEÇÃO DE BOTS ============ */
.flow-botbar{
  display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.flow-botbar select{
  font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--text);max-width:280px;
}
.bot-badge{font-size:10px;font-weight:800;letter-spacing:.03em;padding:4px 10px;border-radius:99px;background:#f1f5f9;color:var(--text-low);}
.bot-badge.on{background:var(--green-soft);color:var(--green-deep);}
.fbtn.solid{background:var(--green);color:#fff;border-color:var(--green);}
.fbtn.solid:hover{background:var(--green-deep);color:#fff;}
.fbtn.danger{color:var(--red);border-color:#fecaca;}
.fbtn.danger:hover{background:#fee2e2;color:var(--red);}
.fbtn:disabled{opacity:.45;cursor:not-allowed;}
.fbtn:disabled:hover{background:var(--card);color:var(--text);}

/* ============ VÍNCULO CLIENTE ↔ NÚMERO ============ */
.vinc-box{border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center;}
.vinc-box.vazio{border-style:dashed;}
.vinc-none{font-size:12px;color:var(--text-low);margin-bottom:10px;}
.vinc-nome{font-size:13.5px;font-weight:800;color:var(--text);line-height:1.35;}
.vinc-sub{font-size:11px;color:var(--text-low);margin-top:3px;}
.vinc-acts{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.vinc-btn{
  font-family:inherit;font-size:11px;font-weight:700;padding:7px 12px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--text);
}
.vinc-btn:hover{border-color:var(--green);color:var(--green-deep);}
.vinc-btn.solid{background:var(--green);color:#fff;border-color:var(--green);}
.vinc-btn.solid:hover{background:var(--green-deep);color:#fff;}
.vinc-btn.desf{color:var(--red);border-color:#fecaca;}
.vinc-btn.desf:hover{background:#fee2e2;color:var(--red);}
.vinc-sug{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px;margin-top:9px;text-align:left;}
.vinc-sug .vs-t{font-size:10px;font-weight:800;color:#92400e;letter-spacing:.03em;margin-bottom:4px;}
.vinc-sug .vs-n{font-size:12.5px;font-weight:700;color:var(--text);}

/* modal de busca de cliente */
.cli-overlay{
  position:fixed;inset:0;z-index:420;background:rgba(15,23,42,.5);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.cli-modal{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  width:100%;max-width:620px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;
}
.cli-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.cli-head h3{font-size:15px;font-weight:800;flex:1;}
.cli-busca{display:flex;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);}
.cli-busca input{
  flex:1;border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;
  font-family:inherit;font-size:13.5px;outline:none;
}
.cli-busca input:focus{border-color:var(--green);}
.cli-lista{flex:1;overflow-y:auto;padding:8px 10px 14px;}
.cli-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;
  border:1px solid transparent;
}
.cli-item:hover{background:#f2f5f8;border-color:var(--line);}
.cli-item .ci-info{flex:1;min-width:0;}
.cli-item .ci-nome{font-size:13px;font-weight:700;color:var(--text);}
.cli-item .ci-end{font-size:11px;color:var(--text-low);margin-top:2px;}
.cli-item .ci-tag{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:6px;background:#eef2f6;color:var(--text-low);flex-shrink:0;}
.cli-item .ci-tag.on{background:var(--green-soft);color:var(--green-deep);}
.cli-vazio{text-align:center;padding:34px 16px;font-size:12.5px;color:var(--text-low);}

/* ============ INTEGRAÇÕES (WhatsApp) ============ */
.wa-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;max-width:480px;margin:0 auto;text-align:center;}
.wa-status-row{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:99px;margin-bottom:20px;}
.wa-status-row.on{background:var(--green-soft);color:var(--green-deep);}
.wa-status-row.off{background:#fee2e2;color:#b91c1c;}
.wa-status-row.mid{background:#fef3c7;color:#92400e;}
.wa-status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.wa-status-row.on .wa-status-dot{animation:lgBadgePulse 2.2s ease-out infinite;}
.wa-qr-box{width:240px;height:240px;margin:0 auto 18px;border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafcfb;}
.wa-qr-box img{width:100%;height:100%;object-fit:contain;}
.wa-qr-box .wa-load{font-size:11.5px;color:var(--text-low);}
.wa-qr-timer{font-size:10.5px;color:var(--text-low);font-weight:600;}
.wa-num{font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px;}
.wa-sub{font-size:11.5px;color:var(--text-low);margin-bottom:18px;}
.wa-actions{display:flex;gap:9px;justify-content:center;}

/* ============ ABAS DE CONFIGURAÇÕES ============ */
.cfg-tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:0;}
.cfg-tab{
  font-size:12.5px;font-weight:700;color:var(--text-low);padding:9px 4px 11px;cursor:pointer;
  border-bottom:2.5px solid transparent;margin-bottom:-1px;
}
.cfg-tab.on{color:var(--green-deep);border-bottom-color:var(--green);}
.cfg-tab:hover:not(.on){color:var(--text);}

/* ============ CONTROLE DO BOT + ANEXOS ============ */
.bot-bar{
  display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--line);
  background:#fffbeb;font-size:11.5px;color:#92400e;flex-wrap:wrap;
}
.bot-bar.humano{background:var(--green-soft);color:var(--green-deep);}
.bot-bar .bb-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
.bot-bar .bb-txt{font-weight:700;}
.bot-bar .bb-acts{margin-left:auto;display:flex;gap:6px;}
.bb-btn{
  font-family:inherit;font-size:11px;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer;
  border:1px solid currentColor;background:transparent;color:inherit;
}
.bb-btn:hover{background:rgba(0,0,0,.05);}
.bb-btn.solid{background:var(--green);color:#fff;border-color:var(--green);}
.bb-btn.solid:hover{background:var(--green-deep);}
.bb-btn.fim{background:#fff;color:var(--red);border-color:#fecaca;}
.bb-btn.fim:hover{background:#fee2e2;}
.mb-midia{margin-top:6px;}
.mb-midia img{max-width:100%;border-radius:9px;display:block;cursor:zoom-in;}
.mb-doc{
  display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;
  background:rgba(0,0,0,.05);text-decoration:none;color:inherit;font-size:12px;font-weight:600;
}
.mb-doc:hover{background:rgba(0,0,0,.09);}
.mb-doc .md-ico{font-size:17px;}
.mb-audio{width:230px;max-width:100%;margin-top:4px;}
.midia-lightbox{
  position:fixed;inset:0;z-index:400;background:rgba(8,20,14,.88);display:flex;
  align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
}
.midia-lightbox img{max-width:100%;max-height:100%;border-radius:12px;}

/* ============ LOGIN — "rede de conversas" ============ */
#tela-login{
  --lg-bg0:#f2faf6; --lg-bg1:#e3f4ea;
  --lg-pulse:#00a859; --lg-brand:#00a859;
  --lg-ink:#0c2b1c; --lg-ink-dim:#4a6b5b;
  --lg-card-bg:rgba(255,255,255,.86); --lg-card-line:rgba(0,168,89,.22);
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-family:'Inter',sans-serif;
  background:
    radial-gradient(60% 55% at 62% 38%,rgba(0,168,89,.14),transparent 60%),
    radial-gradient(70% 60% at 20% 85%,rgba(0,168,89,.10),transparent 60%),
    linear-gradient(160deg,var(--lg-bg0) 0%,var(--lg-bg1) 55%,#d8f0e2 100%);
}
.lg-stage{position:absolute;inset:0;z-index:0;}
.lg-fiber{position:absolute;inset:0;width:100%;height:100%;}
.lg-fiber .ls{fill:none;stroke:url(#lgGradLine);stroke-width:1.3;stroke-linecap:round;
  stroke-dasharray:100;stroke-dashoffset:100;animation:lgDraw 1.6s cubic-bezier(.16,.8,.24,1) forwards;}
.lg-fiber .ls:nth-child(2){animation-delay:.08s;}
.lg-fiber .ls:nth-child(3){animation-delay:.16s;}
.lg-fiber .ls:nth-child(4){animation-delay:.05s;}
.lg-fiber .ls:nth-child(5){animation-delay:.22s;}
.lg-fiber .ls:nth-child(6){animation-delay:.12s;}
.lg-node{fill:var(--lg-pulse);opacity:0;filter:drop-shadow(0 0 6px var(--lg-pulse));animation:lgNode .6s ease-out 1.4s forwards;}
@keyframes lgDraw{to{stroke-dashoffset:0;}}
@keyframes lgNode{to{opacity:.9;}}
.lg-orbs{position:absolute;inset:0;}
.lg-chanicos{position:absolute;inset:0;}
.lg-cico{position:absolute;color:var(--lg-ink-dim);animation:lgIconFloat ease-in-out infinite;}
.lg-cico svg{width:100%;height:100%;display:block;}
@keyframes lgIconFloat{
  0%,100%{transform:translateY(0) rotate(-4deg);opacity:.12;}
  50%{transform:translateY(-15px) rotate(4deg);opacity:.22;}
}
.lg-orbs span{
  position:absolute;width:9px;height:7px;border-radius:6px 6px 6px 2px;background:var(--lg-pulse);opacity:0;
  box-shadow:0 0 7px 1px rgba(0,168,89,.35);animation:lgFloat 9s ease-in-out infinite;
}
.lg-orbs span:nth-child(1){top:18%;left:12%;animation-delay:.2s;}
.lg-orbs span:nth-child(2){top:70%;left:8%;animation-delay:2.1s;}
.lg-orbs span:nth-child(3){top:26%;left:88%;animation-delay:1.1s;}
.lg-orbs span:nth-child(4){top:78%;left:82%;animation-delay:3.4s;}
.lg-orbs span:nth-child(5){top:50%;left:6%;animation-delay:4.6s;}
.lg-orbs span:nth-child(6){top:12%;left:55%;animation-delay:2.8s;}
@keyframes lgFloat{
  0%{opacity:0;transform:translateY(0) scale(.6);}
  15%{opacity:.55;} 50%{opacity:.85;transform:translateY(-22px) scale(1);} 85%{opacity:.3;}
  100%{opacity:0;transform:translateY(-46px) scale(.6);}
}
.lg-typing{display:inline-flex;align-items:center;gap:3px;margin-left:7px;}
.lg-typing span{width:3.5px;height:3.5px;border-radius:50%;background:var(--lg-ink-dim);animation:lgTyping 1.3s ease-in-out infinite;}
.lg-typing span:nth-child(2){animation-delay:.15s;} .lg-typing span:nth-child(3){animation-delay:.3s;}
@keyframes lgTyping{0%,60%,100%{opacity:.3;transform:translateY(0);} 30%{opacity:1;transform:translateY(-2px);}}
.lg-card{
  position:relative;z-index:2;width:378px;
  background:var(--lg-card-bg);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--lg-card-line);border-radius:20px;padding:30px 28px 26px;
  box-shadow:0 24px 55px rgba(10,60,35,.14),0 2px 8px rgba(10,60,35,.06);
  opacity:0;filter:blur(6px);transform:translateY(16px);
  animation:lgCardIn .75s cubic-bezier(.16,.8,.24,1) .28s forwards;
}
@keyframes lgCardIn{to{opacity:1;filter:blur(0);transform:translateY(0);}}
.lg-badge{
  display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;
  font-size:9.5px;font-weight:500;letter-spacing:.05em;color:#0a7d45;
  background:rgba(0,168,89,.08);border:1px solid rgba(0,168,89,.22);
  padding:4px 10px 4px 8px;border-radius:99px;margin-bottom:18px;
}
.lg-dot{width:6px;height:6px;border-radius:50%;background:var(--lg-pulse);animation:lgBadgePulse 2.2s ease-out infinite;}
@keyframes lgBadgePulse{
  0%{box-shadow:0 0 0 0 rgba(0,168,89,.45);} 70%{box-shadow:0 0 0 6px rgba(0,168,89,0);}
  100%{box-shadow:0 0 0 0 rgba(0,168,89,0);}
}
.lg-logo{display:flex;align-items:center;gap:11px;margin-bottom:24px;}
.lg-logo-ico{
  width:38px;height:38px;flex-shrink:0;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--lg-brand),#00d97a);color:#04120d;box-shadow:0 6px 18px rgba(0,168,89,.35);
}
.lg-logo-ico svg{width:19px;height:19px;}
.lg-logo .word{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.3px;color:var(--lg-ink);line-height:1;}
.lg-accent{color:var(--lg-pulse);}
.lg-logo .sub{font-size:10.5px;color:var(--lg-ink-dim);margin-top:3px;}
#lg-erro{
  display:none;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.28);color:#b91c1c;
  border-radius:11px;padding:10px 12px;font-size:11.5px;line-height:1.55;margin-bottom:15px;
}
#lg-erro.show{display:block;}
.lg-f{margin-bottom:14px;}
.lg-f label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.03em;color:var(--lg-ink-dim);margin-bottom:6px;}
.lg-input-wrap{
  position:relative;display:flex;align-items:center;
  border:1.5px solid rgba(10,60,35,.13);border-radius:11px;background:rgba(10,60,35,.03);
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.lg-input-wrap:focus-within{border-color:var(--lg-pulse);background:rgba(0,168,89,.05);box-shadow:0 0 0 3px rgba(0,168,89,.12);}

.lg-input-wrap:focus-within .lg-ico{color:var(--lg-pulse);}
.lg-f input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--lg-ink);font-family:inherit;font-size:13.5px;padding:11px 13px 11px 9px;}

#lg-btn{

  font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:8px;
  box-shadow:0 10px 24px rgba(0,168,89,.28);transition:background-position .5s ease,transform .15s ease,box-shadow .2s ease;
}
#lg-btn svg{width:15px;height:15px;transition:transform .2s ease;}
#lg-btn:hover{background-position:100% 0%;transform:translateY(-1px);box-shadow:0 14px 30px rgba(0,168,89,.38);}
#lg-btn:hover svg{transform:translateX(3px);}
#lg-btn:active{transform:translateY(0);}
#lg-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.lg-foot{text-align:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.03em;color:rgba(74,107,91,.75);margin-top:20px;display:flex;align-items:center;justify-content:center;}
@media (prefers-reduced-motion: reduce){

.usr-chip .sair{

#carregando{

}
#carregando.show{display:flex;}

/* ============================================================
   MOBILE — celular em pé (até 860px)
   ============================================================ */
.only-mobile{display:none;}
.drawer-back{display:none;}

@media (max-width:860px){
  body{font-size:15px;}
  .only-mobile{display:inline-flex;}
  .no-mobile{display:none !important;}

  /* --- layout base vira coluna única --- */
  .app{grid-template-columns:1fr;height:100dvh;}

  /* --- sidebar vira gaveta --- */
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:264px;z-index:120;
    transform:translateX(-100%);transition:transform .22s ease;
    overflow-y:auto;padding-bottom:20px;
  }
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.4);}
  .drawer-back{
    display:block;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:110;
    opacity:0;pointer-events:none;transition:opacity .22s;
  }
  .drawer-back.open{opacity:1;pointer-events:auto;}
  .nav-item{padding:13px 12px;font-size:14.5px;}

  /* --- header compacto --- */
  .header{padding:11px 14px;gap:9px;flex-wrap:wrap;}
  .h-title{gap:10px;}
  .wa-badge{width:36px;height:36px;border-radius:11px;}
  .wa-badge svg{width:19px;height:19px;}
  .h-title h1{font-size:17px;}
  .h-title p{display:none;}
  .search-box{order:5;width:100%;flex:1 0 100%;padding:10px 13px;}
  .btn{padding:10px 13px;font-size:13px;}
  #btnNovo{font-size:0;padding:10px 14px;}
  #btnNovo::before{content:'＋ Novo';font-size:13px;}
  .hamb{
    display:flex;align-items:center;justify-content:center;width:38px;height:38px;
    border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;flex-shrink:0;
  }
  .hamb svg{width:19px;height:19px;stroke:var(--text);}

  .content{padding:14px;}

  /* --- KPIs: rolagem horizontal --- */
  .kpis{
    display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
    margin:0 -14px 16px;padding:0 14px 4px;-webkit-overflow-scrolling:touch;
  }
  .kpis::-webkit-scrollbar{display:none;}
  .kpi{flex:0 0 152px;scroll-snap-align:start;padding:13px;}
  .kpi-ico{width:38px;height:38px;border-radius:10px;}
  .kpi-ico svg{width:19px;height:19px;}
  .kpi-num{font-size:21px;}
  .kpi-lbl{font-size:11px;}

  /* --- Kanban: colunas deslizam na horizontal --- */
  .board{
    display:flex !important;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
    margin:0 -14px;padding:0 14px 8px;-webkit-overflow-scrolling:touch;
  }
  .board::-webkit-scrollbar{display:none;}
  .column{flex:0 0 84vw;scroll-snap-align:center;max-height:none;}
  .col-body{max-height:calc(100dvh - 300px);}
  .card-c{padding:14px;}
  .cc-name{font-size:14.5px;}
  .cc-msg{font-size:13px;}

  /* --- Modal ocupa a tela toda --- */
  .overlay{padding:0;}
  .modal{
    width:100%;height:100dvh;max-height:100dvh;border-radius:0;
    grid-template-columns:1fr;grid-template-rows:auto 1fr;
  }
  .m-chat{border-right:none;}
  .m-chat.oculto{display:none;}
  .m-side{display:none;padding:14px;}
  .m-side.visivel{display:block;}
  .m-quick{gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;}
  .m-quick::-webkit-scrollbar{display:none;}
  .mq{flex-shrink:0;}
  .mb{max-width:84%;font-size:14px;}
  .m-composer input{font-size:16px;}   /* 16px evita o zoom automático do iOS */
  .m-thread{padding:14px;}
  .acts{grid-template-columns:1fr;}
  .m-abas{
    display:flex;gap:6px;padding:9px 14px 0;border-bottom:1px solid var(--line);
  }
  .m-aba{
    flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:9px 4px;
    border-radius:9px 9px 0 0;cursor:pointer;color:var(--text-mid);border-bottom:2.5px solid transparent;
  }
  .m-aba.on{color:var(--green-deep);border-bottom-color:var(--green);background:var(--green-soft);}

  /* --- Chat interno: lista OU thread, nunca os dois --- */
  .ci-wrap{grid-template-columns:1fr;height:calc(100dvh - 190px);}
  .ci-list{border-right:none;border-bottom:1px solid var(--line);}
  .ci-wrap.emThread .ci-list{display:none;}
  .ci-wrap:not(.emThread) .ci-main{display:none;}
  .ci-msg{max-width:82%;}
  .ci-composer input{font-size:16px;}
  .ci-voltar{
    display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
    color:var(--green-deep);background:var(--green-soft);border:none;border-radius:8px;
    padding:6px 11px;cursor:pointer;margin-right:4px;font-family:inherit;
  }

  /* --- Fluxo do bot: canvas continua, painel vira rodapé --- */
  .flow-wrap{height:calc(100dvh - 175px);}
  .flow-body{flex-direction:column;}
  .flow-side{width:auto;border-left:none;border-top:1px solid var(--line);max-height:44%;}
  .flow-toolbar{gap:6px;padding:9px 12px;}
  .fbtn{padding:8px 10px;font-size:11px;}
  .flow-canvas-outer{min-height:210px;}

  /* --- telas auxiliares --- */
  .viewbox{padding:16px;}
  .rule-line{flex-wrap:wrap;gap:7px;}
  .add-row{flex-direction:column;}
  .add-row input{flex:1 1 auto !important;}
  .igrid{grid-template-columns:1fr;}
  .toast{left:14px;right:14px;bottom:14px;transform:translateY(90px);text-align:center;}
  .toast.show{transform:translateY(0);}

  /* --- login --- */
  .lg-card{width:100%;max-width:380px;margin:16px;padding:26px 22px;}
  .lg-f input{font-size:16px;}
}

/* celular pequeno */
@media (max-width:400px){
  .column{flex:0 0 89vw;}
  .h-title h1{font-size:16px;}
}

/* celular deitado: aproveita a largura */
@media (max-width:860px) and (orientation:landscape){
  .column{flex:0 0 46vw;}
  .modal{grid-template-columns:1fr 300px;grid-template-rows:1fr;}
  .m-side{display:block;}
  .m-chat.oculto{display:flex;}
  .m-abas{display:none;}
}

function _sb(){
  if(sbAuth) return sbAuth;

/* chamada única ao proxy */
async function chamar(acao, dados){
  const r = await fetch(API, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+TOKEN },
    body: JSON.stringify({ acao, ...(dados||{}) })
  });
  const j = await r.json().catch(()=>({ok:false,error:'Resposta inválida do servidor.'}));
  if(!j.ok) throw new Error(j.error||('Erro '+r.status));
  return j;
}

/* --- operações que escrevem no servidor --- */
const api = {

function fmtQuando(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toTimeString().slice(0,5);
}

/* O canvas dispara muitas alterações seguidas (arrastar, digitar, conectar).
   Antes isso salvava sozinho a cada 1,2s — agora só MARCA como "não salvo";
   quem grava de fato é o botão 💾 Salvar, do jeito que foi pedido. */
let fluxoSujo=false;
function agendarSalvarFluxo(){
  fluxoSujo=true;
  const ind=$('#flowStatus'); if(ind){ ind.textContent='● alterações não salvas'; ind.style.color='#b45309'; }
  const btn=$('#btnSalvarFluxo'); if(btn) btn.disabled=false;
}

async function salvarFluxoAgora(){
  const btn=$('#btnSalvarFluxo'); const ind=$('#flowStatus');
  if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }
  try{
    await api.salvarFluxo();
    fluxoSujo=false;
    if(ind){ ind.textContent='✓ salvo'; ind.style.color='var(--green-deep)'; }
    if(btn){ btn.textContent='💾 Salvar'; btn.disabled=true; }
    // reflete o novo "salvo em" na lista de bots, se já carregada
    const item=fluxosLista.find(f=>f.id===state.fluxo.id);
    if(item) item.updated_at=new Date().toISOString();
    toast('Bot salvo');
  }catch(err){
    if(ind){ ind.textContent='✕ falha ao salvar'; ind.style.color='var(--red)'; }
    if(btn){ btn.textContent='💾 Salvar'; btn.disabled=false; }
    toast('Falha ao salvar: '+err.message);
  }
}

/* --- mapeamento servidor -> forma que as telas já esperam --- */
let EQUIPE = [], ETIQ_ID = {};
function mapearConversa(c){
  const snap = c.cliente_snapshot || {};
  return {
    id:c.id, nome:c.contato_nome||c.contato_fone, fone:c.contato_fone,
    col:c.coluna, hora: c.ultima_msg_em ? new Date(c.ultima_msg_em).toTimeString().slice(0,5) : '',
    unread:c.nao_lidas||0, tags:c.tags||[], notas:c.notas||'', rating:c.rating,
    atendente: c.atendente_id ? ((EQUIPE.find(p=>p.id===c.atendente_id)||{}).nome||'—') : '— Bot —',
    setor: c.setor||'Suporte', preview: c.ultima_msg||'', botAtivo: c.bot_ativo,
    cliente:{
      plano: snap.plano||'—', desde: snap.desde||'—',
      contrato: snap.contrato || (c.cliente_ixc_id?'Ativo':'Lead'),
      financeiro: snap.financeiro||'—', bloqueado: !!snap.bloqueado,
      atraso: snap.atraso||0, faturas: snap.faturas||0, valor: snap.valor||0,
      vencimento: snap.vencimento, previsaoBloqueio: snap.previsaoBloqueio,
      sup30: snap.sup30||0, recorrente: snap.recorrente, lead: !c.cliente_ixc_id,
    },
    msgs: [], sups: snap.sups||[],
    clienteVinculado: c.cliente_ixc_id ? {
      id: c.cliente_ixc_id, nome: snap.nome || c.contato_nome,
      cpf: snap.cpf || null, plano: snap.plano || null,
    } : null,
    sugestao: (!c.cliente_ixc_id && c.cliente_sugerido_id) ? {
      id: c.cliente_sugerido_id, nome: c.cliente_sugerido_nome || ('cadastro #'+c.cliente_sugerido_id),
    } : null,
  };
}

async function recarregarConversas(){
  const j = await chamar('conversas.listar', {});
  const anteriores = new Map(state.conversas.map(c => [c.id, c]));
  state.conversas = (j.conversas||[]).map(c => {
    const nova = mapearConversa(c);
    const antiga = anteriores.get(nova.id);
    if (antiga) {
      nova.msgs = antiga.msgs;
      nova._msgsCarregadas = antiga._msgsCarregadas;
    }
    return nova;
  });
  renderAll();
}

async function carregarTudo(){

  (j.setores||[]).forEach(s=>SETORES.push({ id:s.nome, cor:s.cor }));

  state.rules    = (j.regras||[]).map(r=>({ id:r.id, kw:r.palavra, acao:r.acao }));

/* --- tempo real: mensagem nova aparece sem F5 --- */
function ligarRealtime(){
  const sb = _sb(); if(!sb) return;
  sb.channel('atend')
    .on('postgres_changes', { event:'*', schema:'public', table:'atend_conversas' }, async ()=>{
      try{ await recarregarConversas(); }catch(e){}
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'atend_mensagens' }, async (p)=>{
      const c = state.conversas.find(x=>x.id===p.new.conversa_id);
      if(!c) return;
      if(modalId===c.id){ await api.carregarMensagens(c); openModal(c.id); }
      if(p.new.direcao==='in') tocarAlerta();
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'atend_chat_interno' }, ()=>{
      recarregarChat().catch(()=>{});
    })
    .subscribe();
}

let _audioCtx=null;
function tocarAlerta(){
  try{
    _audioCtx = _audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=_audioCtx.createOscillator(), g=_audioCtx.createGain();
    o.connect(g); g.connect(_audioCtx.destination);
    o.frequency.value=880; g.gain.setValueAtTime(.08,_audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,_audioCtx.currentTime+.25);
    o.start(); o.stop(_audioCtx.currentTime+.25);
  }catch(e){}
}

function _lgErro(msg){ const el=$('#lg-erro'); el.innerHTML=msg; el.classList.add('show'); }
function _lgLimpa(){ $('#lg-erro').classList.remove('show'); }

async function fazerLogin(ev){
  if(ev) ev.preventDefault();
  _lgLimpa();
  const sb=_sb();
  if(!sb){ _lgErro('Componente de autenticação indisponível. Recarregue a página.'); return; }
  const email=($('#lg-email').value||'').trim().toLowerCase();
  const senha=$('#lg-senha').value||'';
  if(!email||!senha){ _lgErro('Informe e-mail e senha.'); return; }
  const btn=$('#lg-btn'); btn.disabled=true; btn.textContent='Verificando acesso…';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password:senha });
    if(error||!data.user){ _lgErro('E-mail ou senha incorretos.'); return; }
    const { data:ok } = await sb.rpc('tem_atendimento', { p_id:data.user.id });
    if(ok!==true){
      await sb.auth.signOut();
      _lgErro('Seu usuário <b>não tem acesso liberado</b> ao Centro de Atendimento.<br>Peça a um administrador para marcar <b>“Atendimento”</b> no cadastro de usuários do MoviOn.');
      return;
    }
    await entrar(data.session);
  }catch(e){
    _lgErro('Falha ao entrar: '+e.message);
  }finally{
    btn.disabled=false; btn.textContent='Entrar';
  }
}

async function entrar(session){
  TOKEN = session.access_token;
  $('#tela-login').style.display='none';
  $('#carregando').classList.add('show');
  try{
    await carregarTudo();
    renderUsuarioRodape();
    $('#sectorSel').value = meuSetor;
    $('#carregando').classList.remove('show');
    $('#shell').style.display='';
    renderAll();
    ligarRealtime();
  }catch(e){
    $('#carregando').classList.remove('show');
    $('#tela-login').style.display='';
    _lgErro('Não foi possível carregar os dados: '+e.message);
  }
}

function passa(c){
  if(meuSetor!=='todos' && c.setor!==meuSetor) return false;
  if(busca && !(c.nome.toLowerCase().includes(busca)||c.fone.includes(busca)||c.preview.toLowerCase().includes(busca))) return false;
  if(filtroTag && !c.tags.includes(filtroTag)) return false;
  if(filtroRisco && !emRisco(c)) return false;
  return true;
}
function statusBadge(col){
  return {novos:['novo','Novo'],atendimento:['atend','Atendimento'],aguardando:['aguard','Aguardando'],resolvidos:['resolv','Resolvido']}[col];
}
function renderBoard(){
  const b=$('#board');
  b.innerHTML=COLS.map(col=>{

    el.ondragend=()=>el.classList.remove('dragging');
  });
  b.querySelectorAll('.col-body').forEach(z=>{
    z.ondragover=e=>{ e.preventDefault(); z.classList.add('dragover'); };
    z.ondragleave=()=>z.classList.remove('dragover');

    };

function abrirBuscaCliente(c, aoVincular){
  const ov=document.createElement('div');
  ov.className='cli-overlay';
  ov.innerHTML=`<div class="cli-modal">
    <div class="cli-head"><h3>Selecionar Cliente</h3><button class="m-close" id="cliFechar">✕</button></div>
    <div class="cli-busca">
      <input id="cliTermo" placeholder="Nome, CPF/CNPJ ou telefone..." autocomplete="off">
      <button class="btn primary" id="cliBuscar">Buscar</button>
    </div>
    <div class="cli-lista" id="cliLista">
      <div class="cli-vazio">Digite o nome do cliente, o CPF ou o telefone para localizar o cadastro.</div>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick=ev=>{ if(ev.target===ov) ov.remove(); };
  ov.querySelector('#cliFechar').onclick=()=>ov.remove();

  const inp=ov.querySelector('#cliTermo');
  const lista=ov.querySelector('#cliLista');
  inp.focus();

  const buscar=async()=>{
    const termo=inp.value.trim();
    if(termo.length<2){ lista.innerHTML='<div class="cli-vazio">Digite ao menos 2 caracteres.</div>'; return; }
    lista.innerHTML='<div class="cli-vazio">Buscando…</div>';
    try{
      const res=await api.buscarClientes(termo);
      if(!res.length){ lista.innerHTML='<div class="cli-vazio">⚠️<br>Nenhum cliente encontrado</div>'; return; }
      lista.innerHTML=res.map(cl=>`
        <div class="cli-item" data-ixc="${esc(cl.ixc_id)}">
          <div class="cc-av" style="background:${avColor(Number(cl.ixc_id)||1)}">${ini(cl.nome||'?')}</div>
          <div class="ci-info">
            <div class="ci-nome">${esc(cl.nome||'—')}</div>
            <div class="ci-end">${esc(cl.endereco||'sem endereço')}${cl.cnpj?' · '+esc(cl.cnpj):''}</div>
          </div>
          <span class="ci-tag ${cl.ativo?'on':''}">${cl.ativo?'ATIVO':'INATIVO'}</span>
        </div>`).join('');
      lista.querySelectorAll('[data-ixc]').forEach(el=>el.onclick=async()=>{
        const nome=el.querySelector('.ci-nome').textContent;
        if(!confirm(`Vincular o número ${c.fone} ao cadastro de ${nome}?\n\nA partir de agora o bot não vai mais pedir CPF nesse número.`)) return;
        lista.innerHTML='<div class="cli-vazio">Vinculando…</div>';
        try{ await aoVincular(el.dataset.ixc); ov.remove(); }
        catch(err){ toast('Falha: '+err.message); buscar(); }
      });
    }catch(err){ lista.innerHTML=`<div class="cli-vazio" style="color:var(--red)">${esc(err.message)}</div>`; }
  };
  ov.querySelector('#cliBuscar').onclick=buscar;
  inp.onkeydown=ev=>{ if(ev.key==='Enter') buscar(); };
}

          <div class="vinc-sub">${c.clienteVinculado.cpf?esc(c.clienteVinculado.cpf):''}${c.clienteVinculado.plano?' · '+esc(c.clienteVinculado.plano):''}</div>
          <div class="vinc-acts">
            <button class="vinc-btn" id="mTrocarCli">Trocar cadastro</button>
            <button class="vinc-btn desf" id="mDesvincular">Desvincular</button>
          </div>
        </div>
      ` : `
        <div class="vinc-box vazio">
          <div class="vinc-none">Nenhum cliente associado!</div>
          <button class="vinc-btn solid" id="mVincular">🔎 Associar a um cadastro</button>
          ${c.sugestao ? `
            <div class="vinc-sug">
              <div class="vs-t">CPF INFORMADO AO BOT APONTA PARA:</div>
              <div class="vs-n">${esc(c.sugestao.nome)}</div>
              <div class="vinc-acts" style="justify-content:flex-start;">
                <button class="vinc-btn solid" id="mAceitarSug">Vincular este cadastro</button>
              </div>
            </div>` : ''}
        </div>
      `}
    </div>
    <div class="ms-sec"><div class="pills">${pillCont}${pillFin}${pillBloq}</div></div>
    ${cl.lead?'':`
    <div class="ms-sec">
      <h3>Financeiro</h3>
      <div class="igrid">
        <div class="icell"><div class="il">Faturas em aberto</div><div class="iv" style="color:${cl.faturas?'var(--red)':'var(--green-deep)'}">${cl.faturas} · R$ ${cl.valor.toFixed(2).replace('.',',')}</div></div>
        <div class="icell"><div class="il">Dias de atraso</div><div class="iv" style="color:${cl.atraso?'#b45309':'var(--green-deep)'}">${cl.atraso} dias</div></div>
        <div class="icell"><div class="il">Vencimento</div><div class="iv">${esc(cl.vencimento||'—')}</div></div>
        <div class="icell"><div class="il">Previsão de bloqueio</div><div class="iv" style="color:${cl.atraso?'var(--red)':'var(--green-deep)'}">${esc(cl.previsaoBloqueio||'—')}</div></div>
      </div>
    </div>
    <div class="ms-sec">
      <h3>Ações rápidas</h3>
      <div class="acts">
        <div class="act hi" data-act="Fatura enviada via WhatsApp">📄 Enviar fatura</div>
        <div class="act" data-act="2ª via do boleto enviada">💳 2ª via boleto</div>
        <div class="act" data-act="Contrato aberto">📑 Ver contrato</div>
        <div class="act" data-act="Extrato enviado">📊 Extrato</div>
      </div>
    </div>
    <div class="ms-sec">
      <h3>Suporte · últimos 30 dias</h3>
      <div class="sup-sum"><span class="n">${cl.sup30}</span><span class="l">chamados no período</span></div>
      ${c.sups.map(s=>`<div class="sup-line"><div><div class="st">${esc(s.n)}</div><div class="sd">${esc(s.d)}</div></div><span class="ss ${s.s}">${s.s==='ab'?'ABERTO':'RESOLVIDO'}</span></div>`).join('')||'<div style="font-size:11.5px;color:var(--text-low)">Nenhum chamado recente</div>'}
    </div>`}
    <div class="ms-sec">
      <h3>Como chegou aqui</h3>
      <div class="tl">${timeline.map((t,i)=>`<div class="tl-row ${i===timeline.length-1?'on':''}"><div class="tl-d"></div><div class="tl-t">${esc(t.txt)}<span class="tl-h">${esc(t.h||'')}</span></div></div>`).join('')}</div>
    </div>
    <div class="ms-sec">
      <h3>Mensagens agendadas</h3>
      ${meusAg.map(ag=>`<div class="sched-item"><div><div class="sc-txt">${esc(ag.texto)}</div><div class="sc-time">${esc(ag.quando)}</div></div><span class="sc-cancel" data-agcancel="${ag.id}">✕</span></div>`).join('')||'<div class="sched-empty">Nenhuma agendada para esta conversa.</div>'}
    </div>
    <div class="ms-sec">
      <h3>Etiquetas</h3>
      <div class="tagrow">
        ${state.tags.map(t=>`<span class="cc-tag ${c.tags.includes(t)?'':''}" data-tg="${esc(t)}" style="${c.tags.includes(t)?'background:var(--green-soft);color:var(--green-deep);':''}">${esc(t)}</span>`).join('')}
      </div>
    </div>
    <div class="ms-sec">
      <h3>Situação do atendimento</h3>
      <select class="transf" id="mColuna">${COLS.map(k=>`<option value="${k.id}" ${k.id===c.col?'selected':''}>${k.nome}</option>`).join('')}</select>
    </div>
    <div class="ms-sec">
      <h3>Setor</h3>
      <select class="transf" id="mSetor">${SETORES.map(s=>`<option ${s.id===c.setor?'selected':''}>${s.id}</option>`).join('')}</select>
    </div>
    <div class="ms-sec">
      <h3>Atendente responsável</h3>
      <select class="transf" id="mTransf">${ATENDENTES.map(a=>`<option ${a===c.atendente?'selected':''}>${a}</option>`).join('')}</select>
    </div>
    <div class="ms-sec">
      <h3>Notas internas</h3>
      <textarea class="notas" id="mNotas" placeholder="Visível só para a equipe...">${esc(c.notas)}</textarea>
    </div>
    <div class="ms-sec">
      <h3>Automação</h3>
      <div class="ia-note">Fase atual: <b>menu + palavras-chave</b>.<br>Ponto de extensão reservado para <b>IA</b> — entrará como fallback sem alterar este fluxo.</div>
    </div>
  </div>`;

  $('#overlay').classList.add('open');
  $('#mClose').onclick=closeModal;
  $('#mThread').scrollTop=99999;

  // quick replies (só os que têm data-i; o botão "Agendar" tem handler próprio abaixo)
  document.querySelectorAll('.mq[data-i]').forEach(el=>el.onclick=()=>{ $('#mInput').value=state.atalhos[+el.dataset.i].m; $('#mInput').focus(); });
  // send
  const send=()=>{
    const v=$('#mInput').value.trim(); if(!v)return;
    c.msgs.push({t:'out',x:v,h:new Date().toTimeString().slice(0,5)});
    c.preview='Você: '+v;
    if(c.col==='novos'){ c.col='atendimento'; }
    c.atendente=USUARIO.nome; c.botAtivo=false;
    $('#mInput').value='';
    openModal(c.id); renderAll();
    api.enviarMensagem(c,v).catch(err=>toast('Falha ao enviar: '+err.message));
  };
  $('#mSend').onclick=send;
  $('#mInput').onkeydown=e=>{ if(e.key==='Enter') send(); };
  // ações rápidas
  document.querySelectorAll('.act').forEach(el=>el.onclick=()=>{
    const txt='📎 '+el.dataset.act+'.';
    c.msgs.push({t:'out',x:txt,h:new Date().toTimeString().slice(0,5)});
    openModal(c.id); toast(el.dataset.act);
    api.enviarMensagem(c,txt).catch(err=>toast('Falha: '+err.message));
  });
  // tags toggle
  document.querySelectorAll('[data-tg]').forEach(el=>el.onclick=()=>{
    const t=el.dataset.tg;
    c.tags.includes(t)? c.tags=c.tags.filter(x=>x!==t) : c.tags.push(t);
    api.patchConversa(c,{tags:c.tags}); openModal(c.id); renderAll();
  });
  // transferir
  $('#mTransf').onchange=e=>{ c.atendente=e.target.value; const p=EQUIPE.find(x=>x.nome===c.atendente); api.patchConversa(c,{atendente_id:p?p.id:null}); renderAll(); toast('Transferido para '+c.atendente); };
  // abas mobile
  document.querySelectorAll('.m-aba').forEach(el=>el.onclick=()=>{
    const alvo=el.dataset.aba;
    document.querySelectorAll('.m-aba').forEach(x=>x.classList.toggle('on',x===el));
    $('#modal').querySelector('.m-chat').classList.toggle('oculto',alvo!=='chat');
    $('#modal').querySelector('.m-side').classList.toggle('visivel',alvo==='cliente');
  });
  // mover de coluna (no celular substitui o arrastar)
  $('#mColuna').onchange=e=>{
    c.col=e.target.value;
    api.patchConversa(c,{coluna:c.col});
    renderAll(); toast('→ '+COLS.find(k=>k.id===c.col).nome);
  };
  // vínculo do número com o cadastro do cliente (sempre manual)
  const recarregarEAbrir=async()=>{ await recarregarConversas(); const at=state.conversas.find(x=>x.id===c.id); if(at) openModal(at.id); };
  const vincular=async(ixc)=>{ await api.vincular(c, ixc); await recarregarEAbrir(); toast('Número vinculado ao cadastro'); };

  const bVinc=$('#mVincular');
  if(bVinc) bVinc.onclick=()=>abrirBuscaCliente(c, vincular);

  const bTroca=$('#mTrocarCli');
  if(bTroca) bTroca.onclick=()=>abrirBuscaCliente(c, vincular);

  const bSug=$('#mAceitarSug');
  if(bSug) bSug.onclick=async()=>{
    if(!confirm(`Vincular o número ${c.fone} ao cadastro de ${c.sugestao.nome}?\n\nO bot deixa de pedir CPF nesse número.`)) return;
    bSug.disabled=true;
    try{ await vincular(c.sugestao.id); }
    catch(err){ bSug.disabled=false; toast('Falha: '+err.message); }
  };

  const bDesv=$('#mDesvincular');
  if(bDesv) bDesv.onclick=async()=>{
    if(!confirm('Desvincular este número do cadastro?\n\nO bot volta a pedir o CPF quando esse número entrar em contato.')) return;
    try{ await api.desvincular(c); await recarregarEAbrir(); toast('Número desvinculado'); }
    catch(err){ toast('Falha: '+err.message); }
  };

  // controle do bot: assumir / devolver / finalizar
  const bAssumir=$('#mAssumir');
  if(bAssumir) bAssumir.onclick=async()=>{
    const avisar=confirm('Assumir este atendimento?\n\nOK = avisa o cliente que você entrou na conversa\nCancelar = assume em silêncio');
    bAssumir.disabled=true;
    try{
      await api.assumir(c, avisar);
      c.botAtivo=false; c.atendente=USUARIO.nome;
      if(c.col==='novos') c.col='atendimento';
      await api.carregarMensagens(c);
      openModal(c.id); renderAll(); toast('Atendimento assumido');
    }catch(err){ bAssumir.disabled=false; toast('Falha: '+err.message); }
  };

  const bDevolver=$('#mDevolver');
  if(bDevolver) bDevolver.onclick=async()=>{
    if(!confirm('Devolver esta conversa para o bot? Ele volta a responder automaticamente.')) return;
    try{ await api.devolverBot(c); c.botAtivo=true; openModal(c.id); renderAll(); toast('Bot reativado'); }
    catch(err){ toast('Falha: '+err.message); }
  };

  const bFim=$('#mFinalizar');
  if(bFim) bFim.onclick=async()=>{
    const msg=prompt('Finalizar atendimento.\n\nMensagem de despedida (deixe em branco para encerrar sem avisar):',
      'Atendimento encerrado. Qualquer coisa é só chamar. A MoviOn agradece! 💚');
    if(msg===null) return;
    bFim.disabled=true;
    try{
      await api.finalizar(c, msg.trim()||null);
      c.col='resolvidos'; c.botAtivo=true;
      closeModal(); renderAll(); toast('Atendimento finalizado');
    }catch(err){ bFim.disabled=false; toast('Falha: '+err.message); }
  };

  // clicar na imagem abre ampliada
  document.querySelectorAll('[data-zoom]').forEach(el=>el.onclick=()=>{
    const lb=document.createElement('div');
    lb.className='midia-lightbox';
    lb.innerHTML=`<img src="${el.dataset.zoom}" alt="Anexo ampliado">`;
    lb.onclick=()=>lb.remove();
    document.body.appendChild(lb);
  });

  // setor
  $('#mSetor').onchange=e=>{ c.setor=e.target.value; api.patchConversa(c,{setor:c.setor}); renderAll(); toast('Movido para o setor '+c.setor); };
  // notas
  $('#mNotas').onchange=e=>{ c.notas=e.target.value; api.patchConversa(c,{notas:c.notas}); toast('Nota salva'); };
  // renomear contato
  $('#mRename').onclick=()=>{
    const novo=prompt('Novo nome do contato:', c.nome);
    if(novo && novo.trim()){ c.nome=novo.trim(); api.patchConversa(c,{contato_nome:c.nome}); openModal(c.id); renderAll(); toast('Contato renomeado'); }
  };
  // agendar mensagem
  $('#mAgendar').onclick=()=>{
    const texto=prompt('Mensagem a agendar:'); if(!texto||!texto.trim())return;
    const quando=prompt('Quando enviar? (data e hora)', new Date(Date.now()+864e5).toISOString().slice(0,16).replace('T',' '));
    if(!quando)return;
    const iso=quando.trim().replace(' ','T');
    if(isNaN(Date.parse(iso))){ toast('Data inválida. Use AAAA-MM-DD HH:MM'); return; }
    api.criarAgendamento(c.id,texto.trim(),iso)
      .then(()=>{ openModal(c.id); toast('Mensagem agendada'); })
      .catch(err=>toast('Falha: '+err.message));
  };
  document.querySelectorAll('[data-agcancel]').forEach(el=>el.onclick=()=>{
    api.cancelarAgendamento(el.dataset.agcancel)
      .then(()=>{ openModal(c.id); toast('Agendamento cancelado'); })
      .catch(err=>toast('Falha: '+err.message));
  });
}
function closeModal(){ $('#overlay').classList.remove('open'); modalId=null; renderAll(); }
$('#overlay').onclick=e=>{ if(e.target.id==='overlay') closeModal(); };

/* ================= AUX VIEWS ================= */

  const a=$('#auxview'); const b=$('#board'); const fb=$('#filterbar'); const k=$('#kpis');
  if(view==='kanban'){ a.style.display='none'; b.style.display='grid'; k.style.display='grid'; return; }

  a.style.display='block';
  if(view==='etiquetas'){
    a.innerHTML=`<div class="viewbox"><h2>Etiquetas</h2><div class="vsub">Categorize conversas e filtre o Kanban por etiqueta.</div>
      ${state.tags.map((t,i)=>`<div class="rule-line"><span class="rule-kw">${esc(t)}</span><span class="rule-desc">${state.conversas.filter(c=>c.tags.includes(t)).length} conversa(s)</span><span class="rule-del" data-i="${i}">✕</span></div>`).join('')}
      <div class="add-row"><input id="newTag" placeholder="Nova etiqueta..."><button class="btn primary" id="addTag">Adicionar</button></div></div>`;
    $('#addTag').onclick=()=>{ const v=$('#newTag').value.trim(); if(v && !state.tags.includes(v)){ chamar('catalogo.salvar',{tipo:'etiquetas',registro:{nome:v}}).then(j=>{ETIQ_ID[v]=j.registro.id;state.tags.push(v);renderAux();}).catch(err=>toast('Falha: '+err.message)); } };
    a.querySelectorAll('.rule-del').forEach(el=>el.onclick=()=>{ const t=state.tags[+el.dataset.i]; chamar('catalogo.salvar',{tipo:'etiquetas',remover:ETIQ_ID[t]}).then(()=>{ state.tags.splice(state.tags.indexOf(t),1); delete ETIQ_ID[t]; state.conversas.forEach(c=>c.tags=c.tags.filter(x=>x!==t)); renderAux(); }).catch(err=>toast('Falha: '+err.message)); });
  }
  else if(view==='atalhos'){
    a.innerHTML=`<div class="viewbox"><h2>Atalhos (respostas rápidas)</h2><div class="vsub">Aparecem acima do campo de mensagem em toda conversa.</div>
      ${state.atalhos.map((x,i)=>`<div class="rule-line"><span class="rule-kw">⚡ ${esc(x.t)}</span><span class="rule-desc">${esc(x.m)}</span><span class="rule-del" data-i="${i}">✕</span></div>`).join('')}

  }
  else if(view==='config'){
    a.innerHTML=`<div class="viewbox">
      <h2>Configurações</h2>
      <div class="cfg-tabs" id="cfgTabs">
        <div class="cfg-tab ${configTab==='regras'?'on':''}" data-tab="regras">Auto-responder</div>

      </div>
      <div id="cfgBody"></div>
    </div>`;

      if(configTab==='integracoes' && el.dataset.tab!=='integracoes') pararPollWA();

        ${state.rules.map((r,i)=>`<div class="rule-line"><span class="rule-kw">"${esc(r.kw)}"</span><span class="rule-arrow">→</span><span class="rule-desc">${esc(r.acao)}</span><span class="rule-del" data-i="${i}">✕</span></div>`).join('')}
        <div class="add-row"><input id="rKw" placeholder="Palavra-chave..." style="flex:0 0 160px;"><input id="rAc" placeholder="Ação/resposta automática..."><button class="btn primary" id="addR">Adicionar</button></div>
        <div class="ia-note" style="margin-top:16px;">🔌 <b>Ponto de extensão IA:</b> quando ativada, a IA será consultada quando nenhuma palavra-chave ou opção de menu corresponder — este cadastro continua valendo como camada prioritária (mais barata e previsível).</div>`;
      $('#addR').onclick=()=>{ const k=$('#rKw').value.trim(),ac=$('#rAc').value.trim(); if(k&&ac){ chamar('catalogo.salvar',{tipo:'regras',registro:{palavra:k,acao:ac}}).then(j=>{state.rules.push({id:j.registro.id,kw:k,acao:ac});renderAux();}).catch(err=>toast('Falha: '+err.message)); } };
      body.querySelectorAll('.rule-del').forEach(el=>el.onclick=()=>{ const rg=state.rules[+el.dataset.i]; chamar('catalogo.salvar',{tipo:'regras',remover:rg.id}).then(()=>{ state.rules=state.rules.filter(x=>x!==rg); renderAux(); }).catch(err=>toast('Falha: '+err.message)); });

    a.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openModal(+el.dataset.id));

  else if(view==='relatorios'){

    a.innerHTML=`<div class="viewbox"><h2>Relatórios</h2><div class="vsub">Métricas do período (demonstração).</div>

      <div class="igrid" style="grid-template-columns:repeat(3,1fr);">${porSetor}</div></div>`;
  }

    a.innerHTML=`<div class="viewbox" style="max-width:900px;"><h2>Mensagens agendadas</h2><div class="vsub">Lembretes e envios programados por conversa.</div>
      ${items.map(ag=>{ const c=state.conversas.find(x=>x.id===ag.convId); return `<div class="rule-line" data-agid="${ag.id}">
        <div class="cc-av" style="background:${c?avColor(c.id):'#94a3b8'};width:30px;height:30px;font-size:11px;">${c?ini(c.nome):'?'}</div>
        <span class="rule-kw" style="background:#eef2f6;color:var(--text);">${c?esc(c.nome):'Conversa removida'}</span>
        <span class="rule-desc">${esc(ag.texto)}</span>
        <span class="rule-desc" style="flex:0 0 auto;color:var(--green-deep);font-weight:700;">${esc(ag.quando)}</span>
        <span class="rule-del" data-agdel="${ag.id}">✕</span></div>`; }).join('') || '<div class="sched-empty">Nenhuma mensagem agendada.</div>'}
      </div>`;
    a.querySelectorAll('[data-agdel]').forEach(el=>el.onclick=()=>{ api.cancelarAgendamento(el.dataset.agdel).then(()=>{renderAux();toast('Agendamento cancelado');}).catch(err=>toast('Falha: '+err.message)); });
  }
  else if(view==='chatinterno'){
    renderChatInterno(a);
  }
  else if(view==='fluxo'){
    renderFluxo(a);
  }
}

/* ================= INTEGRAÇÕES (WhatsApp) — vive dentro da aba de Configurações ================= */
let _waPoll=null, _waQrTimer=null;
function pararPollWA(){ if(_waPoll){ clearInterval(_waPoll); _waPoll=null; } if(_waQrTimer){ clearTimeout(_waQrTimer); _waQrTimer=null; } }

async function renderIntegracoes(body){
  body.innerHTML=`<div class="vsub">Conexão do WhatsApp usada pelo MoviTalk (Evolution API).</div>
    <div class="wa-card" id="waCard">
      <div class="wa-status-row mid" id="waStatusRow"><span class="wa-status-dot"></span>Verificando conexão…</div>
      <div id="waBody"></div>
    </div>`;
  await atualizarStatusWA();
}

function pintarStatus(status){
  const row=$('#waStatusRow'); if(!row) return;
  const map={
    open:      {cls:'on',  txt:'Conectado'},
    connecting:{cls:'mid', txt:'Aguardando leitura do QR Code'},
    close:     {cls:'off', txt:'Desconectado'},
    nao_criada:{cls:'off', txt:'Nenhuma instância criada ainda'},
    erro:      {cls:'off', txt:'Não foi possível falar com a Evolution API'},
  };
  const m=map[status]||{cls:'mid',txt:status};
  row.className='wa-status-row '+m.cls;
  row.innerHTML=`<span class="wa-status-dot"></span>${esc(m.txt)}`;
}

async function atualizarStatusWA(){
  const body=$('#waBody'); if(!body) return;
  try{
    const j=await chamar('whatsapp.status',{});
    if(!j.existe){
      pintarStatus('nao_criada');
      body.innerHTML=`<p style="font-size:12.5px;color:var(--text-mid);margin:0 0 16px;line-height:1.6;">
        Ainda não existe nenhuma instância do WhatsApp configurada nesta Evolution API.</p>
        <button class="btn primary" id="btnCriarWA">Criar instância e conectar</button>`;
      $('#btnCriarWA').onclick=criarInstanciaWA;
      pararPollWA();
      return;
    }
    pintarStatus(j.status);
    if(j.status==='open'){
      body.innerHTML=`<div class="wa-num">✅ WhatsApp conectado</div>
        <div class="wa-sub">O MoviTalk já está recebendo e enviando mensagens por este número.</div>
        <div class="wa-actions"><button class="fbtn" id="btnDesconWA">Desconectar este número</button></div>`;
      $('#btnDesconWA').onclick=desconectarWA;
      pararPollWA();
    } else {
      // desconectada ou conectando: mostra o QR e fica de olho até conectar
      await mostrarQR();
      if(!_waPoll) _waPoll=setInterval(async()=>{
        const s=await chamar('whatsapp.status',{}).catch(()=>null);
        if(s && s.status==='open'){ pararPollWA(); await atualizarStatusWA(); }
      },4000);
    }
  }catch(err){
    pintarStatus('erro');
    body.innerHTML=`<p style="font-size:12px;color:var(--red);">${esc(err.message)}</p>`;
    pararPollWA();
  }
}

async function criarInstanciaWA(){
  const body=$('#waBody');
  body.innerHTML=`<p style="font-size:12px;color:var(--text-low);">Criando instância…</p>`;
  try{ await chamar('whatsapp.criar',{}); await atualizarStatusWA(); }
  catch(err){ body.innerHTML=`<p style="font-size:12px;color:var(--red);">${esc(err.message)}</p>`; }
}

async function mostrarQR(){
  const body=$('#waBody'); if(!body) return;
  body.innerHTML=`
    <div class="wa-qr-box" id="waQrBox"><span class="wa-load">Gerando QR Code…</span></div>
    <div class="wa-qr-timer" id="waQrTimer"></div>
    <p style="font-size:11.5px;color:var(--text-low);line-height:1.6;max-width:340px;margin:8px auto 14px;">
      Abra o WhatsApp no celular que será o número oficial da MoviOn →
      <b>Aparelhos conectados</b> → <b>Conectar um aparelho</b> → aponte a câmera para o código acima.
      <br>Por segurança do WhatsApp, o código expira sozinho e é renovado automaticamente.
    </p>
    <div class="wa-actions"><button class="fbtn" id="btnNovoQR">🔄 Gerar novo QR Code agora</button></div>`;
  $('#btnNovoQR').onclick=()=>{ if(_waQrTimer){ clearTimeout(_waQrTimer); _waQrTimer=null; } mostrarQR(); };
  if(_waQrTimer){ clearTimeout(_waQrTimer); _waQrTimer=null; }
  try{
    const j=await chamar('whatsapp.qrcode',{});
    const box=$('#waQrBox');
    if(j.conectado){ await atualizarStatusWA(); return; }
    const puro = j.base64 && j.base64.includes(',') ? j.base64.split(',').pop() : j.base64;
    if(box) box.innerHTML=`<img src="data:image/png;base64,${puro}" alt="QR Code do WhatsApp">`;
    iniciarContagemQR(25);
  }catch(err){
    const box=$('#waQrBox');
    if(box) box.innerHTML=`<span class="wa-load" style="color:var(--red)">Falha ao gerar: ${esc(err.message)}</span>`;
  }
}

// renova o QR sozinho pouco antes de expirar, sem o atendente precisar clicar em nada
function iniciarContagemQR(segundos){
  let restam=segundos;
  const lbl=$('#waQrTimer');
  const tick=()=>{
    const el=$('#waQrTimer'); if(!el) return; // saiu da tela
    el.textContent = restam>0 ? `renovando em ${restam}s…` : 'renovando…';
    if(restam<=0){ if(_waQrTimer){ clearTimeout(_waQrTimer); } mostrarQR(); return; }
    restam--;
    _waQrTimer=setTimeout(tick,1000);
  };
  if(lbl) tick();
}

async function desconectarWA(){
  if(!confirm('Desconectar este número do MoviTalk? Será preciso escanear o QR Code de novo depois.')) return;
  try{ await chamar('whatsapp.desconectar',{}); await atualizarStatusWA(); }
  catch(err){ toast('Falha: '+err.message); }
}

      <div class="ci-thread" id="ciThread">

function fnEl(id){ return document.querySelector(`.flow-node[data-fid="${id}"]`); }
let fluxoAtualId=null, fluxosLista=[];

async function renderFluxo(a){
  if(!fluxosLista.length){
    try{ fluxosLista = await api.listarBots(); }catch(err){ toast('Falha ao listar bots: '+err.message); }
  }

  // nenhum bot existe ainda: oferece criar o de exemplo (já publicado) ou do zero
  if(!fluxosLista.length){
    a.innerHTML=`<div class="viewbox" style="max-width:640px;"><h2>Nenhum bot criado ainda</h2>
      <div class="vsub">Crie o primeiro bot para o canal de atendimento responder.</div>
